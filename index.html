<script id="app">
'use strict';
/* =====================================================================
 * 고등학교 정기시험 선택과목 고정·이동반 응시현황 생성기 (v8)
 *  - 1·2·3학년 명단 동시 업로드 / 학년 자동 감지
 *  - 전출·위탁 등 자동 제외, 제외 인원을 뺀 '실제 인원' 기준 이동반 산정
 *  - 학년 > 학급 2단 선택
 *  - 학년별 시간표·과목코드 업로드 / 확인 / 직접 수정 (자기주도학습 포함)
 * ===================================================================== */
const { useState, useMemo, useEffect, useRef, Fragment } = React;
// 일반 사용자용 파일이면 관리자가 넣어 둔 결과 데이터가 여기에 들어 있다 (없으면 관리자 모드)
let VIEWER = window.__VIEWER__ || null; // 암호화된 파일은 비밀번호 확인 후 채워진다
const html = htm.bind(React.createElement);

const SELF = '자기주도학습';
const GRADES = [1, 2, 3];
const CONFIG_KEY = 'exam_generator_config_v8';
const DEFAULT_KEYWORDS = '전출, 위탁, 자퇴, 퇴학, 제적, 유예, 휴학, 결번';
const DEFAULT_LABELS = { 1: '9월 28일 월요일', 2: '9월 29일 화요일', 3: '9월 30일 수요일', 4: '10월 1일 목요일', 5: '10월 2일 금요일' };
const DEFAULT_MOVE = { dir: 'front', count: 18 };

// 학교 기본 과목코드 (첨부 양식 기준)
const DEFAULT_CODES = {
  1: [['01','공통국어2'],['02','공통수학2'],['03','공통영어2'],['04','한국사2'],['05','통합사회2'],['06','통합과학2'],['07','과학탐구실험2'],['08','체육2'],['09','인공지능 기초'],['10','알고리즘 설계']],
  2: [['01','화법과 언어'],['02','미적분Ⅰ'],['03','인공지능 수학'],['04','영어Ⅱ'],['05','도시의 미래 탐구'],['06','동아시아 역사 기행'],['07','법과 사회'],['08','윤리와 사상'],['09','사회문제 탐구'],['10','전자기와 양자'],['11','화학 반응의 세계'],['12','세포와 물질대사'],['13','지구시스템과학'],['14','융합과학 탐구'],['15','정보과학'],['16','심화 중국어'],['17','심화 일본어'],['18','언어생활과 한자'],['19','스포츠 생활1'],['20','음악'],['21','미술'],['22','로봇과 공학세계']],
  3: [['01','화법과 작문'],['02','언어와 매체'],['03','심화 국어'],['04','문학과 매체'],['05','미적분'],['06','확률과 통계'],['07','수학과제 탐구'],['08','인공지능 수학'],['09','영어 독해와 작문'],['10','진로 영어'],['11','심화 영어Ⅰ'],['12','세계지리'],['13','세계사'],['14','정치와 법'],['15','생활과 윤리'],['16','여행지리'],['17','사회문제 탐구'],['18','물리학Ⅱ'],['19','화학Ⅱ'],['20','생명과학Ⅱ'],['21','지구과학Ⅱ'],['22','생활과 과학'],['23','정보과학'],['24','스포츠 생활'],['25','체육 전공 실기 기초'],['26','음악 연주'],['27','미술 창작'],['28','중국어 회화Ⅰ'],['29','일본어 회화Ⅰ'],['31','생활과 한문']],
};
const defaultCodes = () => Object.fromEntries(GRADES.map(g => [g, DEFAULT_CODES[g].map(([code, name]) => ({ code, name }))]));

/* ---------------------------- 공통 유틸 ---------------------------- */
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '')
  .replace(/Ⅰ/g, 'i').replace(/Ⅱ/g, 'ii').replace(/Ⅲ/g, 'iii').replace(/Ⅳ/g, 'iv');
const isSelf = s => { const n = norm(s); return n === norm(SELF) || n === '자습'; };
const pad2 = v => { const m = String(v ?? '').match(/\d+/); return m ? String(parseInt(m[0], 10)).padStart(2, '0') : ''; };
const lastInt = v => { const m = String(v ?? '').split('.')[0].match(/\d+/g); return m ? parseInt(m[m.length - 1], 10) : null; };
const truthy = v => { const t = String(v ?? '').trim(); return !['', '.', '0', 'nan', 'NaN', '-', 'x', 'X', '×', 'false', 'FALSE', 'N'].includes(t); };
const parseKeywords = s => String(s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const clsKey = (g, c) => `${g}-${c}`;
const byNum = (a, b) => a.n - b.n;
const deepClone = o => JSON.parse(JSON.stringify(o));
const safeStorage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } },
};

function emptyTT() {
  return Object.fromEntries(GRADES.map(g => [g, { days: 5, periods: 3, labels: { ...DEFAULT_LABELS }, cells: {} }]));
}

/* ------------------------- 명단(학생) 파싱 ------------------------- */
const META_EXACT = new Set(['순번','번호','출석번호','no','신학번','학번','이름','성명','학생명','성별','반','학급','학년','배정','학기','학교지정','기초','일시','분반','구분','비고','총점','상태','합계','특이사항','학적','학적상태','생년월일','연락처','담임']);
const META_PAT = [/^\d+$/, /학기/, /택\s*\d/, /학교지정/, /배정/, /^$/, /[월화수목금]\)/, /unnamed/i, /__empty/i, /비고/, /학적/];
const isMetaCol = h => { const t = String(h ?? '').trim(); return META_EXACT.has(t.toLowerCase()) || META_PAT.some(r => r.test(t)); };
const gradeHint = s => { const m = String(s || '').match(/([1-3])\s*학년/); return m ? +m[1] : null; };
function parseIdNum(id) {
  const d = String(id || '').replace(/\D/g, '');
  if (/^[1-3]\d{4}$/.test(d)) return { g: +d[0], c: +d.slice(1, 3), n: +d.slice(3) };
  if (/^[1-3]\d{3}$/.test(d)) return { g: +d[0], c: +d[1], n: +d.slice(2) };
  return null;
}
function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = (rows[i] || []).map(c => String(c).trim());
    if (r.some(c => /^(이름|성명|학생명)$/.test(c)) && r.some(c => /^(반|학급|번호|출석번호|순번|학번|신학번)$/.test(c))) return i;
  }
  return -1;
}
const idxOf = (headers, cands) => { for (const c of cands) { const i = headers.indexOf(c); if (i >= 0) return i; } return -1; };

function parseRosterSheet(rows, sheetName, fileName, keywords) {
  const h = findHeaderRow(rows);
  if (h < 0) return null;
  const headers = rows[h].map(c => String(c ?? '').replace(/\s*\n\s*/g, ' ').trim());
  const ci = {
    grade: idxOf(headers, ['학년']), cls: idxOf(headers, ['반', '학급']),
    num: idxOf(headers, ['번호', '출석번호', '순번', 'No', 'no', 'NO']),
    name: idxOf(headers, ['이름', '성명', '학생명']), id: idxOf(headers, ['학번', '신학번']), gender: idxOf(headers, ['성별']),
  };
  const used = new Set(Object.values(ci).filter(i => i >= 0));
  const exclCols = [], subjCols = [];
  headers.forEach((hd, i) => {
    if (used.has(i) || !hd) return;
    if (keywords.some(k => hd.includes(k))) { exclCols.push(i); return; }
    if (isMetaCol(hd)) return;
    subjCols.push(i);
  });
  const subjSet = new Set(subjCols);
  const hint = gradeHint(sheetName) || gradeHint(fileName);
  const tmp = []; let skipped = 0;
  for (let r = h + 1; r < rows.length; r++) {
    const row = rows[r]; if (!row) continue;
    const cell = i => (i >= 0 ? String(row[i] ?? '').trim() : '');
    const name = cell(ci.name);
    if (!name || name === '.' || /^\d+$/.test(name) || /합계|소계|평균|총점/.test(name)) continue;
    let g = ci.grade >= 0 ? lastInt(cell(ci.grade)) : null;
    let c = ci.cls >= 0 ? lastInt(cell(ci.cls)) : null;
    let n = ci.num >= 0 ? lastInt(cell(ci.num)) : null;
    const idp = parseIdNum(cell(ci.id));
    if (idp) { if (!g) g = idp.g; if (!c) c = idp.c; if (!n) n = idp.n; }
    if (!c || c < 1 || c > 20 || !n || n < 1) { skipped++; continue; }
    if (!(g >= 1 && g <= 3)) g = null;
    // 전출·위탁 등 제외 판단: 과목 열을 뺀 모든 칸(이름·비고 등)에 키워드가 있으면 제외
    let reason = '';
    for (let i = 0; i < row.length && !reason; i++) {
      if (subjSet.has(i)) continue;
      const v = String(row[i] ?? '');
      const k = keywords.find(k => v.includes(k));
      if (k) reason = k;
    }
    if (!reason) for (const i of exclCols) if (truthy(row[i])) { reason = headers[i]; break; }
    const taken = subjCols.filter(i => truthy(row[i])).map(i => headers[i]);
    tmp.push({ g, c, n, id: cell(ci.id), name, gender: cell(ci.gender), taken, excluded: !!reason, reason });
  }
  const cnt = {}; tmp.forEach(s => { if (s.g) cnt[s.g] = (cnt[s.g] || 0) + 1; });
  const maj = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const fallback = hint || (maj ? +maj : null);
  const students = []; let unknownGrade = 0;
  tmp.forEach(s => { if (!s.g) s.g = fallback; if (!s.g) { unknownGrade++; return; } students.push(s); });
  const grades = [...new Set(students.map(s => s.g))];
  return { students, grades, subjectHeaders: subjCols.map(i => headers[i]), skipped, unknownGrade, sheetName, fileName };
}

// 여러 파일·여러 시트를 한 번에 합쳐서 학생 목록으로 만든다
function buildRoster(sources, keywords) {
  const map = new Map(); let dup = 0, skipped = 0, unknownGrade = 0;
  const subjects = { 1: new Set(), 2: new Set(), 3: new Set() };
  const sheets = [];
  sources.forEach(src => src.sheets.forEach(sh => {
    const res = parseRosterSheet(sh.rows, sh.name, src.fileName, keywords);
    if (!res || res.students.length === 0) return;
    skipped += res.skipped; unknownGrade += res.unknownGrade;
    res.grades.forEach(g => res.subjectHeaders.forEach(hd => subjects[g].add(hd)));
    sheets.push({ file: src.fileName, sheet: sh.name, grades: res.grades.sort(), count: res.students.length });
    res.students.forEach(s => { const k = `${s.g}-${s.c}-${s.n}`; if (map.has(k)) dup++; map.set(k, s); });
  }));
  const students = [...map.values()].map(s => ({ ...s, takenNorm: new Set(s.taken.map(norm)) }))
    .sort((a, b) => a.g - b.g || a.c - b.c || a.n - b.n);
  return {
    students, dup, skipped, unknownGrade, sheets,
    subjectsByGrade: Object.fromEntries(GRADES.map(g => [g, [...subjects[g]]])),
  };
}

/* ------------------------ 시간표·과목코드 파싱 ------------------------ */
function parseTTSheet(rows) {
  let hr = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) if ((rows[i] || []).some(c => /\d+\s*일차/.test(String(c)))) { hr = i; break; }
  if (hr < 0) return null;
  const dayCols = new Map();
  rows[hr].forEach((c, i) => { const m = String(c).match(/(\d+)\s*일차/); if (m) dayCols.set(i, +m[1]); });
  const labels = {};
  if (hr > 0) dayCols.forEach((d, i) => {
    const v = String(rows[hr - 1][i] ?? '').trim();
    if (v && !v.includes('날짜') && !v.includes('→')) labels[d] = v;
  });
  const cells = {}; let maxP = 0;
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const first = String(row[0] ?? '').trim();
    if (first.startsWith('※')) break;
    const m = first.match(/(\d+)\s*교시/) || first.match(/^(\d+)$/);
    if (!m) continue;
    const p = +m[1];
    dayCols.forEach((d, i) => {
      const v = String(row[i] ?? '').trim();
      if (!v || v === '-' || v.startsWith('※')) return;
      const subs = v.split(/[\/,\n]/).map(x => x.trim()).filter(Boolean);
      if (subs.length) { cells[`${d}-${p}`] = subs; maxP = Math.max(maxP, p); }
    });
  }
  return { days: Math.max(1, ...dayCols.values()), periods: Math.max(3, maxP), labels, cells };
}
function parseCodeSheet(rows) {
  const list = [];
  rows.forEach(row => {
    const code = String(row?.[0] ?? '').trim(), name = String(row?.[1] ?? '').trim();
    if (/^\d+$/.test(code) && name && !name.startsWith('※')) list.push({ code: pad2(code), name });
  });
  return list.sort((a, b) => +a.code - +b.code);
}
// 시간표에 적힌 과목명을 과목코드표/명단의 정식 이름으로 맞춘다 (띄어쓰기·로마숫자 차이 무시)
function canonicalName(sub, codeList, rosterSubs) {
  if (isSelf(sub)) return SELF;
  const n = norm(sub);
  const c = (codeList || []).find(x => norm(x.name) === n); if (c) return c.name;
  const r = (rosterSubs || []).find(x => norm(x) === n); if (r) return r;
  return sub;
}

/* ---------------------------- 이동반 계산 ---------------------------- */
// 제외(전출·위탁 등) 학생을 빼고 '실제 인원' 기준으로 count명을 이동반으로 보낸다
function splitClass(list, dir, count) {
  const all = [...list].sort(byNum);
  const act = all.filter(s => !s.excluded);
  let moved, fixed;
  if (dir === 'front') { moved = act.slice(0, count); fixed = act.slice(count); }
  else { const k = Math.max(0, act.length - count); fixed = act.slice(0, k); moved = act.slice(k); }
  return { moved, fixed, movedLabel: rangeLabel(moved), fixedLabel: rangeLabel(fixed) };
}
function rangeLabel(arr) {
  if (!arr.length) return '없음';
  const ns = arr.map(s => s.n), lo = Math.min(...ns), hi = Math.max(...ns), set = new Set(ns);
  const gaps = []; for (let i = lo; i <= hi; i++) if (!set.has(i)) gaps.push(i);
  return (lo === hi ? `${lo}번` : `${lo}~${hi}번`) + (gaps.length ? ` (${gaps.join(',')}번 제외)` : '');
}

/* ------------------------------ 샘플 데이터 ------------------------------ */
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function sampleSources() {
  const rnd = seeded(20261029);
  const names = ['김민수','이서준','박도윤','정하은','이지우','한민서','조서아','강도현','윤지호','장서윤','임주원','오하은','신예준','권나은','황지우','송시우','홍서연','배유준','백소율','전우진','손예린','서지호','남유진','문서준','안채원','유하린'];
  const pick = (arr, k) => [...arr].sort(() => rnd() - 0.5).slice(0, k);
  const sheets = [];
  // 1학년: 공통과목은 명단 열이 없음(전원 응시), 정보 계열 2과목 중 택1
  {
    const subs = ['인공지능 기초', '알고리즘 설계'];
    const rows = [['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]];
    for (let c = 1; c <= 3; c++) for (let n = 1; n <= 24; n++) {
      if (c === 3 && n === 7) continue; // 결번
      const choice = subs[Math.floor(rnd() * 2)];
      rows.push([1, c, n, `1${String(c).padStart(2, '0')}${String(n).padStart(2, '0')}`, names[(n + c) % names.length], n % 2 ? '남' : '여', '', ...subs.map(s => s === choice ? '1' : '')]);
    }
    sheets.push({ name: '1학년', rows });
  }
  // 2학년
  {
    const core = ['화법과 언어', '미적분Ⅰ', '영어Ⅱ'];
    const el = ['인공지능 수학','법과 사회','윤리와 사상','사회문제 탐구','전자기와 양자','화학 반응의 세계','세포와 물질대사','지구시스템과학','도시의 미래 탐구','정보과학','심화 중국어','심화 일본어'];
    const subs = [...core, ...el];
    const rows = [['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]];
    for (let c = 1; c <= 3; c++) for (let n = 1; n <= 25; n++) {
      const chosen = new Set([...core, ...pick(el, 5)]);
      const note = c === 2 && n === 5 ? '위탁' : '';
      rows.push([2, c, n, `2${String(c).padStart(2, '0')}${String(n).padStart(2, '0')}`, names[(n + c * 3) % names.length], n % 2 ? '남' : '여', note, ...subs.map(s => chosen.has(s) ? '1' : '')]);
    }
    sheets.push({ name: '2학년', rows });
  }
  // 3학년
  {
    const subs = ['화법과 작문','언어와 매체','미적분','확률과 통계','심화 영어Ⅰ','진로 영어','물리학Ⅱ','세계사','생활과 윤리','세계지리','화학Ⅱ','정치와 법','생명과학Ⅱ','일본어 회화Ⅰ'];
    const rows = [['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]];
    for (let c = 1; c <= 3; c++) for (let n = 1; n <= 26; n++) {
      const chosen = new Set([...pick(subs.slice(0, 2), 1), ...pick(subs.slice(2, 4), 1), ...pick(subs.slice(4, 6), 1), ...pick(subs.slice(6), 3)]);
      const note = (c === 1 && n === 12) ? '전출' : (c === 2 && n === 20) ? '자퇴' : '';

const slotLabel = (labels, e) => `${labels[e.day] || `${e.day}일차`} ${e.period}교시`;

function statusOf(g, e, df, takers) {
  if (e.self) return { kind: 'self', text: SELF, count: 0 };
  const t = takers(g, df, e.sub);
  if (!t.length) return { kind: 'none', text: '미응시', count: 0 };
  if (t.length === df.length) return { kind: 'all', text: `전원 응시(${t.length}명)`, count: t.length };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------- 칠판 부착용 B4 레이아웃 -------------------------
 * B4(JIS) 가로 364×257mm, 여백 좌우 3.8mm·상하 5.1mm
 * → 인쇄 가능 영역 약 1010pt × 700pt. 하루 = 1장.
 * 표 높이를 이 영역에 맞춰 행 높이를 정하고, 각 칸 글자가 들어가는 가장 큰 글씨 크기를 계산한다. */
const CB = { pageWmm: 364, pageHmm: 257, padXmm: 3.8, padYmm: 5.1, w: [141, 303, 566], gapTop: 4, titleH: 62, gapMid: 8, headH: 50, titleF: 44, headF: 28, maxRow: 190, maxF: 44, minF: 12, lineH: 1.45 };

function charEm(ch) {

  if (/[0-9]/.test(ch)) return 0.6;
  if (ch === ' ') return 0.3;
  if (/[,.]/.test(ch)) return 0.32;
  if (/[()]/.test(ch)) return 0.4;
  if (/[A-Z]/.test(ch)) return 0.72;

}
const textWidth = (s, f) => { let w = 0; for (const ch of s) w += charEm(ch); return w * f; };
function wrapCount(text, maxW, f) {

    lines++; let cur = 0;
    para.split(' ').forEach(word => {
      const ww = textWidth(word, f);
      if (cur > 0 && cur + sp + ww <= maxW) { cur += sp + ww; return; }
      if (cur > 0) lines++;

}

function chalkPagesFor(g, c, kind, ctx) {
  const { exams, tt, classStudents, move, takers } = ctx;
  const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
  const df = kind === '고정' ? sp.fixed : sp.moved;
  const range = kind === '고정' ? sp.fixedLabel : sp.movedLabel;
  const byDay = {};
  exams[g].forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e); });
  const days = Object.keys(byDay).map(Number).filter(d => byDay[d].some(e => !e.self)).sort((a, b) => a - b);
  const pages = days.map(d => {
    const rows = [...byDay[d]].sort((a, b) => a.period - b.period || (a.code || '99').localeCompare(b.code || '99'))
      .map(e => ({ e, st: statusOf(g, e, df, takers) }));
    rows.forEach((r, i) => {
      r.first = i === 0 || rows[i - 1].e.period !== r.e.period;
      if (r.first) { let k = i; while (k < rows.length && rows[k].e.period === r.e.period) k++; r.span = k - i; }
    });
    const rowH = Math.min(CB.maxRow, CB.avail / rows.length);
    const minOf = arr => (arr.length ? Math.min(...arr) : CB.maxF);
    const f3 = minOf(rows.filter(r => !r.e.self).map(r => fitFont(r.st.text, CB.w[2], rowH, CB.maxF)));
    // 과목명 칸: '과목명↵(코드)' 두 줄과 '과목명 (코드)' 한 줄 중 글씨가 더 커지는 쪽을 고른다

    const f2two = subFit(false), f2one = subFit(true);

    return { g, c, kind, day: d, label: tt[g].labels[d] || `${d}일차 시험 시간표`, head: `${g}학년 ${c}반 (${kind})`, rows, rowH, f1, f2, f3, subOne };
  });

}

/* ============================ 고사실 통계 (관리자) ============================
 * 고사실 = 본반(고정반) 교실. 본반 학생 + 다른 학년 이동반 학생이 함께 시험을 본다.

 * 기준 인원 이상이면 색으로 표시한다 (통+통은 1명 배치라 제외). */
const GUEST_OF = { 1: 3, 2: 1, 3: 2 }; // 1학년 교실 ← 3학년 이동반, 2학년 ← 1학년, 3학년 ← 2학년
const DEFAULT_THR = { ts: 22, st: 25, ss: 19 };

const COMBO = {
  ts: { label: '본(통)+이(선)', short: '통+선', color: '#A0B4E6', argb: 'FFA0B4E6' },
  st: { label: '본(선)+이(통)', short: '선+통', color: '#FFCEB0', argb: 'FFFFCEB0' },
  ss: { label: '본(선)+이(선)', short: '선+선', color: '#9BE5C8', argb: 'FF9BE5C8' },

const comboKey = (bt, gt) => (bt === '통' && gt === '선' ? 'ts' : bt === '선' && gt === '통' ? 'st' : bt === '선' && gt === '선' ? 'ss' : null);

// 기본 고사실 구성: 같은 반 번호의 지정 학년 이동반, 짝이 없는 이동반은 손님 없는 교실로
function defaultRoomMap(classesByGrade) {
  const map = {}, used = new Set();
  GRADES.forEach(g => classesByGrade[g].forEach(c => {
    const gg = GUEST_OF[g];
    if (classesByGrade[gg].includes(c)) { map[clsKey(g, c)] = clsKey(gg, c); used.add(clsKey(gg, c)); } else map[clsKey(g, c)] = '';
  }));
  const left = GRADES.flatMap(g => classesByGrade[g].map(c => clsKey(g, c))).filter(k => !used.has(k));
  GRADES.forEach(g => classesByGrade[g].forEach(c => {
    const h = clsKey(g, c);
    if (!map[h] && left.length) { const i = left.findIndex(k => +k.split('-')[1] === c); map[h] = left.splice(i >= 0 ? i : 0, 1)[0]; }
  }));
  return map;
}

function statsData(sx) {

  const parts = {}; // 'g-c' → {fixed, moved}
  GRADES.forEach(g => classesByGrade[g].forEach(c => { parts[clsKey(g, c)] = splitClass(classStudents(g, c), move[g].dir, move[g].count); }));
  const guestUse = {};
  const blocks = GRADES.filter(g => classesByGrade[g].length).map(g => {
    const rooms = classesByGrade[g].map(c => {
      const hk = clsKey(g, c), gk = roomMap[hk] || '';
      if (gk) guestUse[gk] = (guestUse[gk] || 0) + 1;
      const host = parts[hk].fixed, gg = gk ? +gk.split('-')[0] : null, guest = gk && parts[gk] ? parts[gk].moved : [];
      const cells = slots.map(s => {
        const n = count(g, host, s) + (gk ? count(gg, guest, s) : 0);
        const bt = typeAt(g, s), gt = gk ? typeAt(gg, s) : null;
        const ck = bt && gt ? comboKey(bt, gt) : null;
        const limit = ck ? thr[ck] : null;
        return { n, ck, over: limit != null && limit > 0 && n >= limit };
      });
      return { g, c, host: hk, hostN: host.length, guest: gk, guestN: guest.length, total: host.length + guest.length, cells };
    });
    // 블록 대표 조합 (가장 흔한 손님 학년 기준)
    const gc = {}; rooms.forEach(r => { if (r.guest) { const x = r.guest.split('-')[0]; gc[x] = (gc[x] || 0) + 1; } });
    const mg = +(Object.keys(gc).sort((a, b) => gc[b] - gc[a])[0] || GUEST_OF[g]);
    const types = slots.map(s => { const bt = typeAt(g, s), gt = typeAt(mg, s); return { bt, gt, label: bt && gt ? `${bt}+${gt}` : (bt || gt || '자습'), ck: bt && gt ? comboKey(bt, gt) : null }; });
    return { g, guestGrade: mg, rooms, types };
  });
  const all = blocks.flatMap(b => b.rooms);
  const totals = { hostN: all.reduce((a, r) => a + r.hostN, 0), guestN: all.reduce((a, r) => a + r.guestN, 0), total: all.reduce((a, r) => a + r.total, 0), cells: slots.map((s, i) => all.reduce((a, r) => a + r.cells[i].n, 0)) };
  const overs = { ts: 0, st: 0, ss: 0 }; all.forEach(r => r.cells.forEach(x => { if (x.over) overs[x.ck]++; }));
  const ttRows = slots.map(s => ({ ...s, date: dayLabel(s.d), time: times[s.p] || '', subs: GRADES.map(g => at(g, s).map(e => e.sub).join('/') || '') }));
  const edRows = slots.map(s => ({ ...s, date: dayLabel(s.d), time: times[s.p] || '', cells: GRADES.map(g => { const l = at(g, s); return { has: l.some(e => !e.self), self: l.length > 0 && l.every(e => e.self), name: editors[`${g}-${s.d}-${s.p}`] || '' }; }) }));
  const dupGuests = Object.keys(guestUse).filter(k => guestUse[k] > 1);
  const unplaced = Object.keys(parts).filter(k => parts[k].moved.length && !guestUse[k]);
  return { examTitle, slots, dayLabel, blocks, totals, overs, ttRows, edRows, thr, dupGuests, unplaced };
}

/* ------------------------- 일반 사용자용 파일 만들기 -------------------------
 * 지금 화면의 프로그램 코드 + 결과 데이터를 하나의 HTML로 묶는다.
 * 그 파일을 열면 관리 기능 없이 미리보기·인쇄·칠판 엑셀 다운로드만 보인다.
 * 비밀번호를 정하면 데이터를 암호화(AES-256-GCM)해서 넣고, 열 때 비밀번호를 물어본다. */
function buildViewerHTML(payload, enc) {
  const head = [...document.querySelectorAll('head link[rel=preconnect], head link[rel=stylesheet], head script[src]')].map(e => e.outerHTML).join('\n');
  const base = document.getElementById('base-style').outerHTML;
  const app = document.getElementById('app').textContent;
  const data = JSON.stringify(enc || payload).replace(/</g, '\\u003c');
  const S = 'script';
  return `<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="robots" content="noindex, nofollow">\n<title>정기시험 출력물 (일반 사용자용)</title>\n${head}\n${base}\n</head>\n<body>\n<div id="root"></div>\n<${S}>window.${enc ? '__VIEWER_ENC__' : '__VIEWER__'} = ${data};</${S}>\n<${S} id="app">${app}</${S}>\n</body>\n</html>\n`;
}
const stamp = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;

/* ------------------------------ 암호화 (Web Crypto) ------------------------------ */
const b64 = buf => { const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const cryptoReady = () => !!(window.crypto && crypto.subtle);
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await deriveKey(pw, salt, iter);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, alg: 'AES-GCM/PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(ct), createdAt: obj.createdAt };
}
async function decryptJSON(enc, pw) {
  const key = await deriveKey(pw, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, key, unb64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

    m.teachers.forEach(t => { if (s.info[t.name] && s.info[t.name].hq && !s.info[t.name].ex && !s.info[t.name].busy) C[t.name].hq++; });
    Object.entries((m.sup.assign || {})[s.key] || {}).forEach(([n, code]) => {
      const c = C[n]; if (!c || !code) return;
      if (code[0] === 'R') c.room++; else if (code[0] === 'C') c.cor++; else if (code[0] === 'W') c.stb++;
      if (code[0] === 'R' || code[0] === 'C') c.day[s.d] = (c.day[s.d] || 0) + 1;
    });
  });
  Object.values(C).forEach(c => { c.now = c.room + c.cor; c.sum = c.now + c.mock; c.total = c.sum + c.prev; });
  return C;
}
// 자동 편성: 교시 순서대로 채운 뒤, 많이 맡은 교사의 자리를 덜 맡은 교사에게 넘기며 고르게 맞춘다
//  부담 = 이번 감독 수 + (이전 감독+모의고사 지원 − 평균, ±prevK 이내) · 같은 날 몰림은 μ로 벌점
function supGenerate(m) {
  const T = m.teachers.map(t => t.name), K = Math.max(0, +m.sup.prevK || 0), MU = 0.7;
  const act = m.teachers.filter(t => (t.ex || {}).mode !== 'all');
  const base = {}; m.teachers.forEach(t => { base[t.name] = (+t.prev || 0) + (+t.mock || 0); });
  const mean = act.length ? act.reduce((a, t) => a + base[t.name], 0) / act.length : 0;
  const L = {}, dc = {}, stb = {};
  T.forEach(n => { L[n] = Math.max(-K, Math.min(K, base[n] - mean)); dc[n] = {}; stb[n] = 0; });
  const h = (n, s) => { let x = 7; for (const ch of n + s.key) x = (x * 31 + ch.charCodeAt(0)) % 997; return x / 997; };
  const cost = (n, s) => L[n] * 10 + MU * 10 * (dc[n][s.d] || 0) + h(n, s);
  const counted = code => code[0] === 'R' || code[0] === 'C';
  const out = {};
  const put = (A, n, code, s) => { A[n] = code; if (counted(code)) { L[n]++; dc[n][s.d] = (dc[n][s.d] || 0) + 1; } else stb[n]++; };
  const hqPosts = new Set((m.sup.posts || []).filter(p => p.hq).map(p => `C|${p.name}`));
  m.slots.forEach(s => {
    const A = out[s.key] = {};
    const free = n => { const o = s.info[n]; return o && !o.ex && !o.busy && !o.hq && !A[n]; };
    const byCost = arr => arr.slice().sort((a, b) => cost(a, s) - cost(b, s));
    const posts = s.pos.filter(c => c[0] === 'C').sort((a, b) => (hqPosts.has(b) ? 1 : 0) - (hqPosts.has(a) ? 1 : 0));
    // 1) 같은 과목 교사 → 복도 (고사본부 앞 먼저)
    byCost(T.filter(n => free(n) && s.info[n].same)).forEach(n => { if (posts.length) put(A, n, posts.shift(), s); });
    // 2) 교실 감독 (정 → 부)
    s.pos.filter(c => c[0] === 'R').forEach(code => { const n = byCost(T.filter(x => free(x) && !supCan(m, s, x, code)))[0]; if (n) put(A, n, code, s); });
    // 3) 남은 복도
    posts.forEach(code => { const n = byCost(T.filter(free))[0]; if (n) put(A, n, code, s); });
    // 4) 대기 (대기를 적게 맡은 순)
    s.pos.filter(c => c[0] === 'W').forEach(code => { const n = T.filter(x => free(x) && !s.info[x].same).sort((a, b) => stb[a] - stb[b] || cost(a, s) - cost(b, s))[0]; if (n) put(A, n, code, s); });
  });
  // 5) 고르게 맞추기
  for (let it = 0; it < 60; it++) {
    let moved = false;
    m.slots.forEach(s => {
      const A = out[s.key];
      Object.keys(A).forEach(n => {
        const code = A[n]; if (!code || !counted(code)) return;
        if (code[0] === 'C' && s.info[n].same) return; // 같은 과목 교사의 복도 감독은 그대로
        let best = null, bestD = -1e-9;
        T.forEach(u => {
          if (u === n) return;
          const o = s.info[u]; if (!o || o.ex || o.busy || o.hq) return;
          const cu = A[u] || '';
          if (cu && cu[0] !== 'W') return;
          if (supCan(m, s, u, code)) return;
          if (cu && supCan(m, s, n, cu)) return;
          const dlt = (L[u] - L[n] + 1) + MU * ((dc[u][s.d] || 0) - (dc[n][s.d] || 0) + 1);
          if (dlt < bestD) { bestD = dlt; best = u; }
        });
        if (best) {
          const cu = A[best] || '';
          if (cu) A[n] = cu; else delete A[n];
          A[best] = code;
          L[n]--; dc[n][s.d]--; L[best]++; dc[best][s.d] = (dc[best][s.d] || 0) + 1;
          moved = true;
        }
      });
    });
    if (!moved) break;
  }
  return out;
}
// 이전 감독표(이 프로그램의 '교사(전체)' 시트 등)에서 교사별 '총계' 읽기
function parsePrevCounts(wb) {
  const found = {};
  wb.SheetNames.forEach(name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for (let r = 0; r < Math.min(rows.length, 8); r++) {
      const row = rows[r].map(v => String(v).replace(/\s+/g, ''));
      let tc = -1; row.forEach((v, c) => { if (/총계$/.test(v)) tc = c; });
      if (tc < 0) continue;
      let nc = row.findIndex(v => /^(교사|성명|이름|교사명)$/.test(v)); if (nc < 0) nc = 0;
      for (let k = r + 1; k < rows.length; k++) {
        const nm = String(rows[k][nc] ?? '').replace(/\(.*?\)/g, '').replace(/\s+/g, '');
        const v = parseFloat(String(rows[k][tc] ?? '').replace(/[^\d.\-]/g, ''));
        if (/^[가-힣A-Za-z]{2,12}$/.test(nm) && !isNaN(v) && !(nm in found)) found[nm] = v;
      }
      break;
    }
  });
  return found;
}

function buildSupWorkbook(m, examTitle, counts) {
  const wb = new ExcelJS.Workbook(); wb.creator = '정기고사 부착물 시스템'; wb.created = new Date();
  const B = XL.border, CEN = { vertical: 'middle', horizontal: 'center', wrapText: true };
  const page = (o = {}) => ({ pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 1, horizontalCentered: true, margins: { left: .3, right: .3, top: .35, bottom: .35, header: .2, footer: .2 }, ...o } });
  const mk = ws => (r, c, v, o = {}) => {
    const x = ws.getCell(r, c);
    if (v !== null) { x.value = v; x.font = XL.font(o.size || 9, o.bold, o.color); }
    x.alignment = o.align || CEN; if (o.border !== false) x.border = B; if (o.fill) x.fill = XL.fill(o.fill);
    return x;
  };
  const kindFill = { C: 'FFCDF2E4', H: 'FF42C7F1', X: 'FFFFE7D8', L: 'FFF1F5F9' };
  const codeCell = (cell, r, c, x) => cell(r, c, x.text, { fill: kindFill[x.kind], bold: x.kind === 'W' || x.kind === 'H', color: x.kind === 'W' ? 'FFE00000' : x.kind === 'L' ? 'FF94A3B8' : undefined });
  const sheetName = s => s.replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31);
  // 1) 일자별 전체 감독표
  m.days.forEach(day => {
    const S = day.slots, nP = S.length;
    const ws = wb.addWorksheet(sheetName(`${day.dot}_전체`), page());
    const cell = mk(ws);
    const R0 = 5 + nP + 1; // 오른쪽 안내 시작 열 (사이 1칸)
    const RN = m.present.length;
    const lastCol = R0 + 1 + RN;
    ws.mergeCells(1, 1, 1, lastCol); cell(1, 1, `${examTitle} ${day.md} 감독표`, { size: 16, bold: true, border: false }); ws.getRow(1).height = 30.75;
    [['번호', 1], ['성명', 2], ['담임반', 3], ['이동반', 4]].forEach(([t, c]) => { ws.mergeCells(2, c, 3, c); cell(2, c, t, { bold: true, fill: c === 4 ? 'FFBBE76C' : 'FFE7E6E6' }); cell(3, c, null, { fill: c === 4 ? 'FFBBE76C' : 'FFE7E6E6' }); });
    S.forEach((s, j) => { cell(2, 5 + j, `${s.p}교시`, { bold: true, fill: 'FFC49DD6' }); cell(3, 5 + j, s.time || '감독', { size: 7, fill: 'FFC49DD6' }); });
    m.teachers.forEach((t, i) => {
      const r = 4 + i;
      cell(r, 1, i + 1); cell(r, 2, t.name, { bold: true }); cell(r, 3, t.home || ''); cell(r, 4, t.home ? m.moveRoomOf(t.home) : '', { fill: 'FFF1FBE6' });
      S.forEach((s, j) => codeCell(cell, r, 5 + j, supCell(m, s, t.name)));
    });
    // 오른쪽: 시험 시간표 · 복도 위치 · 안내
    let r = 2;
    ws.mergeCells(r, R0, r, lastCol); cell(r, R0, '시험 시간표', { bold: true, fill: 'FF334155', color: 'FFFFFFFF' }); r++;
    cell(r, R0, '교시', { bold: true, fill: 'FFE7E6E6' }); cell(r, R0 + 1, '시간', { bold: true, fill: 'FFE7E6E6' }); m.present.forEach((g, k) => cell(r, R0 + 2 + k, `${g}학년`, { bold: true, fill: 'FFE7E6E6' })); r++;
    S.forEach(s => {
      cell(r, R0, `${s.p}교시`); cell(r, R0 + 1, s.time || '', { size: 8 });
      m.present.forEach((g, k) => { const l = s.subs[g], cls = s.classG.includes(g); cell(r, R0 + 2 + k, cls ? '수업' : l.join('/') || '-', { size: 7, fill: !cls && l.some(x => !isSelf(x)) ? 'FFFFFF00' : undefined, align: { vertical: 'middle', horizontal: 'center', shrinkToFit: true } }); });

    const posts = (m.sup.posts || []).filter(p => p.name);
    if (posts.length) {
      ws.mergeCells(r, R0, r, lastCol); cell(r, R0, '복도 감독 위치', { bold: true, fill: 'FFCDF2E4' }); r++;
      posts.forEach(p => { cell(r, R0, null); ws.mergeCells(r, R0, r, R0 + 1); cell(r, R0, p.name, { bold: true }); ws.mergeCells(r, R0 + 2, r, lastCol); cell(r, R0 + 2, p.desc || '', { size: 8 }); r++; });

function hwpxStyles() {
  const head = HWPX_HEADER;
  const grab = (tag, id) => { const i = head.indexOf(`<hh:${tag} id="${id}"`); return head.slice(i, head.indexOf(`</hh:${tag}>`, i) + tag.length + 6); };

    const id = st.nbf + st.bf.length + 1, b = line ? 'SOLID' : 'NONE', w = line ? '0.12 mm' : '0.1 mm';

// 엑셀 시트 → 한글 표 (A4 세로, 여백 10mm, 본문 폭에 맞춰 열 너비 조정 · 넘치면 행 높이·글씨를 조금 줄이고 그래도 넘치면 머리행 반복하며 다음 쪽으로)
function hwpxTable(ws, st, ids, opt) {
  const merges = (ws.model.merges || []).map(a => { const [p, q] = a.split(':'); const d = x => { const m = x.match(/^([A-Z]+)(\d+)$/); let c = 0; for (const ch of m[1]) c = c * 26 + ch.charCodeAt(0) - 64; return [+m[2], c]; }; const [r1, c1] = d(p), [r2, c2] = d(q || p); return { r1, c1, r2, c2 }; });

      const x = ws.getCell(r, c), f = x.font || {}, al = x.alignment || {};

      const cpId = st.char((f.size || 9) * fs, f.bold, hex(f.color && f.color.argb));

      const paras = v.split('\n').map(t => `<hp:p id="${ids.p++}" paraPrIDRef="${ppId}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${cpId}">${t ? `<hp:t>${xesc(t)}</hp:t>` : '<hp:t/>'}</hp:run></hp:p>`).join('');
      tcs.push(`<hp:tc name="" header="${ri < (opt.headRows || 0) ? 1 : 0}" hasMargin="1" protect="0" editable="0" dirty="0" borderFillIDRef="${st.border(line, fill)}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${al.vertical === 'top' ? 'TOP' : 'CENTER'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList>`
        + `<hp:cellAddr colAddr="${c - 1}" rowAddr="${ri}"/><hp:cellSpan colSpan="${cs}" rowSpan="${rs}"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="113" right="113" top="28" bottom="28"/></hp:tc>`);
    }

  });

    + `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="113" right="113" top="28" bottom="28"/>${trs.join('')}</hp:tbl>`;

const PAGE_CSS = {
  b4: '@page{size:364mm 257mm;margin:0}',
  b4ov: '@page{size:364mm 257mm;margin:8mm}',
  a4: '@page{size:210mm 297mm;margin:10mm}',
};
// 한 장에 맞출 인쇄 가능 영역(mm). 내용이 넘치면 인쇄 직전에 실제 크기를 재서 자동 축소한다.
const PAGE_FIT = { b4: null, b4ov: { w: 348, h: 241 }, a4: { w: 190, h: 277 } };
function printPages(pages, pageKey) {
  if (!pages.length) { alert('인쇄할 내용이 없습니다.'); return; }
  const fit = PAGE_FIT[pageKey];
  if (fit) pages = pages.map(h => `<div class="fit" style="width:${fit.w}mm">${h}</div>`);
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed;left:-20000px;top:0;width:1600px;height:1200px;border:0';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.open();
  doc.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>정기시험 출력물</title><style>${PRINT_CSS}${PAGE_CSS[pageKey]}
html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}</style></head>
<body>${pages.map(h => `<div class="pg">${h}</div>`).join('')}</body></html>`);
  doc.close();
  window.__lastPrintDoc = doc; // 테스트용
  setTimeout(() => {
    if (fit) { // 글꼴·배치가 끝난 뒤 실제 크기를 재서 축소 (3% 여유)
      const px = 96 / 25.4;
      const W = fit.w * px, H = fit.h * px * 0.97;
      doc.querySelectorAll('.fit').forEach(el => {
        let z = 1;
        for (let i = 0; i < 8; i++) { // 축소하면 줄바꿈이 달라질 수 있어 실제 크기를 다시 재며 반복
          const r = el.getBoundingClientRect(), w = Math.max(r.width, el.scrollWidth * z);
          if (r.height <= H && w <= W + 1) break;
          z = Math.floor(z * Math.min(H / r.height, W / w) * 0.99 * 1000) / 1000;
          el.style.zoom = String(z);
        }
      });
    }
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch (e) { alert('인쇄 창을 열 수 없습니다: ' + e.message); }
    setTimeout(() => iframe.remove(), 60000);
  }, 400);
}

/* 표준 양식: 학년별 시간표 + 과목코드 (현재 입력값 포함) */
function buildTimetableTemplate(tt, codes) {
  const wb = new ExcelJS.Workbook();
  const note = "※ 1행: 날짜를 '6월 29일 월요일' 형식으로 입력하세요 (그대로 출력됩니다).\n※ 과목명은 명단 엑셀의 열 이름과 동일하게 입력 (띄어쓰기 달라도 자동 인식).\n※ 같은 교시에 과목이 2개면 슬래시(/)로 구분  예) 물리학Ⅱ/세계사\n※ 시험 없이 자습하는 교시는 '자기주도학습'으로 입력 (과목코드 없음).\n※ 해당 일차·교시에 과목이 없으면 빈칸으로 두세요.";
  GRADES.forEach(g => {
    const t = tt[g]; const ws = wb.addWorksheet(`${g}학년 시간표`);
    const days = Array.from({ length: t.days }, (_, i) => i + 1);
    ws.addRow(['날짜 입력 →', ...days.map(d => t.labels[d] || '')]);
    ws.addRow(['교시 | 일차', ...days.map(d => `${d}일차`)]);
    for (let p = 1; p <= Math.max(4, t.periods); p++) ws.addRow([`${p}교시`, ...days.map(d => (t.cells[`${d}-${p}`] || []).join('/'))]);
    ws.addRow([]);
    const nr = ws.addRow([note]); ws.mergeCells(nr.number, 1, nr.number, days.length + 1); nr.height = 90;
    nr.getCell(1).alignment = { wrapText: true, vertical: 'top' }; nr.getCell(1).font = { size: 9, color: { argb: 'FF475569' } };
    ws.getColumn(1).width = 14; days.forEach((_, i) => { ws.getColumn(i + 2).width = 22; });
    [1, 2].forEach(r => ws.getRow(r).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill(r === 1 ? 'FFFCE4D6' : 'FFE7E6E6'); x.border = XL.border; x.alignment = { horizontal: 'center' }; }));
    for (let r = 3; r < 3 + Math.max(4, t.periods); r++) for (let c = 1; c <= days.length + 1; c++) { const x = ws.getCell(r, c); x.border = XL.border; x.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; }
  });
  GRADES.forEach(g => {
    const ws = wb.addWorksheet(`${g}학년 과목코드`);
    ws.addRow(['코드', '과목명']);
    ws.addRow(['※ 코드(숫자)와 과목명을 입력하세요. 과목명은 명단 엑셀과 동일하게 (띄어쓰기 달라도 자동 인식)', '']);
    (codes[g] || []).forEach(x => ws.addRow([x.code, x.name]));
    ws.getColumn(1).width = 10; ws.getColumn(2).width = 30; ws.getColumn(1).numFmt = '@';
    ws.getRow(1).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill('FFE7E6E6'); });
  });
  return wb;
}
function buildRosterTemplate(codes) {
  const wb = new ExcelJS.Workbook();
  GRADES.forEach(g => {
    const subs = (codes[g] || []).map(x => x.name);
    const ws = wb.addWorksheet(`${g}학년`);
    ws.addRow(['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]);
    ws.addRow([g, 1, 1, `${g}0101`, '홍길동 (예시)', '남', '', ...subs.map((_, i) => i < 3 ? '1' : '')]);
    ws.addRow([g, 1, 2, `${g}0102`, '김철수 (예시)', '남', '전출', ...subs.map(() => '')]);
    ws.addRow([g, 1, 3, `${g}0103`, '이영희 (예시)', '여', '', ...subs.map((_, i) => i >= 3 && i < 6 ? '1' : '')]);
    ws.getRow(1).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill('FFE7E6E6'); x.alignment = { horizontal: 'center', wrapText: true }; });
    [8, 6, 6, 9, 16, 6, 10].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    subs.forEach((_, i) => { ws.getColumn(i + 8).width = 12; });
  });
  return wb;
}

/* ================================ 메인 앱 ================================ */
function App() {
  const [sourceLabel, setSourceLabel] = useState('');
  const sourcesRef = useRef([]);
  const [keywords, setKeywords] = useState(DEFAULT_KEYWORDS);
  const [roster, setRoster] = useState({ students: [], subjectsByGrade: { 1: [], 2: [], 3: [] }, sheets: [], dup: 0, skipped: 0, unknownGrade: 0 });
  const [move, setMove] = useState({ 1: { ...DEFAULT_MOVE }, 2: { ...DEFAULT_MOVE }, 3: { ...DEFAULT_MOVE } });
  const [sel, setSel] = useState({});
  const [tt, setTT] = useState(emptyTT);
  const [codes, setCodes] = useState(defaultCodes);
  const [msg, setMsg] = useState({ text: '준비되었습니다.', type: 'info' });
  const [busy, setBusy] = useState(false);
  const [savedAt, setSavedAt] = useState('');
  const [shareOpen, setShareOpen] = useState(false);
  const [cfgOpen, setCfgOpen] = useState(false);
  // 공동 작업
  const syncRef = useRef(loadSync());
  const connectedRef = useRef(false);
  const dirtyRef = useRef(false);
  const suppressRef = useRef(0);
  const autoTimer = useRef(null);
  const syncBusy = useRef(false);
  const [sync, setSync] = useState({ status: syncRef.current.url && syncRef.current.pw ? 'connecting' : syncRef.current.url && syncRef.current.name ? 'needpw' : 'off', remote: null, note: '', connected: false });
  const [syncOpen, setSyncOpen] = useState(false);
  // 화면 상태
  const [tab, setTab] = useState(VIEWER ? 'chalkboard' : 'timetable');
  const [selGrade, setSelGrade] = useState(1);
  const [ttGrade, setTTGrade] = useState(1);
  const [pv, setPv] = useState({ g: 1, c: 1, kind: '고정', day: 1, zoom: 'fit' });
  const [ov, setOv] = useState({ g: 1, c: 'all' });
  const [cf, setCf] = useState({ g: 1, c: 1 });
  const [ab, setAb] = useState({ g: 1, c: 1, kind: '이동' });
  const [exam, setExam] = useState(defaultExam);
  // 고사실 통계용 (관리자)
  const [types, setTypes] = useState({ 1: {}, 2: {}, 3: {} }); // 과목별 통/선
  const [thr, setThrState] = useState({ ...DEFAULT_THR });
  const [times, setTimesState] = useState({ ...DEFAULT_TIMES });
  const [editors, setEditors] = useState({});
  const [roomOv, setRoomOv] = useState({});
  const [sup, setSup] = useState(defaultSup); // 감독 시간표 (관리자)
  const [resetOpen, setResetOpen] = useState(false);
  const examTitle = examTitleOf(exam);

  const say = (text, type = 'success') => setMsg({ text, type });

  /* ---------- 명단 적용 ---------- */
  const applySources = (sources, label, kw = keywords, keepSel = null) => {
    sourcesRef.current = sources;
    const r = buildRoster(sources, parseKeywords(kw));
    if (!r.students.length) { say('명단에서 학생을 찾지 못했습니다. 이름·반·번호(또는 학번) 열이 있는지 확인하세요.', 'error'); return null; }
    setRoster(r); setSourceLabel(label);
    const keys = [...new Set(r.students.map(s => clsKey(s.g, s.c)))];
    setSel(prev => { const base = keepSel || prev; const next = {}; keys.forEach(k => { next[k] = base[k] !== undefined ? base[k] : true; }); return next; });
    const gs = [...new Set(r.students.map(s => s.g))].sort();
    if (!gs.includes(selGrade)) setSelGrade(gs[0]);
    if (!gs.includes(pv.g)) setPv(p => ({ ...p, g: gs[0], c: Math.min(...r.students.filter(s => s.g === gs[0]).map(s => s.c)) }));
    const ex = r.students.filter(s => s.excluded).length;
    say(`✓ 명단 로드 완료: ${gs.map(g => `${g}학년 ${r.students.filter(s => s.g === g && !s.excluded).length}명`).join(' · ')}${ex ? ` (전출·위탁 등 ${ex}명 자동 제외)` : ''}${r.unknownGrade ? ` · 학년을 알 수 없는 ${r.unknownGrade}명 제외` : ''}`);
    return r;
  };

  const loadSample = () => {
    applySources(sampleSources(), '샘플 데이터 (1~3학년, 9개 학급)');
    setTT(sampleTT()); setCodes(defaultCodes());
    say('샘플 명단(1~3학년)과 샘플 시간표가 로드되었습니다. 실제 명단·시간표 파일을 업로드하세요.', 'info');
  };

  // 일반 사용자용: 파일에 들어 있는 결과 데이터로 시작
  const loadViewer = () => {
    const students = VIEWER.students.map(s => ({ ...s, takenNorm: new Set(s.taken.map(norm)) }));
    setRoster({ students, subjectsByGrade: VIEWER.subjectsByGrade, sheets: [], dup: 0, skipped: 0, unknownGrade: 0 });
    setTT(VIEWER.tt); setCodes(VIEWER.codes); setMove(VIEWER.move); setSel(VIEWER.sel); if (VIEWER.exam) setExam(VIEWER.exam);
    setSourceLabel(VIEWER.label);
    const gs = [...new Set(students.map(s => s.g))].sort();
    const g0 = gs[0] || 1, c0 = Math.min(...students.filter(s => s.g === g0).map(s => s.c));
    setPv(p => ({ ...p, g: g0, c: c0 })); setOv({ g: g0, c: 'all' }); setCf({ g: g0, c: c0 }); setAb({ g: g0, c: c0, kind: '이동' });
    say(`일반 사용자용 화면입니다. 학년·학급을 골라 미리보기 후 인쇄하거나 칠판 부착물 엑셀을 내려받으세요. (자료 기준: ${VIEWER.createdAt})`, 'info');
  };
  // 관리자: 결과 데이터를 담은 일반 사용자용 HTML 파일 만들기
  // 관리자: 일반 사용자용 파일에 넣을 결과 데이터
  const makePayload = () => {
    const now = new Date();
    return {
      v: 1, createdAt: now.toLocaleString('ko-KR'), label: `${sourceLabel} (${now.toLocaleDateString('ko-KR')} 기준)`,
      students: students.map(({ g, c, n, id, name, gender, taken, excluded, reason }) => ({ g, c, n, id, name, gender, taken, excluded, reason })),
      subjectsByGrade: roster.subjectsByGrade, tt, codes, move, sel, exam,
    };
  };
  const makeViewerFile = () => { if (guard()) setShareOpen(true); };

  // 저장된 작업 상태 적용 (빠진 항목은 기본값). 명단 원본이 있으면 true
  const applyConfig = cfg => {
    const kw = cfg.keywords || DEFAULT_KEYWORDS;
    setKeywords(kw);
    setMove({ 1: { ...DEFAULT_MOVE }, 2: { ...DEFAULT_MOVE }, 3: { ...DEFAULT_MOVE }, ...(cfg.move || {}) });
    setTT({ ...sampleTT(), ...(cfg.tt || {}) });
    setCodes({ ...defaultCodes(), ...(cfg.codes || {}) });
    setExam(cfg.exam || defaultExam());
    setTypes({ 1: {}, 2: {}, 3: {}, ...(cfg.types || {}) });
    setThrState({ ...DEFAULT_THR, ...(cfg.thr || {}) });
    setTimesState({ ...DEFAULT_TIMES, ...(cfg.times || {}) });
    setEditors(cfg.editors || {});
    setRoomOv(cfg.roomOv || {});
    setSup({ ...defaultSup(), ...(cfg.sup || {}) });
    const hasRoster = Array.isArray(cfg.sources) && cfg.sources.length > 0;
    applySources(hasRoster ? cfg.sources : sampleSources(), hasRoster ? cfg.label : '샘플 데이터 (1~3학년, 9개 학급)', kw, cfg.sel || {});
    setSavedAt(cfg.savedAt || '');
    return hasRoster;
  };
  // ---------- 공동 작업 함수 ----------
  const persistSync = patch => { syncRef.current = { ...syncRef.current, ...patch }; storeSync(syncRef.current); };
  const setSyncState = (status, extra = {}) => setSync(x => ({ ...x, status, ...extra }));
  const cloudCall = body => syncCall(syncRef.current.url, { auth: syncAuth(syncRef.current.pw), ...body });
  const applyRemote = async (res, note) => {
    const cfg = await decryptJSON(JSON.parse(res.data), syncRef.current.pw);
    suppressRef.current = Date.now() + 2500;
    clearTimeout(autoTimer.current);
    applyConfig(cfg); safeStorage.set(CONFIG_KEY, JSON.stringify(cfg));
    dirtyRef.current = false; persistSync({ syncedVersion: res.version, localDirty: false });
    setSyncState('ok', { remote: res, note: '' });
    say(note || `☁ 공동 작업 최신본(v${res.version} · ${res.savedBy || '-'} · ${res.savedAt})을 불러왔습니다.`, 'info');
  };
  const cloudLoad = async fileId => {
    const res = await cloudCall({ action: 'load', fileId });
    if (!res.ok) throw new Error(syncErrText(res.error));
    return res.empty ? null : res;
  };
  const cloudSave = async (force = false, silent = false) => {
    if (!connectedRef.current || syncBusy.current) return false;
    syncBusy.current = true; clearTimeout(autoTimer.current); setSyncState('saving');
    try {
      const at = new Date().toLocaleString('ko-KR');
      const cfg = buildRef.current(at);
      const enc = await encryptJSON(cfg, syncRef.current.pw);
      const res = await cloudCall({ action: 'save', baseVersion: syncRef.current.syncedVersion, force, data: JSON.stringify(enc), savedBy: syncRef.current.name || '이름 없음' });
      if (!res.ok && res.error === 'CONFLICT') {
        setSyncState('conflict', { remote: res });
        if (!silent) say(`⚠ ${res.savedBy || '다른 분'}님이 ${res.savedAt}에 먼저 저장했습니다. 위 알림에서 어떻게 할지 고르세요.`, 'error');
        return false;
      }
      if (!res.ok) throw new Error(syncErrText(res.error));
      safeStorage.set(CONFIG_KEY, JSON.stringify(cfg)); setSavedAt(at);
      dirtyRef.current = false; persistSync({ syncedVersion: res.version, localDirty: false });
      setSyncState('ok', { remote: res, note: '' });
      if (!silent) say(`☁ 공동 작업 저장 완료 (v${res.version} · ${at})`);
      return true;
    } catch (e) {
      setSyncState('error', { note: e.message });
      if (!silent) say(`공동 작업 저장 실패: ${e.message}`, 'error');
      return false;
    } finally { syncBusy.current = false; }
  };
  const syncActions = {
    connect: async (form, { init } = {}) => {
      const urlChanged = form.url !== syncRef.current.url;
      persistSync({ url: form.url, name: form.name, pw: form.pw, remember: form.remember, auto: form.auto, ...(urlChanged ? { syncedVersion: 0, localDirty: false } : {}) });
      const ping = await syncCall(form.url, { action: 'ping' });
      if (!ping.ok) throw new Error(syncErrText(ping.error));
      if (!ping.initialized) {
        if (!init) return { needInit: true };
        const r = await syncCall(form.url, { action: 'init', auth: syncAuth(form.pw), savedBy: form.name });
        if (!r.ok) throw new Error(syncErrText(r.error));
      }
      const meta = await cloudCall({ action: 'meta' });
      if (!meta.ok) throw new Error(syncErrText(meta.error));
      connectedRef.current = true; setSync(x => ({ ...x, connected: true }));
      if (meta.version === 0) { persistSync({ syncedVersion: 0 }); await cloudSave(true); say('☁ 공유를 시작했습니다. 지금 작업 상태가 첫 버전(v1)으로 저장되었습니다.'); return { ok: true }; }
      if (meta.version > syncRef.current.syncedVersion) {
        if (syncRef.current.syncedVersion > 0 && (dirtyRef.current || syncRef.current.localDirty)) { setSyncState('remote', { remote: meta }); return { ok: true }; }
        const res = await cloudLoad(); if (res) await applyRemote(res);
      } else setSyncState(dirtyRef.current ? 'dirty' : 'ok', { remote: meta });
      return { ok: true };
    },
    save: async force => { const ok = await cloudSave(force); if (!ok && sync.status === 'error') throw new Error(sync.note); },
    loadLatest: async () => { const res = await cloudLoad(); if (!res) throw new Error('공유된 데이터가 아직 없습니다.'); await applyRemote(res); },
    history: async () => { const r = await cloudCall({ action: 'history' }); if (!r.ok) throw new Error(syncErrText(r.error)); return r.files || []; },
    restore: async id => {
      const res = await cloudLoad(id); if (!res) throw new Error('버전을 찾을 수 없습니다.');
      await applyRemote(res, '🕘 이전 버전을 불러왔습니다. 새 버전으로 저장합니다…');
      await cloudSave(false);
    },
    setAuto: v => { persistSync({ auto: v }); setSync(x => ({ ...x })); },

  // 명단 원본 + 시간표·과목코드·이동반·학급 선택·제외 키워드를 이 브라우저에 저장 (새로고침해도 유지)
  const buildConfig = savedAt => {

  };
  const buildRef = useRef(buildConfig); buildRef.current = buildConfig;
  const saveConfig = () => {
    const savedAt = new Date().toLocaleString('ko-KR');

  };

  };

  /* ---------- 출력 ---------- */
  const guard = () => {

    return true;
  };

    setBusy(true); say(kind === 1 ? '과목별 응시현황 엑셀 생성 중...' : kind === 3 ? '반별 결시 학생 현황 엑셀 생성 중...' : kind === 4 ? '고사실 통계 엑셀 생성 중...' : kind === 5 ? '고사실별 결시 현황 엑셀 생성 중...' : '칠판 부착용 B4 출력물 생성 중...', 'info');

  const editTT = (g, fn) => setTT(prev => { const next = deepClone(prev); fn(next[g]); return next; });
  const addSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; const cur = t.cells[k] || []; if (!cur.some(x => norm(x) === norm(sub))) t.cells[k] = isSelf(sub) ? [SELF] : [...cur.filter(x => !isSelf(x)), sub]; });
  const removeSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; t.cells[k] = (t.cells[k] || []).filter(x => x !== sub); if (!t.cells[k].length) delete t.cells[k]; });

/* -------------------------- 시간표 확인·수정 탭 -------------------------- */
function TimetableEditor({ typeOf, setType, examTitle, g, setG, tt, codes, exams, roster, hasStudents, codeOf, isCommon, addSub, removeSub, editTT }) {
  const t = tt[g];
  const days = Array.from({ length: t.days }, (_, i) => i + 1);
  const periods = Array.from({ length: t.periods }, (_, i) => i + 1);
  const placed = new Map();
  Object.entries(t.cells).forEach(([k, subs]) => subs.forEach(s => { if (!isSelf(s)) placed.set(norm(s), [...(placed.get(norm(s)) || []), k]); }));
  const codeList = codes[g] || [];
  const extra = roster.subjectsByGrade[g].filter(s => !codeList.some(c => norm(c.name) === norm(s)));
  const list = exams[g].filter(e => !e.self && e.day <= t.days && e.period <= t.periods);
  const noCode = [...new Set(list.filter(e => !e.code).map(e => e.sub))];
  const common = hasStudents ? [...new Set(list.filter(e => e.common).map(e => e.sub))] : [];
  const dups = [...placed.entries()].filter(([, ks]) => ks.length > 1).map(([n]) => list.find(e => norm(e.sub) === n)?.sub).filter(Boolean);
  const notScheduled = roster.subjectsByGrade[g].filter(s => !placed.has(norm(s)));
  const [showCodes, setShowCodes] = useState(false);
  const opt = (name, label, k) => html`<option key=${k} value=${name}>${label}${placed.has(norm(name)) ? ' ✓' : ''}</option>`;

  return html`<div>
    <div className="text-center mb-3" id="ttTitle"><div className="text-xs font-bold text-slate-500">${examTitle}</div><div className="text-lg font-black">${g}학년 시험 시간표</div></div>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
      <${Seg} value=${g} onChange=${setG} options=${GRADES.map(x => [x, `${x}학년`])} />
      <div className="flex flex-wrap gap-1.5 text-[11px]">
        <span className="self-center text-slate-500 mr-1">교시</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.max(1, x.periods - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.periods}교시</span>
        <button id="addPeriod" className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.min(6, x.periods + 1); })}>+</button>
        <span className="self-center text-slate-500 ml-3 mr-1">일차</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.max(1, x.days - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.days}일</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.min(10, x.days + 1); })}>+</button>
        <button className="ml-3 px-2 py-1 rounded border border-rose-200 text-rose-600 hover:bg-rose-50" onClick=${() => { if (confirm(`${g}학년 시간표의 과목을 모두 비울까요?`)) editTT(g, x => { x.cells = {}; }); }}>비우기</button>
      </div>
    </div>
    <div className="overflow-x-auto">
      <table className="w-full border-collapse text-xs" id="ttTable">
        <thead><tr className="bg-slate-100">
          <th className="border border-slate-300 p-2 w-16">교시</th>
          ${days.map(d => html`<th key=${d} className="border border-slate-300 p-1.5 min-w-[140px]">
            <div className="font-bold">${d}일차</div>
            <input value=${t.labels[d] || ''} placeholder="날짜 입력" onChange=${e => { const v = e.target.value; editTT(g, x => { x.labels[d] = v; }); }}
              className="mt-1 w-full text-center text-[11px] font-normal border border-slate-200 rounded px-1 py-0.5 bg-white" /></th>`)}
        </tr></thead>
        <tbody>${periods.map(p => html`<tr key=${p}>
          <td className=${`border border-slate-300 text-center font-bold ${p >= 4 ? 'bg-amber-50' : 'bg-slate-50'}`}>${p}교시</td>
          ${days.map(d => { const subs = t.cells[`${d}-${p}`] || []; return html`<td key=${d} className="border border-slate-300 p-1.5 align-top" data-cell=${`${d}-${p}`}>
            <div className="flex flex-col gap-1">
              ${subs.map(s => { const self = isSelf(s), code = self ? '' : codeOf(g, s), cm = hasStudents && isCommon(g, s);
                return html`<div key=${s} className=${`relative rounded-md px-2 py-1 pr-5 border ${self ? 'bg-slate-100 border-slate-300 text-slate-500' : !code ? 'bg-amber-50 border-amber-300' : 'bg-indigo-50 border-indigo-200 text-indigo-900'}`}>
                  <div className="font-semibold leading-tight">${s}</div>
                  <div className="text-[10px] opacity-75">${self ? '자습 · 시험 없음' : code ? `코드 ${code}` : '코드 없음'}${cm ? ' · 전원 응시' : ''}</div>
                  ${!self && html`<div className="mt-1 inline-flex rounded-md overflow-hidden border border-slate-300 bg-white" role="group" data-type=${s}>
                    ${['통', '선'].map(v => html`<button key=${v} type="button" title=${v === '통' ? '공통과목' : '선택과목'} onClick=${() => setType(g, s, v)}
                      className=${`px-2 py-0.5 text-[10px] font-bold ${typeOf(g, s) === v ? (v === '통' ? 'bg-sky-600 text-white' : 'bg-violet-600 text-white') : 'text-slate-500 hover:bg-slate-50'}`}>${v === '통' ? '통(공통)' : '선(선택)'}</button>`)}</div>`}
                  <button title="삭제" onClick=${() => removeSub(g, d, p, s)} className="absolute top-0.5 right-1 text-slate-400 hover:text-rose-600 font-bold">×</button></div>`; })}
              <select value="" onChange=${e => { if (e.target.value) addSub(g, d, p, e.target.value); }} className="tt-select w-full border border-dashed border-slate-300 rounded px-1 py-1 text-slate-500 bg-white">
                <option value="">+ 과목 추가</option>
                <option value=${SELF}>자기주도학습 (시험 없음)</option>
                <optgroup label=${`${g}학년 과목코드`}>${codeList.map(c => opt(c.name, `${c.code} ${c.name}`, c.code + c.name))}</optgroup>
                ${extra.length > 0 && html`<optgroup label="명단에만 있는 과목 (코드 없음)">${extra.map(s => opt(s, s, 'x' + s))}</optgroup>`}
              </select>
            </div></td>`; })}
        </tr>`)}</tbody>
      </table>
    </div>
    <div className="mt-3 space-y-1.5 text-[11px]" id="ttWarnings">
      ${noCode.length > 0 && html`<p className="text-amber-700">⚠ 과목코드가 없는 과목: ${noCode.join(', ')} → '${g}학년 과목코드' 시트에 추가하세요.</p>`}
      ${dups.length > 0 && html`<p className="text-amber-700">⚠ 두 번 이상 배치된 과목: ${dups.join(', ')}</p>`}
      <p className="text-slate-500">ℹ 각 과목의 <b>통(공통)/선(선택)</b> 버튼은 고사실 통계의 감독 배치 기준(본반+이동반 조합)에 쓰입니다. 처음에는 명단에 열이 없는 과목을 통, 있는 과목을 선으로 둡니다.</p>
      ${common.length > 0 && html`<p className="text-sky-700">ℹ 명단에 해당 과목 열이 없어 <b>학년 전원 응시(공통과목)</b>로 처리: ${common.join(', ')}</p>`}
      ${hasStudents && notScheduled.length > 0 && html`<p className="text-slate-500">ℹ 명단에는 있지만 시간표에 없는 과목: ${notScheduled.join(', ')}</p>`}
    </div>
    <div className="mt-3">
      <button className="text-[11px] text-indigo-600 underline" onClick=${() => setShowCodes(v => !v)}>${showCodes ? '과목코드 목록 접기' : `${g}학년 과목코드 목록 보기 (${codeList.length}개)`}</button>
      ${showCodes && html`<div className="mt-2 grid grid-cols-2 md:grid-cols-4 gap-1 text-[11px]">${codeList.map(c => html`<div key=${c.code + c.name} className="border border-slate-200 rounded px-2 py-1"><b className="text-indigo-700">${c.code}</b> ${c.name}</div>`)}</div>`}
    </div>
  </div>`;
}

/* ----------------------- 미리보기 공통: 학년·학급 선택 ----------------------- */
function GradeClassPicker({ g, c, onChange, presentGrades, classesByGrade, selected, allowAll }) {

    <label className="flex items-center gap-1">학급
      <select data-pick="class" value=${c} onChange=${e => onChange(g, e.target.value === 'all' ? 'all' : +e.target.value)} className="border border-slate-300 rounded px-1.5 py-1">
        ${allowAll && html`<option value="all">선택 학급 전체</option>`}
        ${classes.map(x => html`<option key=${x} value=${x}>${x}반${selected[g].includes(x) ? '' : ' (미선택)'}</option>`)}</select></label>
  </div>`;
}
const pbtn = 'px-3 py-1.5 rounded-lg text-xs font-semibold disabled:opacity-50';
// 실제 크기 HTML 페이지를 화면 폭에 맞게 축소해서 보여준다
function ScaledPage({ htmlStr, widthPx, heightPx, zoom }) {
  const ref = useRef(null);
  const [boxW, setBoxW] = useState(900);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(() => setBoxW(el.clientWidth)); ro.observe(el); return () => ro.disconnect();
  }, []);
  const z = zoom === 'fit' ? Math.min(1, (boxW - 16) / widthPx, Math.max(360, window.innerHeight - 140) / heightPx) : parseInt(zoom) / 100;
  return html`<div ref=${ref} className="bg-slate-200 rounded-lg p-2 overflow-auto">
    <div style=${{ width: widthPx * z, height: heightPx * z }} className="mx-auto shadow-lg">
      <div style=${{ width: widthPx, transform: `scale(${z})`, transformOrigin: 'top left' }} dangerouslySetInnerHTML=${{ __html: htmlStr }} />
    </div></div>`;
}
const MM = 96 / 25.4;

/* ------------------------- 칠판 부착용 B4 미리보기 ------------------------- */
function ChalkboardPreview({ pv, setPv, ctx, classesByGrade, presentGrades, onExport, onExportClass, busy }) {
  const { selected, tt } = ctx;
  const g = presentGrades.includes(pv.g) ? pv.g : presentGrades[0];
  if (!g) return html`<p className="text-sm text-slate-400">명단을 먼저 업로드하세요.</p>`;
  const classes = classesByGrade[g];
  const c = classes.includes(pv.c) ? pv.c : classes[0];
  const { df, range, pages } = chalkPagesFor(g, c, pv.kind, ctx);
  const pg = pages.find(p => p.day === pv.day) || pages[0];
  const set = o => setPv(p => ({ ...p, ...o }));
  const selTargets = GRADES.flatMap(x => selected[x].map(y => [x, y]));
  return html`<div>
    <div className="flex flex-wrap items-center gap-3 mb-2">
      <${GradeClassPicker} g=${g} c=${c} onChange=${(ng, nc) => set({ g: ng, c: nc })} presentGrades=${presentGrades} classesByGrade=${classesByGrade} selected=${selected} />
      <${Seg} value=${pv.kind} onChange=${v => set({ kind: v })} options=${[['고정', '고정반'], ['이동', '이동반']]} size="xs" />
      <label className="flex items-center gap-1 text-xs">일차 <select data-pick="day" value=${pg ? pg.day : ''} onChange=${e => set({ day: +e.target.value })} className="border border-slate-300 rounded px-1.5 py-1">${pages.map(p => html`<option key=${p.day} value=${p.day}>${p.day}일차 (${tt[g].labels[p.day] || ''})</option>`)}</select></label>
      <${Seg} value=${pv.zoom} onChange=${v => set({ zoom: v })} options=${[['fit', '📐 맞춤'], ['50%', '50%'], ['75%', '75%'], ['100%', '100%']]} size="xs" />
    </div>
    <div className="text-xs text-slate-600 mb-2" id="pvRange">${pv.kind}반 범위: <b>${range}</b> (${df.length}명)${pg ? ` · 이 날 ${pg.rows.length}행, 글씨 ${pg.f3}pt` : ''}</div>
    <div className="flex flex-wrap gap-1.5 mb-3">
      <button data-print="page" disabled=${!pg} onClick=${() => printPages([chalkPageHTML(pg)], 'b4')} className=${`${pbtn} bg-slate-800 text-white`}>🖨 현재 페이지 인쇄</button>
      <button data-print="class" onClick=${() => printPages(chalkAllPages(ctx, [[g, c]]).map(chalkPageHTML), 'b4')} className=${`${pbtn} bg-slate-700 text-white`}>🖨 ${g}학년 ${c}반 전체 인쇄 (고정·이동)</button>
      <button data-print="all" onClick=${() => printPages(chalkAllPages(ctx, selTargets).map(chalkPageHTML), 'b4')} className=${`${pbtn} bg-slate-600 text-white`}>🖨 선택 학급 모두 인쇄</button>
      <button data-xl="class" onClick=${() => onExportClass([[g, c]])} disabled=${busy} className=${`${pbtn} bg-emerald-600 text-white ml-auto`}>⬇ ${g}학년 ${c}반 B4 엑셀</button>
      <button data-xl="all" onClick=${onExport} disabled=${busy} className=${`${pbtn} bg-emerald-700 text-white`}>⬇ 선택 학급 B4 엑셀</button>
    </div>
    ${!df.length ? html`<p className="p-10 text-center text-slate-500 bg-slate-50 rounded-lg">${g}학년 ${c}반 ${pv.kind}반 학생이 없습니다.</p>`
      : !pg ? html`<p className="p-10 text-center text-slate-500 bg-slate-50 rounded-lg">${g}학년 시간표에 시험 과목이 없습니다.</p>`
      : html`<${ScaledPage} htmlStr=${chalkPageHTML(pg)} widthPx=${364 * MM} heightPx=${256.5 * MM} zoom=${pv.zoom} />`}
    <p className="mt-2 text-[11px] text-slate-500">B4 가로 1장 = 하루 시간표. 시험 교시 수와 과목 수에 맞춰 행 높이와 글씨 크기가 자동으로 정해집니다. 인쇄 시 용지는 B4(364×257mm) 가로로 자동 지정됩니다.</p>
  </div>`;
}

/* --------------------------- 과목별 응시현황 미리보기 --------------------------- */
function OverviewPreview({ ov, setOv, ctx, classesByGrade, presentGrades, onExport, busy }) {
  const { selected, move } = ctx;
  const g = presentGrades.includes(ov.g) ? ov.g : presentGrades[0];

  const classes = ov.c === 'all' ? selected[g] : (classesByGrade[g].includes(ov.c) ? [ov.c] : selected[g]);
  const htmlStr = overviewHTML(g, classes, ctx);
  const gradeHTML = x => overviewHTML(x, selected[x], ctx);
  return html`<div>
    <div className="flex flex-wrap items-center gap-3 mb-2">
      <${GradeClassPicker} g=${g} c=${ov.c} allowAll=${true} onChange=${(ng, nc) => setOv({ g: ng, c: nc })} presentGrades=${presentGrades} classesByGrade=${classesByGrade} selected=${selected} />
      <span className="text-xs text-slate-600">이동 방식: <b>${move[g].dir === 'front' ? '앞 번호부터' : '뒷 번호부터'}</b> ${move[g].count}명</span>

eType(ContentService.MimeType.JSON); }\nfunction props_() { return PropertiesService.getScriptProperties(); }\nvar SHEET_ID = '10eQUSIKaUPT11tEVOYhhAAQCQpnjsQapakH8jhYQi5c'; // 공동작업 스프레드시트 (스크립트가 시트에 붙어 있지 않아도 동작)\nfunction ss_() { return SpreadsheetApp.getActiveSpreadsheet() || SpreadsheetApp.openById(SHEET_ID); }\nfunction folder_() {\n  var parents = DriveApp.getFileById(ss_().getId()).getParents();\n  var base = parents.hasNext() ? parents.next() : DriveApp.getRootFolder();\n  var it = base.getFoldersByName(DATA_FOLDER);\n  return it.hasNext() ? it.next() : base.createFolder(DATA_FOLDER);\n}\nfunction log_(row) {\n  var ss = ss_();\n  var sh = ss.getSheetByName(LOG_SHEET);\n  if (!sh) sh = ss.insertSheet(LOG_SHEET);\n  if (sh.getLastRow() === 0) sh.appendRow(['버전', '저장 시각', '저장한 사람', '크기(KB)', '파일 ID']);\n  sh.appendRow(row);\n}\nfunction meta_() {\n  var p = props_();\n  return {\n    version: Number(p.getProperty('VERSION') || 0),\n    savedBy: p.getProperty('SAVED_BY') || '',\n    savedAt: p.getProperty('SAVED_AT') || '',\n    fileId: p.getProperty('FILE_ID') || ''\n  };\n}\nfunction pub_(m, extra) {\n  var o = { ok: true, version: m.version, savedBy: m.savedBy, savedAt: m.savedAt };\n  for (var k in (extra || {})) o[k] = extra[k];\n  return o;\n}\nfunction now_() { return Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'); }\n\nfunction handle_(q) {\n  try {\n    var p = props_();\n    var auth = p.getProperty('AUTH');\n    if (q.action === 'ping') return out_(pub_(meta_(), { initialized: !!auth }));\n    if (!auth) {\n      if (q.action === 'init' && q.auth) { p.setProperty('AUTH', String(q.auth)); log_(['시작', now_(), String(q.savedBy || ''), '', '팀 비밀번호 설정']); return out_(pub_(meta_(), { initialized: true })); }\n      return out_({ ok: false, error: 'NOT_INITIALIZED' });\n    }\n    if (String(q.auth || '') !== auth) return out_({ ok: false, error: 'BAD_AUTH' });\n    var m = meta_();\n\n    if (q.action === 'meta') return out_(pub_(m));\n\n    if (q.action === 'load') {\n      var id = q.fileId || m.fileId;\n      if (!id) return out_(pub_(m, { empty: true }));\n      var f = DriveApp.getFileById(id);\n      if (!inFolder_(f)) return out_({ ok: false, error: 'NOT_FOUND' });\n      return out_(pub_(m, { data: f.getBlob().getDataAsString(), loadedName: f.getName() }));\n    }\n\n    if (q.action === 'save') {\n      var lock = LockService.getScriptLock();\n      lock.waitLock(20000);\n      try {\n        var cur = meta_();\n        if (!q.force && Number(q.baseVersion) !== cur.version) return out_({ ok: false, error: 'CONFLICT', version: cur.version, savedBy: cur.savedBy, savedAt: cur.savedAt });\n        var v = cur.version + 1;\n        var at = now_();\n        var name = 'v' + ('00000' + v).slice(-5) + '_' + Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyyMMdd_HHmmss') + '.json';\n        var data = String(q.data || '');\n        var file = folder_().createFile(name, data, 'application/json');\n        file.setDescription(String(q.savedBy || ''));\n        p.setProperties({ VERSION: String(v), SAVED_BY: String(q.savedBy || ''), SAVED_AT: at, FILE_ID: file.getId() });\n        log_(['v' + v, at, String(q.savedBy || ''), Math.round(data.length / 1024), file.getId()]);\n        prune_();\n        return out_(pub_(meta_()));\n      } finally { lock.releaseLock(); }\n    }\n\n    // 관리자 화면 [설정 초기화]: 저장된 모든 버전·버전 기록·팀 비밀번호를 지운다 (팀 비밀번호 확인 후)\n    if (q.action === 'reset') {\n      var lk = LockService.getScriptLock();\n      lk.waitLock(20000);\n      try {\n        var n = 0, fit = folder_().getFiles();\n        while (fit.hasNext()) { var df = fit.next(); if (/^v\\d+_/.test(df.getName())) { df.setTrashed(true); n++; } }\n        ['AUTH', 'VERSION', 'SAVED_BY', 'SAVED_AT', 'FILE_ID'].forEach(function (k) { p.deleteProperty(k); });\n        var sh = ss_().getSheetByName(LOG_SHEET);\n        if (sh) sh.clear();\n        log_(['초기화', now_(), String(q.savedBy || ''), '', '관리자 화면에서 전체 초기화 (버전 ' + n + '개 삭제)']);\n        return out_({ ok: true, reset: true, removed: n });\n      } finally { lk.releaseLock(); }\n    }\n\n    if (q.action === 'history') {\n      var list = [];\n      var it = folder_().getFiles();\n      while (it.hasNext()) {\n        var x = it.next();\n        if (!/^v\\d+_/.test(x.getName())) continue;\n        list.push({ id: x.getId(), name: x.getName(), by: x.getDescription() || '', size: x.getSize(), at: Utilities.formatDate(x.getDateCreated(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss') });\n      }\n      list.sort(function (a, b) { return b.name < a.name ? -1 : b.name > a.name ? 1 : 0; });\n      return out_(pub_(m, { files: list.slice(0, KEEP) }));\n    }\n    return out_({ ok: false, error: 'UNKNOWN_ACTION' });\n  } catch (err) {\n    return out_({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\nfunction inFolder_(f) {\n  var target = folder_().getId();\n  var ps = f.getParents();\n  while (ps.hasNext()) if (ps.next().getId() === target) return true;\n  return false;\n}\nfunction prune_() {\n  var files = [];\n  var it = folder_().getFiles();\n  while (it.hasNext()) { var f = it.next(); if (/^v\\d+_/.test(f.getName())) files.push(f); }\n  files.sort(function (a, b) { return b.getName() < a.getName() ? -1 : 1; });\n  files.slice(KEEP).forEach(function (f) { f.setTrashed(true); });\n}\n";

const loadSync = () => { try { const s = { ...SYNC_DEFAULT, ...JSON.parse(safeStorage.get(SYNC_KEY) || '{}') }; if (!s.url) s.url = SYNC_WEBAPP_URL; return s; } catch (e) { return { ...SYNC_DEFAULT }; } };

const SYNC_AUTOSAVE_MS = () => window.__SYNC_AUTOSAVE_MS || 15000;
const syncErrText = e => ({

  NOT_INITIALIZED: '공유 공간이 아직 없거나 초기화되었습니다. [공동 작업]에서 다시 연결해 시작하세요.',
  NOT_FOUND: '해당 버전을 찾을 수 없습니다.',
  UNKNOWN_ACTION: 'Apps Script 코드가 최신이 아닙니다. Code.gs를 다시 붙여넣고 새 버전으로 배포하세요.',
}[e] || e || '알 수 없는 오류');
async function syncCall(url, body) {
  let r;
  try { r = await fetch(url.trim(), { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store' }); }
  catch (e) { throw new Error('웹 앱 주소에 접속할 수 없습니다. 주소(…/exec)와 배포 설정(액세스 권한: 모든 사용자)을 확인하세요.'); }
  if (!r.ok) throw new Error(`서버 응답 오류 (${r.status})`);
  try { return await r.json(); } catch (e) { throw new Error('웹 앱 응답을 읽을 수 없습니다. 배포 액세스 권한이 "모든 사용자"인지 확인하세요.'); }
}

/* ---------------------- 설정 파일 내보내기 / 불러오기 (관리자) ----------------------

const CFG_APP = 'exam-generator-config';
/* ---------- 설정 초기화: 관리자 비밀번호 재확인 + 공유 데이터까지 ---------- */
