function ConfirmPreview({ cf, setCf, ctx, classesByGrade, presentGrades, onExport, busy }) {
  const { selected } = ctx;
  const g = presentGrades.includes(cf.g) ? cf.g : presentGrades[0];
  if (!g) return html`<p className="text-sm text-slate-400">명단을 먼저 업로드하세요.</p>`;
  const c = classesByGrade[g].includes(cf.c) ? cf.c : classesByGrade[g][0];
  const htmlStr = confirmHTML(g, c, ctx);
  const selTargets = GRADES.flatMap(x => selected[x].map(y => [x, y]));
  return html`<div>
    <div className="flex flex-wrap items-center gap-3 mb-2">
      <${GradeClassPicker} g=${g} c=${c} onChange=${(ng, nc) => setCf({ g: ng, c: nc })} presentGrades=${presentGrades} classesByGrade=${classesByGrade} selected=${selected} />
    </div>
    <div className="flex flex-wrap gap-1.5 mb-3">
      <button data-print="cf" onClick=${() => printPages([htmlStr], 'a4')} className=${`${pbtn} bg-slate-800 text-white`}>🖨 ${g}학년 ${c}반 인쇄 (A4)</button>
      <button data-print="cfall" onClick=${() => printPages(selTargets.map(([x, y]) => confirmHTML(x, y, ctx)), 'a4')} className=${`${pbtn} bg-slate-600 text-white`}>🖨 선택 학급 모두 인쇄</button>
      ${!VIEWER && html`<button onClick=${onExport} disabled=${busy} className=${`${pbtn} bg-indigo-600 text-white ml-auto`}>⬇ [파일 1] 엑셀 다운로드</button>`}
    </div>
    <${ScaledPage} htmlStr=${`<div style="padding:10mm;background:#fff;min-height:277mm;box-sizing:border-box">${htmlStr}</div>`} widthPx=${210 * MM} heightPx=${297 * MM} zoom="fit" />
  </div>`;
}

/* ---------------------- 설정 파일 내보내기 / 불러오기 (관리자) ----------------------
 * 작업 상태 전체(명단 원본·시간표·과목코드·통/선·이동반·학급 선택·기준·시간·출제자·고사실 구성·시험명)를
 * .json 파일 하나로 저장했다가 다른 PC·브라우저에서 그대로 불러온다. 비밀번호를 넣으면 암호화. */
const CFG_APP = 'exam-generator-config';
function ConfigFileDialog({ onClose, buildConfig, applyConfig, say }) {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState('');
  const [pending, setPending] = useState(null); // 암호화된 파일: 비밀번호 입력 대기
  const [openPw, setOpenPw] = useState('');
  const inp = 'w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm';
  const pwErr = !pw ? '' : pw.length < 6 ? '6자 이상으로 정하세요.' : pw !== pw2 ? '두 비밀번호가 다릅니다.' : '';

  const doExport = async () => {
    if (pwErr) { setErr(pwErr); return; }
    setBusy(true); setErr(''); setOk('');
    try {
      const now = new Date(), data = buildConfig(now.toLocaleString('ko-KR'));
      const file = { app: CFG_APP, v: 1, exportedAt: now.toLocaleString('ko-KR'), title: examTitleOf(data.exam || defaultExam()) };
      if (pw) { if (!cryptoReady()) throw new Error('이 브라우저에서는 암호화를 쓸 수 없습니다.'); file.enc = await encryptJSON(data, pw); } else file.data = data;
      const blob = new Blob([JSON.stringify(file)], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `정기시험_설정백업_${stamp(now)}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      setOk(`✅ 설정 파일을 내려받았습니다${pw ? ' (비밀번호 암호화)' : ''}. 다른 PC에서 [📁 설정 파일 → 불러오기]로 여세요.`);
      say('📤 작업 상태를 설정 파일로 내보냈습니다.');
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const finish = (data, meta) => {
    const hasRoster = applyConfig(data);
    safeStorage.set(CONFIG_KEY, JSON.stringify(data)); // 이 브라우저에도 바로 저장 → 새로고침해도 유지
    say(`📥 설정 파일을 불러왔습니다 (${meta.title || ''}, 백업 시각 ${meta.exportedAt || '-'})${hasRoster ? '' : ' · 명단은 들어 있지 않아 샘플로 표시합니다'}. 이 브라우저에도 저장했습니다.`);
    onClose();
  };
  const onFile = async e => {
    const f = e.target.files?.[0]; e.target.value = '';
    if (!f) return;
    setErr(''); setOk(''); setPending(null);
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || obj.app !== CFG_APP) throw new Error('이 프로그램의 설정 파일이 아닙니다.');
      if (obj.enc) { setPending(obj); return; }
      if (!obj.data) throw new Error('설정 내용이 비어 있습니다.');
      if (confirm(`'${obj.title || '설정'}' (백업 시각 ${obj.exportedAt || '-'})을 불러올까요?\n지금 화면의 작업 내용은 이 파일 내용으로 바뀝니다.`)) finish(obj.data, obj);
    } catch (x) { setErr(x instanceof SyntaxError ? '파일을 읽을 수 없습니다. (.json 설정 파일인지 확인하세요)' : x.message); }
  };
  const unlock = async e => {
    e.preventDefault(); setBusy(true); setErr('');
    try { const data = await decryptJSON(pending.enc, openPw); finish(data, pending); }
    catch (x) { setErr('비밀번호가 맞지 않습니다.'); } finally { setBusy(false); }
  };
  return html`<div className="fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-4 overflow-auto" onClick=${e => { if (e.target === e.currentTarget && !busy) onClose(); }}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl mt-10 p-6" role="dialog" aria-label="설정 파일">
      <div className="flex items-center justify-between mb-1">
        <h2 className="text-lg font-black">📁 설정 파일 내보내기 / 불러오기</h2>
        <button onClick=${onClose} disabled=${busy} className="text-slate-400 hover:text-slate-700 text-xl">×</button>
      </div>
      <p className="text-xs text-slate-500 mb-4">명단·시간표·과목코드·통/선·이동반·학급 선택·감독 기준·교시 시간·출제자·고사실 구성·시험명을 파일 하나로 옮깁니다. GitHub 토큰은 들어가지 않습니다.</p>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <div className="text-sm font-bold mb-1">📤 내보내기 (백업)</div>
        <p className="text-[11px] text-slate-500 mb-2">파일에 학생 명단이 들어갑니다. 메신저·USB로 옮길 때는 비밀번호를 거는 것을 권장합니다. (비워 두면 암호 없이 저장)</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <input id="cfgPw" type="password" autoComplete="new-password" placeholder="비밀번호 (선택, 6자 이상)" value=${pw} onInput=${e => setPw(e.target.value)} className=${inp} />
          <input id="cfgPw2" type="password" autoComplete="new-password" placeholder="비밀번호 확인" value=${pw2} onInput=${e => setPw2(e.target.value)} className=${inp} />
        </div>
        ${pwErr && html`<p className="text-[11px] text-rose-600 mb-2">${pwErr}</p>`}
        <button id="cfgExport" onClick=${doExport} disabled=${busy} className="w-full py-2.5 rounded-lg bg-slate-900 text-white text-sm font-bold disabled:opacity-50">⬇ 설정 파일 내려받기${pw ? ' (암호)' : ''}</button>
      </div>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <div className="text-sm font-bold mb-1">📥 불러오기 (복원)</div>
        <p className="text-[11px] text-slate-500 mb-2">불러오면 지금 화면의 작업 내용이 파일 내용으로 바뀌고, 이 브라우저에도 바로 저장됩니다.</p>
        ${pending ? html`<form onSubmit=${unlock} className="flex gap-2">
            <input id="cfgOpenPw" type="password" autoFocus placeholder="백업할 때 정한 비밀번호" value=${openPw} onInput=${e => setOpenPw(e.target.value)} className=${inp} />
            <button id="cfgUnlock" type="submit" disabled=${busy || !openPw} className="shrink-0 px-4 rounded-lg bg-indigo-600 text-white text-sm font-bold disabled:opacity-50">열기</button></form>
            <p className="text-[11px] text-slate-500 mt-1">🔒 암호화된 설정 파일입니다. (${pending.title || ''} · 백업 ${pending.exportedAt || '-'})</p>`
          : html`<label className="w-full flex items-center justify-center py-2.5 rounded-lg border-2 border-dashed border-slate-300 text-sm font-semibold text-slate-600 hover:bg-slate-50 cursor-pointer">⬆ 설정 파일(.json) 선택
            <input id="cfgImport" type="file" accept=".json,application/json" onChange=${onFile} className="hidden" /></label>`}
      </div>
      ${err && html`<p id="cfgErr" className="text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2.5">${err}</p>`}
      ${ok && html`<p id="cfgOk" className="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2.5">${ok}</p>`}
    </div>
  </div>`;
}

/* ---------------------- 일반 사용자용 파일 만들기 창 (관리자) ---------------------- */
function ShareDialog({ onClose, makePayload, say }) {
  const [gh, setGh] = useState(loadGh);
  const [tokenEdit, setTokenEdit] = useState(() => !loadGh().token);
  const [newToken, setNewToken] = useState('');
  const [tokenMsg, setTokenMsg] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [link, setLink] = useState('');
  const [copied, setCopied] = useState(false);
  const [showGh, setShowGh] = useState(() => !loadGh().token);
  const set = o => setGh(g => ({ ...g, ...o }));
  const pwErr = !pw ? '' : pw.length < 6 ? '6자 이상으로 정하세요.' : pw !== pw2 ? '두 비밀번호가 다릅니다.' : '';
  const pwOk = pw.length >= 6 && pw === pw2;
  const ghOk = gh.owner.trim() && gh.repo.trim() && gh.branch.trim() && gh.path.trim() && gh.token.trim();

  const build = async () => {
    const payload = makePayload();
    if (!pw) return { html: buildViewerHTML(payload), payload };
    if (!cryptoReady()) throw new Error('이 브라우저에서는 암호화를 쓸 수 없습니다. (https 주소나 내 PC 파일로 열어 주세요)');
    return { html: buildViewerHTML(payload, await encryptJSON(payload, pw)), payload };
  };
  const download = async () => {
    if (pw && !pwOk) { setErr(pwErr); return; }
    setBusy(true); setErr('');
    try {
      const { html: h } = await build();
      const blob = new Blob([h], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `정기시험_출력물_일반사용자용_${stamp(new Date())}.html`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      say(pw ? '📤 비밀번호가 걸린 일반 사용자용 파일을 내려받았습니다.' : '📤 일반 사용자용 파일을 내려받았습니다. (암호 없음 · 학생 이름이 들어 있으니 교내에서만 공유하세요)');
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const upload = async () => {
    if (!pwOk) { setErr('GitHub에 올릴 때는 열람 비밀번호가 꼭 필요합니다. ' + (pwErr || '')); return; }
    if (!ghOk) { setErr(gh.token ? 'GitHub 설정(사용자명·저장소·브랜치·경로)을 확인하세요.' : 'GitHub 접근 토큰을 먼저 입력하고 [토큰 저장]을 누르세요.'); setShowGh(true); setTokenEdit(true); return; }
    setBusy(true); setErr(''); setLink('');
    try {
      const { html: h, payload } = await build();
      const res = await githubPut(gh, h, `정기시험 출력물 갱신 (${payload.createdAt})`);
      if (res.wasEmpty) setErr(`ℹ 빈 저장소라서 첫 파일로 '${res.usedBranch}' 브랜치를 만들었습니다. Settings → Pages에서 이 브랜치를 선택해야 링크가 열립니다.`);
      saveGh(gh);
      const l = pagesLink(gh, stamp(new Date()));
      setLink(l);
      say('☁ GitHub에 올렸습니다. 링크와 비밀번호를 선생님들께 전달하세요. (반영까지 1~2분 걸릴 수 있습니다)');
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const storeToken = () => {
    const t = newToken.trim();
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(t)) { setTokenMsg('토큰 형식이 아닙니다. github_pat_ 로 시작하는 토큰 전체를 붙여 넣으세요.'); return; }
    const next = { ...gh, token: t }; setGh(next); saveGh(next);
    setNewToken(''); setTokenEdit(false); setTokenMsg('✅ 토큰을 저장했습니다. 다음부터 자동으로 사용됩니다.');
  };
  const clearToken = () => {
    if (!confirm('저장된 GitHub 토큰을 이 브라우저에서 지울까요?')) return;
    const next = { ...gh, token: '' }; setGh(next); saveGh(next); setTokenEdit(true); setTokenMsg('토큰을 지웠습니다.');
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch (e) { const el = document.getElementById('shareLink'); if (el) { el.select(); document.execCommand('copy'); setCopied(true); } }
  };
  const inp = 'w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm';
  const lab = 'block text-[11px] font-semibold text-slate-600 mb-1';
  return html`<div className="fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-4 overflow-auto" onClick=${e => { if (e.target === e.currentTarget && !busy) onClose(); }}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl mt-10 p-6" role="dialog" aria-label="일반 사용자용 파일 만들기">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-black">📤 일반 사용자용 파일 만들기</h2>
        <button onClick=${onClose} disabled=${busy} className="text-slate-400 hover:text-slate-700 text-xl">×</button>
      </div>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <div className="text-sm font-bold mb-1">① 열람 비밀번호</div>
        <p className="text-[11px] text-slate-500 mb-2">파일 속 학생 명단을 이 비밀번호로 암호화합니다. 링크를 연 사람은 비밀번호를 넣어야 내용을 볼 수 있습니다. 비밀번호는 어디에도 저장되지 않으니 잊지 않게 기록해 두세요.</p>
        <div className="grid grid-cols-2 gap-2">
          <div><label className=${lab}>비밀번호 (6자 이상)</label><input id="sharePw" type="password" autoComplete="new-password" value=${pw} onInput=${e => setPw(e.target.value)} className=${inp} /></div>
          <div><label className=${lab}>비밀번호 확인</label><input id="sharePw2" type="password" autoComplete="new-password" value=${pw2} onInput=${e => setPw2(e.target.value)} className=${inp} /></div>
        </div>
        ${pwErr && html`<p className="text-[11px] text-rose-600 mt-1">${pwErr}</p>`}
      </div>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <button className="w-full flex items-center justify-between text-sm font-bold" onClick=${() => setShowGh(v => !v)}>
          <span>② GitHub 저장 위치 ${gh.owner && gh.repo ? html`<span className="font-normal text-slate-500 text-xs">(${gh.owner}/${gh.repo} · ${gh.path})</span>` : ''}</span><span className="text-slate-400">${showGh ? '▲' : '▼'}</span></button>
        ${showGh && html`<div className="mt-3 grid grid-cols-2 gap-2">
          <div><label className=${lab}>GitHub 사용자명(또는 조직)</label><input id="ghOwner" value=${gh.owner} onInput=${e => set({ owner: e.target.value })} placeholder=${DEFAULT_GH.owner} className=${inp} /></div>
          <div><label className=${lab}>저장소 이름</label><input id="ghRepo" value=${gh.repo} onInput=${e => set({ repo: e.target.value })} placeholder=${DEFAULT_GH.repo} className=${inp} /></div>
          <div><label className=${lab}>브랜치</label><input value=${gh.branch} onInput=${e => set({ branch: e.target.value })} className=${inp} /></div>
          <div><label className=${lab}>저장 경로</label><input value=${gh.path} onInput=${e => set({ path: e.target.value })} className=${inp} /></div>
          <div className="col-span-2"><label className=${lab}>접근 토큰 (Fine-grained token · 이 저장소 Contents Read and write)</label>
            ${gh.token && !tokenEdit ? html`<div className="flex items-center gap-2" id="tokenSaved">
                <span className="flex-1 text-xs bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-md px-2 py-1.5">✅ 저장된 토큰 사용 중 <code className="ml-1">${maskToken(gh.token)}</code></span>
                <button id="tokenChange" onClick=${() => { setTokenEdit(true); setTokenMsg(''); }} className="text-xs px-2.5 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">토큰 변경</button>
                <button onClick=${clearToken} className="text-xs px-2.5 py-1.5 rounded-md border border-rose-200 text-rose-600 hover:bg-rose-50">지우기</button></div>`
            : html`<div className="flex gap-2"><input id="ghToken" type="password" autoComplete="off" value=${newToken} onInput=${e => { setNewToken(e.target.value); setTokenMsg(''); }} placeholder="github_pat_..." className=${inp} />
                <button id="tokenSave" onClick=${storeToken} className="shrink-0 text-xs px-3 rounded-md bg-slate-900 text-white font-semibold">토큰 저장</button>
                ${gh.token && html`<button onClick=${() => { setTokenEdit(false); setNewToken(''); }} className="shrink-0 text-xs px-2.5 rounded-md border border-slate-300">취소</button>`}</div>`}
            ${tokenMsg && html`<p id="tokenMsg" className=${`text-[11px] mt-1 ${tokenMsg.startsWith('✅') ? 'text-emerald-700' : 'text-rose-600'}`}>${tokenMsg}</p>`}
            <p className="text-[11px] text-slate-500 mt-1">토큰은 이 PC 브라우저에만 저장되며 프로그램 코드·일반 사용자용 파일에는 들어가지 않습니다. 만료되면 [토큰 변경]으로 새 토큰을 넣으세요.</p></div>
          <div className="col-span-2"><label className=${lab}>GitHub Pages 주소 (비우면 자동: https://사용자명.github.io/저장소/)</label><input value=${gh.pages} onInput=${e => set({ pages: e.target.value })} placeholder=${pagesLink({ ...gh, pages: '' }) || 'https://...'} className=${inp} /></div>
        </div>`}
      </div>

      ${err && html`<p id="shareErr" className="text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-3" style=${{ whiteSpace: 'pre-line' }}>${err}</p>`}
      ${link && html`<div className="rounded-xl border-2 border-emerald-400 bg-emerald-50 p-4 mb-3">
        <div className="text-sm font-bold text-emerald-800 mb-2">✅ 올리기 완료 — 이 링크와 비밀번호를 전달하세요</div>
        <div className="flex gap-2"><input id="shareLink" readOnly value=${link} onFocus=${e => e.target.select()} className="flex-1 border border-emerald-300 rounded-md px-2 py-1.5 text-sm bg-white" />
          <button onClick=${copy} className="px-3 rounded-md bg-emerald-600 text-white text-sm font-semibold">${copied ? '복사됨' : '복사'}</button>
          <a href=${link} target="_blank" rel="noopener" className="px-3 rounded-md border border-emerald-400 text-emerald-700 text-sm font-semibold flex items-center">열기</a></div>
        <p className="text-[11px] text-emerald-800 mt-2">링크 주소는 매번 같고 내용만 최신으로 바뀝니다. GitHub 반영에 1~2분 걸릴 수 있으니 바로 열리지 않으면 잠시 후 다시 열어 보세요.</p>
      </div>`}

      <div className="flex flex-wrap gap-2 justify-end">
        <button id="shareDownload" onClick=${download} disabled=${busy} className="px-4 py-2.5 rounded-lg border border-slate-300 text-sm font-semibold hover:bg-slate-50 disabled:opacity-50">⬇ 파일로 내려받기${pw ? ' (암호)' : ''}</button>
        <button id="shareUpload" onClick=${upload} disabled=${busy} className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-bold disabled:opacity-50">${busy ? '처리 중…' : '☁ GitHub에 올리고 링크 받기'}</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------- 일반 사용자: 비밀번호 확인 화면 ---------------------- */
/* ---------------------- 관리자: 처음 접속 시 비밀번호 확인 ----------------------
 * 비밀번호 원문은 코드에 넣지 않고 SHA-256 해시만 둔다. 확인되면 이 탭을 닫을 때까지 유지. */
const ADMIN_HASH = '26055b4bf21a9dce7805852bd69e554097965979a63c6beb24aa944a3df7d8bb'; // sha256('exam-admin:' + 비밀번호)
const ADMIN_SESSION_KEY = 'exam_admin_ok_v1';
function sha256Hex(str) { // 순수 JS SHA-256 (https가 아닌 환경에서도 동작)
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str), len = bytes.length;
  const n = (((len + 9) >> 6) + 1) << 4, w = new Uint32Array(n);
  for (let i = 0; i < len; i++) w[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
  w[len >> 2] |= 0x80 << (24 - (len % 4) * 8); w[n - 1] = len * 8;
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r = (x, k) => (x >>> k) | (x << (32 - k)), W = new Uint32Array(64);
  for (let i = 0; i < n; i += 16) {
    for (let t = 0; t < 64; t++) W[t] = t < 16 ? w[i + t] : (r(W[t-2],17) ^ r(W[t-2],19) ^ (W[t-2] >>> 10)) + W[t-7] + (r(W[t-15],7) ^ r(W[t-15],18) ^ (W[t-15] >>> 3)) + W[t-16];
    let [a, b, c, d, e, f, g, hh] = h;
    for (let t = 0; t < 64; t++) {
      const t1 = (hh + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = h.map((v, k) => (v + [a, b, c, d, e, f, g, hh][k]) >>> 0);
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}
const sessionOk = () => { try { return sessionStorage.getItem(ADMIN_SESSION_KEY) === ADMIN_HASH; } catch (e) { return false; } };
function AdminGate() {
  const [ok, setOk] = useState(sessionOk);
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  if (ok) return html`<${App} />`;
  const submit = e => {
    e.preventDefault();
    if (sha256Hex('exam-admin:' + pw) === ADMIN_HASH) { try { sessionStorage.setItem(ADMIN_SESSION_KEY, ADMIN_HASH); } catch (x) { /* 무시 */ } setOk(true); }
    else { setErr('비밀번호가 맞지 않습니다.'); setPw(''); }
  };
  return html`<div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
    <form onSubmit=${submit} className="bg-white rounded-2xl shadow-2xl p-7 w-full max-w-sm">
      <div className="text-3xl mb-2">🛡️</div>
      <h1 className="text-lg font-black leading-snug mb-1" style=${{ wordBreak: 'keep-all' }}>고등학교 정기시험 선택과목 분반 및 시험 시간표 자동 편성 시스템</h1>
      <p className="text-xs text-slate-500 mb-4">관리자 비밀번호를 입력하세요.</p>
      <input id="adminPw" type="password" inputMode="numeric" autoFocus value=${pw} onInput=${e => { setPw(e.target.value); setErr(''); }} placeholder="관리자 비밀번호" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base mb-2" />
      ${err && html`<p id="adminErr" className="text-sm text-rose-600 mb-2">${err}</p>`}
      <button id="adminOpen" type="submit" disabled=${!pw} className="w-full bg-slate-900 hover:bg-slate-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg">관리자 화면 열기</button>
      <p className="text-[11px] text-slate-400 mt-3">한 번 입력하면 이 브라우저 탭을 닫을 때까지 유지됩니다.</p>
    </form>
  </div>`;
}
const lockAdmin = () => { try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch (e) { /* 무시 */ } location.reload(); };

const VIEWER_PW_KEY = 'exam_viewer_pw_v1';
function Gate() {
  const enc = window.__VIEWER_ENC__;
  const [open, setOpen] = useState(!enc);
  const [pw, setPw] = useState('');
  const [remember, setRemember] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(!!enc && !!safeStorage.get(VIEWER_PW_KEY));
  const tryOpen = async (p, silent) => {
    if (!cryptoReady()) { setErr('이 브라우저에서는 암호를 풀 수 없습니다. 크롬·엣지 최신 버전으로 열어 주세요.'); setBusy(false); return; }
    setBusy(true); setErr('');
    try {
      VIEWER = await decryptJSON(enc, p);
      if (remember || silent) safeStorage.set(VIEWER_PW_KEY, p);
      setOpen(true);
    } catch (e) {
      if (silent) safeStorage.remove(VIEWER_PW_KEY); else setErr('비밀번호가 맞지 않습니다.');
      setBusy(false);
    }
  };
  useEffect(() => { const saved = safeStorage.get(VIEWER_PW_KEY); if (enc && saved) tryOpen(saved, true); }, []);
  if (open) return VIEWER ? html`<${App} />` : html`<${AdminGate} />`;
  return html`<div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
    <form onSubmit=${e => { e.preventDefault(); if (pw) tryOpen(pw, false); }} className="bg-white rounded-2xl shadow-2xl p-7 w-full max-w-sm">
      <div className="text-3xl mb-2">🔒</div>
      <h1 className="text-lg font-black leading-snug mb-1" style=${{ wordBreak: 'keep-all' }}>정기시험 선택과목 응시현황 · 출력물</h1>
      <p className="text-xs text-slate-500 mb-4">학생 정보 보호를 위해 비밀번호가 필요합니다.${enc.createdAt ? ` (자료 기준: ${enc.createdAt})` : ''}</p>
      <input id="gatePw" type="password" autoFocus value=${pw} onInput=${e => setPw(e.target.value)} placeholder="비밀번호" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base mb-2" />
      <label className="flex items-center gap-1.5 text-xs text-slate-600 mb-3"><input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} /> 이 기기에서 비밀번호 기억</label>
      ${err && html`<p id="gateErr" className="text-sm text-rose-600 mb-2">${err}</p>`}
      <button id="gateOpen" type="submit" disabled=${busy || !pw} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg">${busy ? '여는 중…' : '열기'}</button>
    </form>
  </div>`;
}

document.head.insertAdjacentHTML('beforeend', `<style id="printcss">${PRINT_CSS}</style>`);
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Gate} />`);
</script>
