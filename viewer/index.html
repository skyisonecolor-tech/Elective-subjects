  const subjects = { 1: new Set(), 2: new Set(), 3: new Set() };
  const sheets = [];
  sources.forEach(src => src.sheets.forEach(sh => {
    const res = parseRosterSheet(sh.rows, sh.name, src.fileName, keywords);
    if (!res || res.students.length === 0) return;
    skipped += res.skipped; unknownGrade += res.unknownGrade;
    res.grades.forEach(g => res.subjectHeaders.forEach(hd => subjects[g].add(hd)));
    sheets.push({ file: src.fileName, sheet: sh.name, grades: res.grades.sort(), count: res.students.length });
    res.students.forEach(s => { const k = `${s.g}-${s.c}-${s.n}`; if (map.has(k)) dup++; map.set(k, s); });
  }));
  const students = [...map.values()].map(s => ({ ...s, takenNorm: new Set(s.taken.map(norm)) }))

}

    return `<tr style="height:${pg.rowH}pt">${p}<td class="blue c" style="font-size:${pg.f2}pt">${esc(subjectText(r.e, pg.subOne, '\n')).replace('\n', '<br>')}</td><td class="${cls}" style="font-size:${pg.f3}pt">${esc(r.st.text)}</td></tr>`;
  }).join('');
  return `<div class="b4"><div style="height:${CB.gapTop}pt"></div><div class="b4title" style="height:${CB.titleH}pt;font-size:${CB.titleF}pt">${esc(pg.label)}</div><div style="height:${CB.gapMid}pt"></div>`
    + `<table class="cb"><colgroup><col style="width:13.96%"><col style="width:30%"><col style="width:56.04%"></colgroup>`
    + `<thead><tr style="height:${CB.headH}pt"><th class="blue" style="font-size:${CB.headF}pt">교시</th><th class="blue" style="font-size:${CB.headF}pt">${esc(pg.head)}</th><th class="blue" style="font-size:${CB.headF}pt">응시학생 번호</th></tr></thead>`
    + `<tbody>${body}</tbody></table></div>`;
}
// 출력 대상 → 페이지 목록 (classes: [[g,c],...], kinds: ['고정','이동'])
function chalkAllPages(ctx, targets, kinds = ['고정', '이동']) {
  const out = [];
  targets.forEach(([g, c]) => kinds.forEach(kind => { const r = chalkPagesFor(g, c, kind, ctx); if (r.df.length) out.push(...r.pages); }));
  return out;
}

/* [파일 2] 칠판 부착용 B4 가로 — 하루 1장 */
function buildChalkboardWorkbook(ctx, targets) {
  const wb = new ExcelJS.Workbook(); wb.creator = '정기고사 부착물 시스템'; wb.created = new Date();
  const blue = XL.fill('FFBDD7EE'), gray = XL.fill('FFF1F5F9');
  const chars = pt => Math.round(((pt * 4 / 3) - 5) / 7 * 100) / 100; // pt → 엑셀 열 너비
  targets.forEach(([g, c]) => ['고정', '이동'].forEach(kind => {
    const { df, pages } = chalkPagesFor(g, c, kind, ctx);
    if (!df.length || !pages.length) return;
    const ws = wb.addWorksheet(`${g}-${c}반_${kind}`.slice(0, 31), { pageSetup: { paperSize: 12, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, margins: { left: .15, right: .15, top: .2, bottom: .2, header: 0, footer: 0 } } });
    CB.w.forEach((w, i) => { ws.getColumn(i + 1).width = chars(w); });
    pages.forEach((pg, pi) => {
      ws.addRow([]).height = CB.gapTop;
      const tr = ws.addRow([pg.label, '', '']); tr.height = CB.titleH;
      ws.mergeCells(tr.number, 1, tr.number, 3);
      const tc = ws.getCell(tr.number, 1); tc.font = XL.font(CB.titleF, true); tc.alignment = { vertical: 'middle', horizontal: 'center' };
      ws.addRow([]).height = CB.gapMid;
      const hr = ws.addRow(['교시', pg.head, '응시학생 번호']); hr.height = CB.headH;
      [1, 2, 3].forEach(i => { const x = hr.getCell(i); x.fill = blue; x.border = XL.border; x.font = XL.font(CB.headF, true); x.alignment = { vertical: 'middle', horizontal: 'center' }; });
      pg.rows.forEach(r => {
        const row = ws.addRow([r.first ? `${r.e.period}교시` : '', r.e.self ? SELF : subjectText(r.e, pg.subOne, '\r\n'), r.e.self ? '' : r.st.text]);
        row.height = pg.rowH; r.rowNum = row.number;
        const a = row.getCell(1); a.fill = blue; a.border = XL.border; a.font = XL.font(pg.f1, true); a.alignment = { vertical: 'middle', horizontal: 'center' };
        const b = row.getCell(2); b.border = XL.border; b.font = XL.font(pg.f2, true, r.e.self ? 'FF64748B' : 'FF000000'); b.fill = r.e.self ? gray : blue; b.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
        const x = row.getCell(3); x.border = XL.border;
        if (r.e.self) { x.fill = gray; ws.mergeCells(row.number, 2, row.number, 3); }
        else {
          x.font = XL.font(pg.f3, true, r.st.kind === 'none' ? 'FFE00000' : 'FF000000');
          x.alignment = r.st.kind === 'some' ? { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true } : { vertical: 'middle', horizontal: 'center', wrapText: true };
        }
      });
      pg.rows.forEach(r => { if (r.first && r.span > 1) ws.mergeCells(r.rowNum, 1, r.rowNum + r.span - 1, 1); });
      if (pi < pages.length - 1) ws.lastRow.addPageBreak();
    });
  }));
  return wb;
}

/* ----------------------- 과목별 응시현황 (공용 데이터) ----------------------- */
function overviewData(g, classes, ctx) {
  const { exams, classStudents, move, takers } = ctx;
  const list = exams[g];
  const sums = list.map(() => 0);
  const rows = [];
  classes.forEach(c => {
    const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
    [['이동반', sp.movedLabel, sp.moved], ['고정반', sp.fixedLabel, sp.fixed]].forEach(([lab, range, df]) => {
      const cells = list.map((e, i) => { const st = statusOf(g, e, df, takers); sums[i] += st.count; return st; });
      rows.push({ c, lab, range, cells });
    });
  });
  return { list, rows, sums };

/* ------------------------------- 시험명 -------------------------------- */
function defaultExam() {
  const d = new Date(), m = d.getMonth() + 1;
  return { year: m <= 2 ? d.getFullYear() - 1 : d.getFullYear(), sem: (m >= 8 || m <= 2) ? 2 : 1, round: 1 };
}
const examTitleOf = ex => `${ex.year}학년도 ${ex.sem}학기 ${ex.round}차 정기시험`;
// '9월 28일 월요일' → '9/28(월)'
function shortDate(label, d) {
  const m = String(label || '').match(/(\d+)\s*월\s*(\d+)\s*일\s*\(?\s*([월화수목금토일])/);
  return m ? `${m[1]}/${m[2]}(${m[3]})` : (label || `${d}일차`);
}

/* ---------------------- 반별 결시 학생 현황 (A4 세로 1장) ----------------------
 * 학년·반·구분(이동반/고정반)마다 1장. 상단: 학년/반/재적/결번/재적번호,
 * 표: 일시·교시·과목명·응시인원(그 아래 결시자 기록 공간)·감독교사 확인 */
const ABS_NOTE = '♣ 결시 학생을 정확하게 파악하셔서 결시자 OMR카드에 기록 및 마킹해 주시고, 답안지 회수용 봉투에도 기록해 주시기 바랍니다.';
const ABS_HEAD = '결시자 번호 – 이름 - 사유(공결,병결,미인정결,기타결)\n*해당자가 없을 시는 "없음"으로 표기*';
function absenceData(g, c, kind, ctx) {
  const { exams, tt, classStudents, move, takers, examTitle } = ctx;
  const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
  const df = kind === '이동' ? sp.moved : sp.fixed;
  const range = kind === '이동' ? sp.movedLabel : sp.fixedLabel;
  const ns = df.map(s => s.n), set = new Set(ns);
  const gaps = [];
  if (ns.length) for (let i = Math.min(...ns); i <= Math.max(...ns); i++) if (!set.has(i)) gaps.push(i);
  const list = [...exams[g]].sort((a, b) => a.day - b.day || a.period - b.period || (a.code || '99').localeCompare(b.code || '99'));
  const rows = list.map(e => ({ e, st: statusOf(g, e, df, takers), date: shortDate(tt[g].labels[e.day], e.day) }));
  rows.forEach((r, i) => {
    r.first = i === 0 || rows[i - 1].e.day !== r.e.day;
    if (r.first) { let k = i; while (k < rows.length && rows[k].e.day === r.e.day) k++; r.span = k - i; }
  });
  const rangeText = df.length ? `(${Math.min(...ns)}~${Math.max(...ns)}번)` : '-';
  return { g, c, kind, df, range, rangeText, gaps, rows, title: `${examTitle} 결시 학생 현황` };
}
function absenceHTML(a) {

    + `<tr class="hd"><td colspan="3" class="c b">${a.kind}반</td><td class="c b">재적번호</td><td class="c">${esc(a.rangeText)}</td></tr>`

    + body + `</tbody></table><div class="abnote">${esc(ABS_NOTE)}</div></div>`;
}
function absenceAllPages(ctx, targets) {
  const out = [];
  targets.forEach(([g, c]) => ['이동', '고정'].forEach(kind => { const a = absenceData(g, c, kind, ctx); if (a.df.length) out.push(a); }));

}
// [파일 3] 반별 결시 학생 현황 — 첨부 양식과 같은 열 구성, A4 세로 1장에 맞춤
function buildAbsenceWorkbook(ctx, targets) {
  const wb = new ExcelJS.Workbook(); wb.creator = '정기고사 부착물 시스템'; wb.created = new Date();

/* ------------------------------ 암호화 (Web Crypto) ------------------------------ */
const b64 = buf => { const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const cryptoReady = () => !!(window.crypto && crypto.subtle);
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await deriveKey(pw, salt, iter);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, alg: 'AES-GCM/PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(ct), createdAt: obj.createdAt };
}
async function decryptJSON(enc, pw) {
  const key = await deriveKey(pw, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, key, unb64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ------------------------------ GitHub 업로드 ------------------------------
 * GitHub Contents API로 파일 하나를 만들거나 덮어쓴다 (토큰: Contents 읽기·쓰기 권한) */
const GH_KEY = 'exam_generator_github_v1';
// 기본 저장 위치 (토큰은 보안상 코드에 넣지 않고, 관리자 PC 브라우저에만 저장)

async function githubError(r) {
  let m = ''; try { m = (await r.json()).message || ''; } catch (e) { /* 무시 */ }
  if (r.status === 401) return '토큰이 올바르지 않거나 만료되었습니다.';
  if (r.status === 403) return `권한이 없습니다. 토큰에 이 저장소의 Contents 쓰기 권한이 있는지 확인하세요. (${m})`;
  if (r.status === 404) return '저장소를 찾을 수 없습니다. 사용자명·저장소명·브랜치와 토큰의 저장소 접근 권한을 확인하세요.';
  if (r.status === 409 || r.status === 422) return `저장 충돌이 발생했습니다. 잠시 후 다시 시도하세요. (${m})`;
  return `GitHub 오류 ${r.status}: ${m}`;

async function githubPut(gh, content, message) {
  const owner = gh.owner.trim(), repo = gh.repo.trim();
  const base = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
  const headers = { Authorization: `Bearer ${gh.token.trim()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const get = u => fetch(u, { headers, cache: 'no-store' });
  // 1) 저장소 확인 — 안 보이면 토큰 소유자와 비교해 원인을 알려 준다
  const rr = await get(base);
  if (rr.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다. [토큰 변경]으로 새 토큰을 넣으세요.');
  if (rr.status === 404) {
    let who = ''; try { const u = await get('https://api.github.com/user'); if (u.ok) who = (await u.json()).login || ''; } catch (e) { /* 무시 */ }
    if (who && who.toLowerCase() !== owner.toLowerCase()) throw new Error(`이 토큰의 계정은 '${who}'인데 사용자명이 '${owner}'로 되어 있습니다. 사용자명을 확인하세요.`);
    throw new Error(`'${owner}/${repo}' 저장소에 이 토큰으로 접근할 수 없습니다.\n① 저장소 이름 철자(대소문자·하이픈)를 확인하세요.\n② 토큰의 Repository access가 'Only select repositories'라면 이 저장소가 선택되어 있어야 합니다. (토큰을 저장소보다 먼저 만들었다면 Edit에서 추가)`);
  }
  if (!rr.ok) throw new Error(await githubError(rr));
  const info = await rr.json();
  if (info.permissions && info.permissions.push === false) throw new Error('토큰에 쓰기 권한이 없습니다. 토큰 Permissions에서 Contents를 Read and write로 바꾸세요.');
  // 2) 브랜치 확인 — 없으면 기본 브랜치, 빈 저장소면 첫 파일로 브랜치를 만든다
  let branch = (gh.branch || '').trim() || info.default_branch;

  const br = await get(`${base}/branches/${encodeURIComponent(branch)}`);
  if (br.status === 404) {

    if (db && db.ok) branch = info.default_branch; else empty = true;
  }

  const path = gh.path.trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  let sha;
  if (!empty) {
    const g = await get(`${base}/contents/${path}?ref=${encodeURIComponent(branch)}`);
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error(await githubError(g));
  }
  const body = { message, content: b64(new TextEncoder().encode(content)) };
  if (!empty) body.branch = branch;
  if (sha) body.sha = sha;
  const r = await fetch(`${base}/contents/${path}`, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await githubError(r));
  return { ...(await r.json()), usedBranch: empty ? info.default_branch || 'main' : branch, wasEmpty: empty };
}
function pagesLink(gh, version) {
  let base = (gh.pages || '').trim();

  if (!base) return '';
  const p = gh.path.replace(/^\/+/, '').replace(/(^|\/)index\.html$/, '$1');
  return base.replace(/\/?$/, '/') + p + (version ? `?v=${version}` : '');
}

    const ws = wb.addWorksheet(`${g}학년`);
    ws.addRow(['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]);
    ws.addRow([g, 1, 1, `${g}0101`, '홍길동 (예시)', '남', '', ...subs.map((_, i) => i < 3 ? '1' : '')]);
    ws.addRow([g, 1, 2, `${g}0102`, '김철수 (예시)', '남', '전출', ...subs.map(() => '')]);
    ws.addRow([g, 1, 3, `${g}0103`, '이영희 (예시)', '여', '', ...subs.map((_, i) => i >= 3 && i < 6 ? '1' : '')]);
    ws.getRow(1).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill('FFE7E6E6'); x.alignment = { horizontal: 'center', wrapText: true }; });
    [8, 6, 6, 9, 16, 6, 10].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    subs.forEach((_, i) => { ws.getColumn(i + 8).width = 12; });
  });
  return wb;
}

/* ------------------------------ 작은 컴포넌트 ------------------------------ */
const Card = ({ step, title, right, children }) => html`
  <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
    <div className="flex items-center justify-between gap-2 mb-3">
      <h2 className="text-sm font-bold text-slate-800 flex items-center gap-2">
        <span className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">${step}</span>${title}
      </h2>${right}
    </div>${children}
  </section>`;
const Seg = ({ value, options, onChange, size = 'sm' }) => html`
  <div className="inline-flex rounded-lg border border-slate-300 overflow-hidden">
    ${options.map(([v, label]) => html`<button type="button" key=${v} onClick=${() => onChange(v)}
      className=${`${size === 'xs' ? 'px-2 py-1 text-[11px]' : 'px-3 py-1.5 text-xs'} font-semibold transition ${value === v ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>${label}</button>`)}
  </div>`;
const btn = 'text-xs font-semibold py-2.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5 text-center cursor-pointer';

/* ================================ 메인 앱 ================================ */
function App() {
  const [sourceLabel, setSourceLabel] = useState('');
  const sourcesRef = useRef([]);
  const [keywords, setKeywords] = useState(DEFAULT_KEYWORDS);
  const [roster, setRoster] = useState({ students: [], subjectsByGrade: { 1: [], 2: [], 3: [] }, sheets: [], dup: 0, skipped: 0, unknownGrade: 0 });
  const [move, setMove] = useState({ 1: { ...DEFAULT_MOVE }, 2: { ...DEFAULT_MOVE }, 3: { ...DEFAULT_MOVE } });
  const [sel, setSel] = useState({});
  const [tt, setTT] = useState(emptyTT);
  const [codes, setCodes] = useState(defaultCodes);
  const [msg, setMsg] = useState({ text: '준비되었습니다.', type: 'info' });
  const [busy, setBusy] = useState(false);
  const [savedAt, setSavedAt] = useState('');
  const [shareOpen, setShareOpen] = useState(false);
  // 화면 상태
  const [tab, setTab] = useState(VIEWER ? 'chalkboard' : 'timetable');
  const [selGrade, setSelGrade] = useState(3);
  const [ttGrade, setTTGrade] = useState(3);
  const [pv, setPv] = useState({ g: 3, c: 1, kind: '고정', day: 1, zoom: 'fit' });
  const [ov, setOv] = useState({ g: 3, c: 'all' });
  const [cf, setCf] = useState({ g: 3, c: 1 });
  const [ab, setAb] = useState({ g: 3, c: 1, kind: '이동' });
  const [exam, setExam] = useState(defaultExam);
  const examTitle = examTitleOf(exam);

  const say = (text, type = 'success') => setMsg({ text, type });

  /* ---------- 명단 적용 ---------- */
  const applySources = (sources, label, kw = keywords, keepSel = null) => {
    sourcesRef.current = sources;
    const r = buildRoster(sources, parseKeywords(kw));
    if (!r.students.length) { say('명단에서 학생을 찾지 못했습니다. 이름·반·번호(또는 학번) 열이 있는지 확인하세요.', 'error'); return null; }
    setRoster(r); setSourceLabel(label);
    const keys = [...new Set(r.students.map(s => clsKey(s.g, s.c)))];
    setSel(prev => { const base = keepSel || prev; const next = {}; keys.forEach(k => { next[k] = base[k] !== undefined ? base[k] : true; }); return next; });
    const gs = [...new Set(r.students.map(s => s.g))].sort();
    if (!gs.includes(selGrade)) setSelGrade(gs[gs.length - 1]);
    if (!gs.includes(pv.g)) setPv(p => ({ ...p, g: gs[gs.length - 1], c: Math.min(...r.students.filter(s => s.g === gs[gs.length - 1]).map(s => s.c)) }));
    const ex = r.students.filter(s => s.excluded).length;
    say(`✓ 명단 로드 완료: ${gs.map(g => `${g}학년 ${r.students.filter(s => s.g === g && !s.excluded).length}명`).join(' · ')}${ex ? ` (전출·위탁 등 ${ex}명 자동 제외)` : ''}${r.unknownGrade ? ` · 학년을 알 수 없는 ${r.unknownGrade}명 제외` : ''}`);
    return r;
  };

  const loadSample = () => {
    applySources(sampleSources(), '샘플 데이터 (1~3학년, 9개 학급)');
    setTT(sampleTT()); setCodes(defaultCodes());
    say('샘플 명단(1~3학년)과 샘플 시간표가 로드되었습니다. 실제 명단·시간표 파일을 업로드하세요.', 'info');
  };

  // 일반 사용자용: 파일에 들어 있는 결과 데이터로 시작
  const loadViewer = () => {
    const students = VIEWER.students.map(s => ({ ...s, takenNorm: new Set(s.taken.map(norm)) }));
    setRoster({ students, subjectsByGrade: VIEWER.subjectsByGrade, sheets: [], dup: 0, skipped: 0, unknownGrade: 0 });
    setTT(VIEWER.tt); setCodes(VIEWER.codes); setMove(VIEWER.move); setSel(VIEWER.sel); if (VIEWER.exam) setExam(VIEWER.exam);
    setSourceLabel(VIEWER.label);
    const gs = [...new Set(students.map(s => s.g))].sort();
    const g0 = gs[0] || 1, c0 = Math.min(...students.filter(s => s.g === g0).map(s => s.c));
    setPv(p => ({ ...p, g: g0, c: c0 })); setOv({ g: g0, c: 'all' }); setCf({ g: g0, c: c0 }); setAb({ g: g0, c: c0, kind: '이동' });
    say(`일반 사용자용 화면입니다. 학년·학급을 골라 미리보기 후 인쇄하거나 칠판 부착물 엑셀을 내려받으세요. (자료 기준: ${VIEWER.createdAt})`, 'info');
  };
  // 관리자: 결과 데이터를 담은 일반 사용자용 HTML 파일 만들기
  // 관리자: 일반 사용자용 파일에 넣을 결과 데이터
  const makePayload = () => {
    const now = new Date();
    return {
      v: 1, createdAt: now.toLocaleString('ko-KR'), label: `${sourceLabel} (${now.toLocaleDateString('ko-KR')} 기준)`,
      students: students.map(({ g, c, n, id, name, gender, taken, excluded, reason }) => ({ g, c, n, id, name, gender, taken, excluded, reason })),
      subjectsByGrade: roster.subjectsByGrade, tt, codes, move, sel, exam,
    };
  };
  const makeViewerFile = () => { if (guard()) setShareOpen(true); };

  // 시작 시: 저장된 설정 복원 + 샘플 명단
  useEffect(() => {
    if (VIEWER) { loadViewer(); return; }
    let cfg = null;
    try { const raw = safeStorage.get(CONFIG_KEY); if (raw) cfg = JSON.parse(raw); } catch (e) { cfg = null; }
    if (cfg) {
      const kw = cfg.keywords || DEFAULT_KEYWORDS;
      setKeywords(kw);
      if (cfg.move) setMove(m => ({ ...m, ...cfg.move }));
      if (cfg.tt) setTT(t => ({ ...t, ...cfg.tt }));
      if (cfg.codes) setCodes(c => ({ ...c, ...cfg.codes }));
      if (cfg.exam) setExam(cfg.exam);
      // 저장해 둔 명단 원본이 있으면 그대로 다시 읽고, 없으면 샘플 명단
      const hasRoster = Array.isArray(cfg.sources) && cfg.sources.length > 0;
      applySources(hasRoster ? cfg.sources : sampleSources(), hasRoster ? cfg.label : '샘플 데이터 (1~3학년, 9개 학급)', kw, cfg.sel || {});
      setSavedAt(cfg.savedAt || '');
      say(hasRoster ? `💾 마지막으로 저장한 상태(명단·시간표·설정)를 불러왔습니다. (저장 시각: ${cfg.savedAt || '-'})` : '저장된 설정을 불러왔습니다. 명단 파일을 업로드하세요.', 'info');
    } else loadSample();
  }, []);

  const readFile = file => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => { try { const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); res({ fileName: file.name, wb }); } catch (err) { rej(err); } };
    fr.onerror = rej; fr.readAsArrayBuffer(file);
  });
  const sheetRows = (wb, name) => XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });

  const onRosterUpload = async e => {
    const files = [...(e.target.files || [])]; e.target.value = '';
    if (!files.length) return;
    try {
      const books = await Promise.all(files.map(readFile));
      const sources = books.map(b => ({ fileName: b.fileName, sheets: b.wb.SheetNames.map(n => ({ name: n, rows: sheetRows(b.wb, n) })) }));
      applySources(sources, files.map(f => f.name).join(', '));
    } catch (err) { say(`학생 명단 파일 읽기 오류: ${err.message}`, 'error'); }
  };
  const reapplyKeywords = () => { if (sourcesRef.current.length) applySources(sourcesRef.current, sourceLabel, keywords, sel); };

  const onTTUpload = async e => {
    const file = e.target.files?.[0]; e.target.value = '';
    if (!file) return;
    try {
      const { wb } = await readFile(file);
      const nextTT = deepClone(tt), nextCodes = deepClone(codes);
      const done = [];
      const legacy = { tt: null, codes: null };
      wb.SheetNames.forEach(name => {
        const g = gradeHint(name), rows = sheetRows(wb, name);
        if (/코드/.test(name)) { const list = parseCodeSheet(rows); if (!list.length) return; if (g) { nextCodes[g] = list; done.push(`${g}학년 과목코드 ${list.length}개`); } else legacy.codes = list; }
        else if (/시간표/.test(name)) { const t = parseTTSheet(rows); if (!t) return; if (g) { nextTT[g] = t; done.push(`${g}학년 시간표`); } else legacy.tt = t; }
      });
      // 예전 양식(학년 구분 없는 '시간표'·'과목코드' 시트)은 현재 선택된 학년 탭에 적용
      if (legacy.codes) { nextCodes[ttGrade] = legacy.codes; done.push(`${ttGrade}학년 과목코드(구양식)`); }
      if (legacy.tt) { nextTT[ttGrade] = legacy.tt; done.push(`${ttGrade}학년 시간표(구양식)`); }
      if (!done.length) { say("시간표 파일에서 '1학년 시간표', '1학년 과목코드' 같은 시트를 찾지 못했습니다.", 'error'); return; }
      // 과목명 정식화
      GRADES.forEach(g => {
        const cells = {};
        Object.entries(nextTT[g].cells).forEach(([k, subs]) => { cells[k] = [...new Set(subs.map(s => canonicalName(s, nextCodes[g], roster.subjectsByGrade[g])))]; });
        nextTT[g].cells = cells;
      });
      setTT(nextTT); setCodes(nextCodes); setTab('timetable');
      say(`📅 시간표 파일 적용 완료: ${done.join(', ')}`);
    } catch (err) { say(`시간표 파일 읽기 오류: ${err.message}`, 'error'); }
  };

  // 명단 원본 + 시간표·과목코드·이동반·학급 선택·제외 키워드를 이 브라우저에 저장 (새로고침해도 유지)
  const saveConfig = () => {
    const savedAt = new Date().toLocaleString('ko-KR');
    const base = { v: 9, savedAt, keywords, move, sel, tt, codes, exam };
    const isSample = sourceLabel.startsWith('샘플 데이터');
    let ok = safeStorage.set(CONFIG_KEY, JSON.stringify(isSample ? base : { ...base, label: sourceLabel, sources: sourcesRef.current }));
    if (!ok) { // 저장 공간이 부족하면 명단을 빼고 설정만 저장
      ok = safeStorage.set(CONFIG_KEY, JSON.stringify(base));
      if (ok) { setSavedAt(savedAt); say('⚠ 명단이 너무 커서 명단은 저장하지 못했습니다. 시간표·설정만 저장되었습니다.', 'error'); return; }
    }
    if (ok) setSavedAt(savedAt);
    say(ok ? `💾 저장 완료 (${savedAt}) — 명단${isSample ? '(샘플 제외)' : ''}·시간표·과목코드·이동반·학급 선택이 이 브라우저에 보관됩니다. 새로고침해도 유지됩니다.` : '이 브라우저에서는 저장할 수 없습니다. (개인정보 보호 모드 등)', ok ? 'success' : 'error');
  };
  // 저장 내용을 모두 지우고 처음 상태(샘플)로
  const resetConfig = () => {
    if (!confirm('저장된 명단·시간표·설정을 모두 지우고 처음 상태로 되돌릴까요?\n(되돌릴 수 없습니다)')) return;
    safeStorage.remove(CONFIG_KEY);
    setKeywords(DEFAULT_KEYWORDS); setExam(defaultExam());
    setMove({ 1: { ...DEFAULT_MOVE }, 2: { ...DEFAULT_MOVE }, 3: { ...DEFAULT_MOVE } });
    setTT(sampleTT()); setCodes(defaultCodes()); setSavedAt('');
    applySources(sampleSources(), '샘플 데이터 (1~3학년, 9개 학급)', DEFAULT_KEYWORDS, {});
    say('🔄 설정을 초기화했습니다. 샘플 데이터 상태입니다.', 'info');
  };

  /* ---------- 파생 데이터 ---------- */
  const students = roster.students;
  const classesByGrade = useMemo(() => {
    const o = { 1: [], 2: [], 3: [] };
    students.forEach(s => { if (!o[s.g].includes(s.c)) o[s.g].push(s.c); });
    GRADES.forEach(g => o[g].sort((a, b) => a - b)); return o;
  }, [students]);
  const presentGrades = GRADES.filter(g => classesByGrade[g].length);
  const classStudents = (g, c) => students.filter(s => s.g === g && s.c === c);
  const selected = useMemo(() => Object.fromEntries(GRADES.map(g => [g, classesByGrade[g].filter(c => sel[clsKey(g, c)])])), [classesByGrade, sel]);
  const rosterNorm = useMemo(() => Object.fromEntries(GRADES.map(g => [g, new Set(roster.subjectsByGrade[g].map(norm))])), [roster]);
  const codeOf = (g, sub) => (codes[g] || []).find(x => norm(x.name) === norm(sub))?.code || '';
  const isCommon = (g, sub) => !isSelf(sub) && !rosterNorm[g].has(norm(sub));
  const exams = useMemo(() => {
    const o = {};
    GRADES.forEach(g => {
      const t = tt[g], list = [];
      Object.entries(t.cells).forEach(([k, subs]) => {
        const [d, p] = k.split('-').map(Number);
        if (d > t.days || p > t.periods) return;
        subs.forEach(sub => list.push({ sub, day: d, period: p, code: isSelf(sub) ? '' : codeOf(g, sub), self: isSelf(sub), common: isCommon(g, sub) }));
      });
      list.sort((a, b) => a.day - b.day || a.period - b.period || (a.code || '99').localeCompare(b.code || '99'));
      o[g] = list;
    });
    return o;
  }, [tt, codes, rosterNorm]);
  const takers = (g, df, sub) => {
    const common = isCommon(g, sub), n = norm(sub);
    return df.filter(s => common || s.takenNorm.has(n)).map(s => s.n).sort((a, b) => a - b);
  };
  const ctx = { selected, exams, tt, classStudents, move, takers, examTitle };

  /* ---------- 출력 ---------- */
  const guard = () => {
    if (!students.length) { alert('학생 데이터가 없습니다.'); return false; }
    if (!GRADES.some(g => selected[g].length)) { alert('대상 학급을 최소 1개 이상 선택해주세요.'); return false; }
    if (!GRADES.some(g => selected[g].length && exams[g].some(e => !e.self))) { alert('선택한 학년의 시험 시간표에 시험 과목이 없습니다. 시간표를 업로드하거나 [시간표 확인·수정] 탭에서 입력하세요.'); return false; }
    return true;
  };
  const exportFile = async (kind, targets) => {
    if (targets ? !students.length : !guard()) return;
    setBusy(true); say(kind === 1 ? '과목별 응시현황 엑셀 생성 중...' : kind === 3 ? '반별 결시 학생 현황 엑셀 생성 중...' : '칠판 부착용 B4 출력물 생성 중...', 'info');
    try {
      if (kind === 3) { const tg = targets || GRADES.flatMap(g => selected[g].map(c => [g, c])); await downloadWorkbook(buildAbsenceWorkbook(ctx, tg), tg.length === 1 ? `정기고사_결시현황_${tg[0][0]}학년${tg[0][1]}반_A4.xlsx` : `정기고사_반별_결시학생현황_A4.xlsx`); say('✅ [파일 3] 반별 결시 학생 현황(A4) 다운로드 완료!'); return; }
      if (kind === 1) { await downloadWorkbook(buildOverviewWorkbook(ctx), `정기고사_선택과목_응시현황_및_확인표.xlsx`); say('✅ [파일 1] 과목별 응시현황 및 응시확인표 다운로드 완료!'); }
      else { await downloadWorkbook(buildChalkboardWorkbook(ctx, targets || GRADES.flatMap(g => selected[g].map(c => [g, c]))), targets && targets.length === 1 ? `정기고사_칠판부착용_${targets[0][0]}학년${targets[0][1]}반_B4.xlsx` : `정기고사_칠판부착용_상세출력물_B4.xlsx`); say('✅ [파일 2] 칠판 부착용 상세 출력물(B4) 다운로드 완료!'); }
    } catch (err) { console.error(err); say(`엑셀 생성 오류: ${err.message}`, 'error'); }
    finally { setBusy(false); }
  };

  /* ---------- 시간표 편집 ---------- */
  const editTT = (g, fn) => setTT(prev => { const next = deepClone(prev); fn(next[g]); return next; });
  const addSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; const cur = t.cells[k] || []; if (!cur.some(x => norm(x) === norm(sub))) t.cells[k] = isSelf(sub) ? [SELF] : [...cur.filter(x => !isSelf(x)), sub]; });
  const removeSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; t.cells[k] = (t.cells[k] || []).filter(x => x !== sub); if (!t.cells[k].length) delete t.cells[k]; });

  /* =============================== 렌더 =============================== */
  const ex = students.filter(s => s.excluded);
  return html`
  <div className="min-h-screen flex flex-col">
    <header className="bg-slate-900 text-white shadow-md">
      <div className="max-w-[1500px] mx-auto px-4 py-5 flex flex-col lg:flex-row justify-between items-center gap-4">
        <h1 className="text-xl sm:text-2xl xl:text-[28px] font-black tracking-tight leading-snug text-center lg:text-left" style=${{ wordBreak: 'keep-all' }}>
          고등학교 정기시험 선택과목 분반 및 <span className="inline-block">시험 시간표 자동 편성 시스템</span></h1>
        <div className="flex items-center gap-2 shrink-0">
          ${VIEWER ? html`<span className="text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/40">일반 사용자용 · 자료 기준 ${VIEWER.createdAt}</span>` : html`
          <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/40">관리자</span>
          <button onClick=${loadSample} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3.5 py-2.5 rounded-lg border border-slate-700">✨ 샘플 데이터 로드</button>

          <button id="lockBtn" onClick=${lockAdmin} title="관리자 화면 잠그기 (다시 들어올 때 비밀번호 필요)" className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-lg border border-slate-700">🔒</button>

        <span>${msg.text}</span>
        <span className="ml-auto text-xs opacity-75">현재 명단: ${sourceLabel || '-'} | 응시 대상 ${students.length - ex.length}명${ex.length ? ` (제외 ${ex.length}명)` : ''}</span>

    <main className="max-w-[1500px] mx-auto w-full p-4 md:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6 flex-grow">

              <tbody>${presentGrades.map(g => { const gs = students.filter(s => s.g === g); return html`<tr key=${g} className="text-center border-t border-slate-100">

                <td>${gs.filter(s => !s.excluded).length}명</td><td className=${gs.some(s => s.excluded) ? 'text-rose-600 font-semibold' : 'text-slate-400'}>${gs.filter(s => s.excluded).length}명</td>

            ${(roster.dup > 0 || roster.unknownGrade > 0) && html`<p className="text-[11px] text-amber-700 mt-2">⚠ ${roster.dup ? `중복 행 ${roster.dup}개(나중 행으로 덮어씀) ` : ''}${roster.unknownGrade ? `학년을 알 수 없어 빠진 학생 ${roster.unknownGrade}명` : ''}</p>`}
            <details className="mt-2 text-xs" open=${ex.length > 0 && ex.length <= 8}>
              <summary className="text-slate-600 font-semibold">자동 제외된 학생 ${ex.length}명</summary>

            <button onClick=${async () => { await downloadWorkbook(buildTimetableTemplate(tt, codes), `시간표_및_과목코드_표준양식.xlsx`); say('📥 시간표 및 과목코드 양식(현재 입력 내용 포함)이 다운로드되었습니다.'); }} className=${`${btn} bg-slate-800 hover:bg-slate-700 text-white`}>⬇ 시간표 양식 다운로드</button>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3 text-center text-[11px]">
            ${GRADES.map(g => { const n = exams[g].filter(e => !e.self).length; return html`<div key=${g} className=${`rounded-lg border px-2 py-1.5 ${n ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-slate-200 text-slate-400'}`}><b>${g}학년</b> 시험 ${n}과목<br/>코드 ${(codes[g] || []).length}개</div>`; })}

        <//>

        <${Card} step="4" title="이동반 산정 방식 (학년별)">
          <p className="text-[11px] text-slate-500 mb-3">인원은 실제로 이동하는 학생 수입니다. 전출·위탁 등 제외 학생은 건너뛰고 셉니다. (예: 12번 결번, 앞번호 18명 → 1~19번 이동)</p>
          <div className="space-y-2">
            ${(presentGrades.length ? presentGrades : GRADES).map(g => html`<div key=${g} className="flex items-center gap-2 flex-wrap">
              <span className="w-12 text-xs font-bold text-slate-700">${g}학년</span>
              <${Seg} value=${move[g].dir} onChange=${v => setMove(m => ({ ...m, [g]: { ...m[g], dir: v } }))} options=${[['front', '앞 번호부터 (1학기)'], ['back', '뒷 번호부터 (2학기)']]} size="xs" />
              <input type="number" min="0" max="50" value=${move[g].count} data-move-grade=${g}
                onChange=${e => setMove(m => ({ ...m, [g]: { ...m[g], count: Math.max(0, parseInt(e.target.value) || 0) } }))}
                className="w-14 text-center font-bold border border-slate-300 rounded-md py-1 text-sm" />
              <span className="text-[11px] text-slate-500">명 이동</span>
            </div>`)}

        <//>

        <${Card} step="5" title="대상 학급 선택" right=${html`<div className="flex gap-1 text-[11px]">
            <button className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200" onClick=${() => setSel(s => Object.fromEntries(Object.keys(s).map(k => [k, true])))}>전체 선택</button>
            <button className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200" onClick=${() => setSel(s => Object.fromEntries(Object.keys(s).map(k => [k, false])))}>전체 해제</button></div>`}>
          <div className="flex border-b border-slate-200 mb-3" role="tablist">
            ${GRADES.map(g => { const total = classesByGrade[g].length, on = selected[g].length; return html`<button key=${g} disabled=${!total} onClick=${() => setSelGrade(g)}
              className=${`flex-1 py-2 text-xs font-semibold border-b-2 -mb-px ${selGrade === g ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500'} ${!total ? 'opacity-40' : ''}`}>
              ${g}학년 <span className=${`ml-1 px-1.5 rounded-full ${on ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-400'}`}>${on}/${total}</span></button>`; })}
          </div>
          ${classesByGrade[selGrade].length === 0 ? html`<p className="text-xs text-slate-400">${selGrade}학년 명단이 없습니다.</p>` : html`
            <div className="flex justify-between items-center mb-2">
              <label className="flex items-center gap-1.5 text-xs font-semibold text-slate-700"><input type="checkbox"
                checked=${selected[selGrade].length === classesByGrade[selGrade].length}
                onChange=${e => setSel(s => ({ ...s, ...Object.fromEntries(classesByGrade[selGrade].map(c => [clsKey(selGrade, c), e.target.checked])) }))} /> ${selGrade}학년 전체</label>
              <span className="text-[11px] text-slate-400">선택 학급 합계: ${GRADES.reduce((a, g) => a + selected[g].length, 0)}개</span>
            </div>
            <div className="grid grid-cols-4 gap-1.5">
              ${classesByGrade[selGrade].map(c => { const k = clsKey(selGrade, c), n = classStudents(selGrade, c).filter(s => !s.excluded).length; return html`<label key=${k}

                <span className="flex items-center gap-1"><input type="checkbox" checked=${!!sel[k]} onChange=${e => setSel(s => ({ ...s, [k]: e.target.checked }))} />${c}반</span>
                <span className="text-[10px] opacity-70">${n}명</span></label>`; })}
            </div>`}
        <//>

        <div className="space-y-2">
          <button id="export1" onClick=${() => exportFile(1)} disabled=${busy} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl shadow">⬇ [파일 1] 과목별 응시현황 및 응시확인표</button>
          <button id="export2" onClick=${() => exportFile(2)} disabled=${busy} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl shadow">🖨 [파일 2] 칠판 부착용 상세 출력물(B4)</button>
          <button id="export3" onClick=${() => exportFile(3)} disabled=${busy} className="w-full bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl shadow">📋 [파일 3] 반별 결시 학생 현황(A4)</button>
        </div>

      <div className=${`${VIEWER ? 'xl:col-span-12' : 'xl:col-span-8'} bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col min-w-0`}>
        <div className="flex flex-wrap gap-1 px-3 pt-3 border-b border-slate-200 bg-slate-50 rounded-t-xl">
          ${[['timetable', '📅 시간표 확인·수정'], ['chalkboard', '🖨 칠판 부착용(B4)'], ['overview', '📊 과목별 응시현황'], ['confirm', '📝 반별 응시확인표'], ['absence', '📋 결시 학생 현황']].filter(([k]) => !VIEWER || k === 'chalkboard' || k === 'confirm').map(([k, label]) => html`
            <button key=${k} data-tab=${k} onClick=${() => setTab(k)} className=${`px-3.5 py-2 text-xs rounded-t-lg ${tab === k ? 'bg-white text-indigo-700 font-bold border border-b-white border-slate-200 -mb-px' : 'text-slate-600 hover:bg-slate-100'}`}>${label}</button>`)}

        <div className="p-4 overflow-auto">
          ${tab === 'timetable' && html`<${TimetableEditor} examTitle=${examTitle} g=${ttGrade} setG=${setTTGrade} tt=${tt} codes=${codes} exams=${exams} roster=${roster} hasStudents=${students.length > 0}
              codeOf=${codeOf} isCommon=${isCommon} addSub=${addSub} removeSub=${removeSub} editTT=${editTT} />`}
          ${tab === 'chalkboard' && html`<${ChalkboardPreview} pv=${pv} setPv=${setPv} ctx=${ctx} classesByGrade=${classesByGrade} presentGrades=${presentGrades} onExport=${() => exportFile(2)} onExportClass=${t => exportFile(2, t)} busy=${busy} />`}
          ${tab === 'overview' && !VIEWER && html`<${OverviewPreview} ov=${ov} setOv=${setOv} ctx=${ctx} classesByGrade=${classesByGrade} presentGrades=${presentGrades} onExport=${() => exportFile(1)} busy=${busy} />`}
          ${tab === 'confirm' && html`<${ConfirmPreview} cf=${cf} setCf=${setCf} ctx=${ctx} classesByGrade=${classesByGrade} presentGrades=${presentGrades} onExport=${() => exportFile(1)} busy=${busy} />`}
          ${tab === 'absence' && !VIEWER && html`<${AbsencePreview} ab=${ab} setAb=${setAb} ctx=${ctx} classesByGrade=${classesByGrade} presentGrades=${presentGrades} onExport=${t => exportFile(3, t)} busy=${busy} />`}

    </main>
    ${shareOpen && html`<${ShareDialog} onClose=${() => setShareOpen(false)} makePayload=${makePayload} say=${say} />`}

}

/* -------------------------- 시간표 확인·수정 탭 -------------------------- */
function TimetableEditor({ examTitle, g, setG, tt, codes, exams, roster, hasStudents, codeOf, isCommon, addSub, removeSub, editTT }) {
  const t = tt[g];
  const days = Array.from({ length: t.days }, (_, i) => i + 1);
  const periods = Array.from({ length: t.periods }, (_, i) => i + 1);
  const placed = new Map();
  Object.entries(t.cells).forEach(([k, subs]) => subs.forEach(s => { if (!isSelf(s)) placed.set(norm(s), [...(placed.get(norm(s)) || []), k]); }));
  const codeList = codes[g] || [];
  const extra = roster.subjectsByGrade[g].filter(s => !codeList.some(c => norm(c.name) === norm(s)));
  const list = exams[g].filter(e => !e.self && e.day <= t.days && e.period <= t.periods);
  const noCode = [...new Set(list.filter(e => !e.code).map(e => e.sub))];
  const common = hasStudents ? [...new Set(list.filter(e => e.common).map(e => e.sub))] : [];
  const dups = [...placed.entries()].filter(([, ks]) => ks.length > 1).map(([n]) => list.find(e => norm(e.sub) === n)?.sub).filter(Boolean);
  const notScheduled = roster.subjectsByGrade[g].filter(s => !placed.has(norm(s)));
  const [showCodes, setShowCodes] = useState(false);
  const opt = (name, label, k) => html`<option key=${k} value=${name}>${label}${placed.has(norm(name)) ? ' ✓' : ''}</option>`;

  return html`<div>
    <div className="text-center mb-3" id="ttTitle"><div className="text-xs font-bold text-slate-500">${examTitle}</div><div className="text-lg font-black">${g}학년 시험 시간표</div></div>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
      <${Seg} value=${g} onChange=${setG} options=${GRADES.map(x => [x, `${x}학년`])} />
      <div className="flex flex-wrap gap-1.5 text-[11px]">
        <span className="self-center text-slate-500 mr-1">교시</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.max(1, x.periods - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.periods}교시</span>
        <button id="addPeriod" className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.min(6, x.periods + 1); })}>+</button>
        <span className="self-center text-slate-500 ml-3 mr-1">일차</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.max(1, x.days - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.days}일</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.min(10, x.days + 1); })}>+</button>
        <button className="ml-3 px-2 py-1 rounded border border-rose-200 text-rose-600 hover:bg-rose-50" onClick=${() => { if (confirm(`${g}학년 시간표의 과목을 모두 비울까요?`)) editTT(g, x => { x.cells = {}; }); }}>비우기</button>
      </div>
    </div>
    <div className="overflow-x-auto">
      <table className="w-full border-collapse text-xs" id="ttTable">
        <thead><tr className="bg-slate-100">
          <th className="border border-slate-300 p-2 w-16">교시</th>
          ${days.map(d => html`<th key=${d} className="border border-slate-300 p-1.5 min-w-[140px]">
            <div className="font-bold">${d}일차</div>
            <input value=${t.labels[d] || ''} placeholder="날짜 입력" onChange=${e => { const v = e.target.value; editTT(g, x => { x.labels[d] = v; }); }}
              className="mt-1 w-full text-center text-[11px] font-normal border border-slate-200 rounded px-1 py-0.5 bg-white" /></th>`)}
        </tr></thead>
        <tbody>${periods.map(p => html`<tr key=${p}>
          <td className=${`border border-slate-300 text-center font-bold ${p >= 4 ? 'bg-amber-50' : 'bg-slate-50'}`}>${p}교시</td>
          ${days.map(d => { const subs = t.cells[`${d}-${p}`] || []; return html`<td key=${d} className="border border-slate-300 p-1.5 align-top" data-cell=${`${d}-${p}`}>
            <div className="flex flex-col gap-1">

// 실제 크기 HTML 페이지를 화면 폭에 맞게 축소해서 보여준다
function ScaledPage({ htmlStr, widthPx, heightPx, zoom }) {
  const ref = useRef(null);
  const [boxW, setBoxW] = useState(900);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(() => setBoxW(el.clientWidth)); ro.observe(el); return () => ro.disconnect();
  }, []);
  const z = zoom === 'fit' ? Math.min(1, (boxW - 16) / widthPx, Math.max(360, window.innerHeight - 140) / heightPx) : parseInt(zoom) / 100;
  return html`<div ref=${ref} className="bg-slate-200 rounded-lg p-2 overflow-auto">
    <div style=${{ width: widthPx * z, height: heightPx * z }} className="mx-auto shadow-lg">
      <div style=${{ width: widthPx, transform: `scale(${z})`, transformOrigin: 'top left' }} dangerouslySetInnerHTML=${{ __html: htmlStr }} />
    </div></div>`;
}

/* ---------------------- 일반 사용자용 파일 만들기 창 (관리자) ---------------------- */
function ShareDialog({ onClose, makePayload, say }) {
  const [gh, setGh] = useState(loadGh);
  const [tokenEdit, setTokenEdit] = useState(() => !loadGh().token);
  const [newToken, setNewToken] = useState('');
  const [tokenMsg, setTokenMsg] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [link, setLink] = useState('');
  const [copied, setCopied] = useState(false);
  const [showGh, setShowGh] = useState(() => !loadGh().token);
  const set = o => setGh(g => ({ ...g, ...o }));
  const pwErr = !pw ? '' : pw.length < 6 ? '6자 이상으로 정하세요.' : pw !== pw2 ? '두 비밀번호가 다릅니다.' : '';
  const pwOk = pw.length >= 6 && pw === pw2;
  const ghOk = gh.owner.trim() && gh.repo.trim() && gh.branch.trim() && gh.path.trim() && gh.token.trim();

  const build = async () => {
    const payload = makePayload();
    if (!pw) return { html: buildViewerHTML(payload), payload };
    if (!cryptoReady()) throw new Error('이 브라우저에서는 암호화를 쓸 수 없습니다. (https 주소나 내 PC 파일로 열어 주세요)');
    return { html: buildViewerHTML(payload, await encryptJSON(payload, pw)), payload };
  };
  const download = async () => {
    if (pw && !pwOk) { setErr(pwErr); return; }
    setBusy(true); setErr('');
    try {
      const { html: h } = await build();
      const blob = new Blob([h], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `정기시험_출력물_일반사용자용_${stamp(new Date())}.html`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      say(pw ? '📤 비밀번호가 걸린 일반 사용자용 파일을 내려받았습니다.' : '📤 일반 사용자용 파일을 내려받았습니다. (암호 없음 · 학생 이름이 들어 있으니 교내에서만 공유하세요)');
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const upload = async () => {
    if (!pwOk) { setErr('GitHub에 올릴 때는 열람 비밀번호가 꼭 필요합니다. ' + (pwErr || '')); return; }
    if (!ghOk) { setErr(gh.token ? 'GitHub 설정(사용자명·저장소·브랜치·경로)을 확인하세요.' : 'GitHub 접근 토큰을 먼저 입력하고 [토큰 저장]을 누르세요.'); setShowGh(true); setTokenEdit(true); return; }
    setBusy(true); setErr(''); setLink('');
    try {
      const { html: h, payload } = await build();
      const res = await githubPut(gh, h, `정기시험 출력물 갱신 (${payload.createdAt})`);
      if (res.wasEmpty) setErr(`ℹ 빈 저장소라서 첫 파일로 '${res.usedBranch}' 브랜치를 만들었습니다. Settings → Pages에서 이 브랜치를 선택해야 링크가 열립니다.`);
      saveGh(gh);
      const l = pagesLink(gh, stamp(new Date()));
      setLink(l);
      say('☁ GitHub에 올렸습니다. 링크와 비밀번호를 선생님들께 전달하세요. (반영까지 1~2분 걸릴 수 있습니다)');
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const storeToken = () => {
    const t = newToken.trim();
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(t)) { setTokenMsg('토큰 형식이 아닙니다. github_pat_ 로 시작하는 토큰 전체를 붙여 넣으세요.'); return; }
    const next = { ...gh, token: t }; setGh(next); saveGh(next);
    setNewToken(''); setTokenEdit(false); setTokenMsg('✅ 토큰을 저장했습니다. 다음부터 자동으로 사용됩니다.');
  };
  const clearToken = () => {
    if (!confirm('저장된 GitHub 토큰을 이 브라우저에서 지울까요?')) return;
    const next = { ...gh, token: '' }; setGh(next); saveGh(next); setTokenEdit(true); setTokenMsg('토큰을 지웠습니다.');
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch (e) { const el = document.getElementById('shareLink'); if (el) { el.select(); document.execCommand('copy'); setCopied(true); } }
  };
  const inp = 'w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm';
  const lab = 'block text-[11px] font-semibold text-slate-600 mb-1';
  return html`<div className="fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-4 overflow-auto" onClick=${e => { if (e.target === e.currentTarget && !busy) onClose(); }}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl mt-10 p-6" role="dialog" aria-label="일반 사용자용 파일 만들기">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-black">📤 일반 사용자용 파일 만들기</h2>
        <button onClick=${onClose} disabled=${busy} className="text-slate-400 hover:text-slate-700 text-xl">×</button>
      </div>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <div className="text-sm font-bold mb-1">① 열람 비밀번호</div>
        <p className="text-[11px] text-slate-500 mb-2">파일 속 학생 명단을 이 비밀번호로 암호화합니다. 링크를 연 사람은 비밀번호를 넣어야 내용을 볼 수 있습니다. 비밀번호는 어디에도 저장되지 않으니 잊지 않게 기록해 두세요.</p>
        <div className="grid grid-cols-2 gap-2">
          <div><label className=${lab}>비밀번호 (6자 이상)</label><input id="sharePw" type="password" autoComplete="new-password" value=${pw} onInput=${e => setPw(e.target.value)} className=${inp} /></div>
          <div><label className=${lab}>비밀번호 확인</label><input id="sharePw2" type="password" autoComplete="new-password" value=${pw2} onInput=${e => setPw2(e.target.value)} className=${inp} /></div>
        </div>
        ${pwErr && html`<p className="text-[11px] text-rose-600 mt-1">${pwErr}</p>`}
      </div>

      <div className="rounded-xl border border-slate-200 p-4 mb-3">
        <button className="w-full flex items-center justify-between text-sm font-bold" onClick=${() => setShowGh(v => !v)}>
          <span>② GitHub 저장 위치 ${gh.owner && gh.repo ? html`<span className="font-normal text-slate-500 text-xs">(${gh.owner}/${gh.repo} · ${gh.path})</span>` : ''}</span><span className="text-slate-400">${showGh ? '▲' : '▼'}</span></button>
        ${showGh && html`<div className="mt-3 grid grid-cols-2 gap-2">
          <div><label className=${lab}>GitHub 사용자명(또는 조직)</label><input id="ghOwner" value=${gh.owner} onInput=${e => set({ owner: e.target.value })} placeholder=${DEFAULT_GH.owner} className=${inp} /></div>
          <div><label className=${lab}>저장소 이름</label><input id="ghRepo" value=${gh.repo} onInput=${e => set({ repo: e.target.value })} placeholder=${DEFAULT_GH.repo} className=${inp} /></div>
          <div><label className=${lab}>브랜치</label><input value=${gh.branch} onInput=${e => set({ branch: e.target.value })} className=${inp} /></div>
          <div><label className=${lab}>저장 경로</label><input value=${gh.path} onInput=${e => set({ path: e.target.value })} className=${inp} /></div>
          <div className="col-span-2"><label className=${lab}>접근 토큰 (Fine-grained token · 이 저장소 Contents Read and write)</label>
            ${gh.token && !tokenEdit ? html`<div className="flex items-center gap-2" id="tokenSaved">
                <span className="flex-1 text-xs bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-md px-2 py-1.5">✅ 저장된 토큰 사용 중 <code className="ml-1">${maskToken(gh.token)}</code></span>
                <button id="tokenChange" onClick=${() => { setTokenEdit(true); setTokenMsg(''); }} className="text-xs px-2.5 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">토큰 변경</button>
                <button onClick=${clearToken} className="text-xs px-2.5 py-1.5 rounded-md border border-rose-200 text-rose-600 hover:bg-rose-50">지우기</button></div>`
            : html`<div className="flex gap-2"><input id="ghToken" type="password" autoComplete="off" value=${newToken} onInput=${e => { setNewToken(e.target.value); setTokenMsg(''); }} placeholder="github_pat_..." className=${inp} />
                <button id="tokenSave" onClick=${storeToken} className="shrink-0 text-xs px-3 rounded-md bg-slate-900 text-white font-semibold">토큰 저장</button>
                ${gh.token && html`<button onClick=${() => { setTokenEdit(false); setNewToken(''); }} className="shrink-0 text-xs px-2.5 rounded-md border border-slate-300">취소</button>`}</div>`}
            ${tokenMsg && html`<p id="tokenMsg" className=${`text-[11px] mt-1 ${tokenMsg.startsWith('✅') ? 'text-emerald-700' : 'text-rose-600'}`}>${tokenMsg}</p>`}
            <p className="text-[11px] text-slate-500 mt-1">토큰은 이 PC 브라우저에만 저장되며 프로그램 코드·일반 사용자용 파일에는 들어가지 않습니다. 만료되면 [토큰 변경]으로 새 토큰을 넣으세요.</p></div>
          <div className="col-span-2"><label className=${lab}>GitHub Pages 주소 (비우면 자동: https://사용자명.github.io/저장소/)</label><input value=${gh.pages} onInput=${e => set({ pages: e.target.value })} placeholder=${pagesLink({ ...gh, pages: '' }) || 'https://...'} className=${inp} /></div>
        </div>`}
      </div>

      ${err && html`<p id="shareErr" className="text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-3" style=${{ whiteSpace: 'pre-line' }}>${err}</p>`}
      ${link && html`<div className="rounded-xl border-2 border-emerald-400 bg-emerald-50 p-4 mb-3">
        <div className="text-sm font-bold text-emerald-800 mb-2">✅ 올리기 완료 — 이 링크와 비밀번호를 전달하세요</div>
        <div className="flex gap-2"><input id="shareLink" readOnly value=${link} onFocus=${e => e.target.select()} className="flex-1 border border-emerald-300 rounded-md px-2 py-1.5 text-sm bg-white" />
          <button onClick=${copy} className="px-3 rounded-md bg-emerald-600 text-white text-sm font-semibold">${copied ? '복사됨' : '복사'}</button>
          <a href=${link} target="_blank" rel="noopener" className="px-3 rounded-md border border-emerald-400 text-emerald-700 text-sm font-semibold flex items-center">열기</a></div>
        <p className="text-[11px] text-emerald-800 mt-2">링크 주소는 매번 같고 내용만 최신으로 바뀝니다. GitHub 반영에 1~2분 걸릴 수 있으니 바로 열리지 않으면 잠시 후 다시 열어 보세요.</p>
      </div>`}

      <div className="flex flex-wrap gap-2 justify-end">
        <button id="shareDownload" onClick=${download} disabled=${busy} className="px-4 py-2.5 rounded-lg border border-slate-300 text-sm font-semibold hover:bg-slate-50 disabled:opacity-50">⬇ 파일로 내려받기${pw ? ' (암호)' : ''}</button>
        <button id="shareUpload" onClick=${upload} disabled=${busy} className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-bold disabled:opacity-50">${busy ? '처리 중…' : '☁ GitHub에 올리고 링크 받기'}</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------- 일반 사용자: 비밀번호 확인 화면 ---------------------- */
/* ---------------------- 관리자: 처음 접속 시 비밀번호 확인 ----------------------
 * 비밀번호 원문은 코드에 넣지 않고 SHA-256 해시만 둔다. 확인되면 이 탭을 닫을 때까지 유지. */
const ADMIN_HASH = '26055b4bf21a9dce7805852bd69e554097965979a63c6beb24aa944a3df7d8bb'; // sha256('exam-admin:' + 비밀번호)
const ADMIN_SESSION_KEY = 'exam_admin_ok_v1';
function sha256Hex(str) { // 순수 JS SHA-256 (https가 아닌 환경에서도 동작)
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str), len = bytes.length;
  const n = (((len + 9) >> 6) + 1) << 4, w = new Uint32Array(n);
  for (let i = 0; i < len; i++) w[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
  w[len >> 2] |= 0x80 << (24 - (len % 4) * 8); w[n - 1] = len * 8;
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r = (x, k) => (x >>> k) | (x << (32 - k)), W = new Uint32Array(64);
  for (let i = 0; i < n; i += 16) {
    for (let t = 0; t < 64; t++) W[t] = t < 16 ? w[i + t] : (r(W[t-2],17) ^ r(W[t-2],19) ^ (W[t-2] >>> 10)) + W[t-7] + (r(W[t-15],7) ^ r(W[t-15],18) ^ (W[t-15] >>> 3)) + W[t-16];
    let [a, b, c, d, e, f, g, hh] = h;
    for (let t = 0; t < 64; t++) {
      const t1 = (hh + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = h.map((v, k) => (v + [a, b, c, d, e, f, g, hh][k]) >>> 0);
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}
const sessionOk = () => { try { return sessionStorage.getItem(ADMIN_SESSION_KEY) === ADMIN_HASH; } catch (e) { return false; } };
function AdminGate() {
  const [ok, setOk] = useState(sessionOk);
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  if (ok) return html`<${App} />`;
  const submit = e => {
    e.preventDefault();
    if (sha256Hex('exam-admin:' + pw) === ADMIN_HASH) { try { sessionStorage.setItem(ADMIN_SESSION_KEY, ADMIN_HASH); } catch (x) { /* 무시 */ } setOk(true); }
    else { setErr('비밀번호가 맞지 않습니다.'); setPw(''); }
  };
  return html`<div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
    <form onSubmit=${submit} className="bg-white rounded-2xl shadow-2xl p-7 w-full max-w-sm">
      <div className="text-3xl mb-2">🛡️</div>
      <h1 className="text-lg font-black leading-snug mb-1" style=${{ wordBreak: 'keep-all' }}>고등학교 정기시험 선택과목 분반 및 시험 시간표 자동 편성 시스템</h1>
      <p className="text-xs text-slate-500 mb-4">관리자 비밀번호를 입력하세요.</p>
      <input id="adminPw" type="password" inputMode="numeric" autoFocus value=${pw} onInput=${e => { setPw(e.target.value); setErr(''); }} placeholder="관리자 비밀번호" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base mb-2" />
      ${err && html`<p id="adminErr" className="text-sm text-rose-600 mb-2">${err}</p>`}
      <button id="adminOpen" type="submit" disabled=${!pw} className="w-full bg-slate-900 hover:bg-slate-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg">관리자 화면 열기</button>
      <p className="text-[11px] text-slate-400 mt-3">한 번 입력하면 이 브라우저 탭을 닫을 때까지 유지됩니다.</p>
    </form>
  </div>`;
}
const lockAdmin = () => { try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch (e) { /* 무시 */ } location.reload(); };

const VIEWER_PW_KEY = 'exam_viewer_pw_v1';
function Gate() {
  const enc = window.__VIEWER_ENC__;
  const [open, setOpen] = useState(!enc);
  const [pw, setPw] = useState('');
  const [remember, setRemember] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(!!enc && !!safeStorage.get(VIEWER_PW_KEY));
  const tryOpen = async (p, silent) => {
    if (!cryptoReady()) { setErr('이 브라우저에서는 암호를 풀 수 없습니다. 크롬·엣지 최신 버전으로 열어 주세요.'); setBusy(false); return; }
    setBusy(true); setErr('');
    try {
      VIEWER = await decryptJSON(enc, p);
      if (remember || silent) safeStorage.set(VIEWER_PW_KEY, p);
      setOpen(true);
    } catch (e) {
      if (silent) safeStorage.remove(VIEWER_PW_KEY); else setErr('비밀번호가 맞지 않습니다.');
      setBusy(false);
    }
  };
  useEffect(() => { const saved = safeStorage.get(VIEWER_PW_KEY); if (enc && saved) tryOpen(saved, true); }, []);
  if (open) return VIEWER ? html`<${App} />` : html`<${AdminGate} />`;
  return html`<div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
    <form onSubmit=${e => { e.preventDefault(); if (pw) tryOpen(pw, false); }} className="bg-white rounded-2xl shadow-2xl p-7 w-full max-w-sm">
      <div className="text-3xl mb-2">🔒</div>
      <h1 className="text-lg font-black leading-snug mb-1" style=${{ wordBreak: 'keep-all' }}>정기시험 선택과목 응시현황 · 출력물</h1>
      <p className="text-xs text-slate-500 mb-4">학생 정보 보호를 위해 비밀번호가 필요합니다.${enc.createdAt ? ` (자료 기준: ${enc.createdAt})` : ''}</p>
      <input id="gatePw" type="password" autoFocus value=${pw} onInput=${e => setPw(e.target.value)} placeholder="비밀번호" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base mb-2" />
      <label className="flex items-center gap-1.5 text-xs text-slate-600 mb-3"><input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} /> 이 기기에서 비밀번호 기억</label>
      ${err && html`<p id="gateErr" className="text-sm text-rose-600 mb-2">${err}</p>`}
      <button id="gateOpen" type="submit" disabled=${busy || !pw} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg">${busy ? '여는 중…' : '열기'}</button>
    </form>
  </div>`;
}

document.head.insertAdjacentHTML('beforeend', `<style id="printcss">${PRINT_CSS}</style>`);
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Gate} />`);
</script>
