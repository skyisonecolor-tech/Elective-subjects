/* ---------------------------- 공통 유틸 ---------------------------- */
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '')
  .replace(/Ⅰ/g, 'i').replace(/Ⅱ/g, 'ii').replace(/Ⅲ/g, 'iii').replace(/Ⅳ/g, 'iv');
const isSelf = s => { const n = norm(s); return n === norm(SELF) || n === '자습'; };
const pad2 = v => { const m = String(v ?? '').match(/\d+/); return m ? String(parseInt(m[0], 10)).padStart(2, '0') : ''; };
const lastInt = v => { const m = String(v ?? '').split('.')[0].match(/\d+/g); return m ? parseInt(m[m.length - 1], 10) : null; };
const truthy = v => { const t = String(v ?? '').trim(); return !['', '.', '0', 'nan', 'NaN', '-', 'x', 'X', '×', 'false', 'FALSE', 'N'].includes(t); };
const parseKeywords = s => String(s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const clsKey = (g, c) => `${g}-${c}`;
const byNum = (a, b) => a.n - b.n;
const deepClone = o => JSON.parse(JSON.stringify(o));
const safeStorage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } },
};

/* ------------------------- 명단(학생) 파싱 ------------------------- */
const META_EXACT = new Set(['순번','번호','출석번호','no','신학번','학번','이름','성명','학생명','성별','반','학급','학년','배정','학기','학교지정','기초','일시','분반','구분','비고','총점','상태','합계','특이사항','학적','학적상태','생년월일','연락처','담임']);
const META_PAT = [/^\d+$/, /학기/, /택\s*\d/, /학교지정/, /배정/, /^$/, /[월화수목금]\)/, /unnamed/i, /__empty/i, /비고/, /학적/];
const isMetaCol = h => { const t = String(h ?? '').trim(); return META_EXACT.has(t.toLowerCase()) || META_PAT.some(r => r.test(t)); };
const gradeHint = s => { const m = String(s || '').match(/([1-3])\s*학년/); return m ? +m[1] : null; };
function parseIdNum(id) {
  const d = String(id || '').replace(/\D/g, '');
  if (/^[1-3]\d{4}$/.test(d)) return { g: +d[0], c: +d.slice(1, 3), n: +d.slice(3) };
  if (/^[1-3]\d{3}$/.test(d)) return { g: +d[0], c: +d[1], n: +d.slice(2) };
  return null;
}
function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = (rows[i] || []).map(c => String(c).trim());
    if (r.some(c => /^(이름|성명|학생명)$/.test(c)) && r.some(c => /^(반|학급|번호|출석번호|순번|학번|신학번)$/.test(c))) return i;
  }
  return -1;
}
const idxOf = (headers, cands) => { for (const c of cands) { const i = headers.indexOf(c); if (i >= 0) return i; } return -1; };

function parseRosterSheet(rows, sheetName, fileName, keywords) {
  const h = findHeaderRow(rows);
  if (h < 0) return null;
  const headers = rows[h].map(c => String(c ?? '').replace(/\s*\n\s*/g, ' ').trim());
  const ci = {
    grade: idxOf(headers, ['학년']), cls: idxOf(headers, ['반', '학급']),
    num: idxOf(headers, ['번호', '출석번호', '순번', 'No', 'no', 'NO']),
    name: idxOf(headers, ['이름', '성명', '학생명']), id: idxOf(headers, ['학번', '신학번']), gender: idxOf(headers, ['성별']),
  };
  const used = new Set(Object.values(ci).filter(i => i >= 0));
  const exclCols = [], subjCols = [];
  headers.forEach((hd, i) => {
    if (used.has(i) || !hd) return;
    if (keywords.some(k => hd.includes(k))) { exclCols.push(i); return; }
    if (isMetaCol(hd)) return;
    subjCols.push(i);
  });
  const subjSet = new Set(subjCols);
  const hint = gradeHint(sheetName) || gradeHint(fileName);
  const tmp = []; let skipped = 0;
  for (let r = h + 1; r < rows.length; r++) {
    const row = rows[r]; if (!row) continue;
    const cell = i => (i >= 0 ? String(row[i] ?? '').trim() : '');
    const name = cell(ci.name);
    if (!name || name === '.' || /^\d+$/.test(name) || /합계|소계|평균|총점/.test(name)) continue;
    let g = ci.grade >= 0 ? lastInt(cell(ci.grade)) : null;
    let c = ci.cls >= 0 ? lastInt(cell(ci.cls)) : null;
    let n = ci.num >= 0 ? lastInt(cell(ci.num)) : null;
    const idp = parseIdNum(cell(ci.id));
    if (idp) { if (!g) g = idp.g; if (!c) c = idp.c; if (!n) n = idp.n; }
    if (!c || c < 1 || c > 20 || !n || n < 1) { skipped++; continue; }
    if (!(g >= 1 && g <= 3)) g = null;
    // 전출·위탁 등 제외 판단: 과목 열을 뺀 모든 칸(이름·비고 등)에 키워드가 있으면 제외
    let reason = '';
    for (let i = 0; i < row.length && !reason; i++) {
      if (subjSet.has(i)) continue;
      const v = String(row[i] ?? '');
      const k = keywords.find(k => v.includes(k));
      if (k) reason = k;
    }
    if (!reason) for (const i of exclCols) if (truthy(row[i])) { reason = headers[i]; break; }
    const taken = subjCols.filter(i => truthy(row[i])).map(i => headers[i]);
    tmp.push({ g, c, n, id: cell(ci.id), name, gender: cell(ci.gender), taken, excluded: !!reason, reason });
  }
  const cnt = {}; tmp.forEach(s => { if (s.g) cnt[s.g] = (cnt[s.g] || 0) + 1; });
  const maj = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const fallback = hint || (maj ? +maj : null);
  const students = []; let unknownGrade = 0;
  tmp.forEach(s => { if (!s.g) s.g = fallback; if (!s.g) { unknownGrade++; return; } students.push(s); });
  const grades = [...new Set(students.map(s => s.g))];
  return { students, grades, subjectHeaders: subjCols.map(i => headers[i]), skipped, unknownGrade, sheetName, fileName };
}

// 여러 파일·여러 시트를 한 번에 합쳐서 학생 목록으로 만든다
function buildRoster(sources, keywords) {
  const map = new Map(); let dup = 0, skipped = 0, unknownGrade = 0;
  const subjects = { 1: new Set(), 2: new Set(), 3: new Set() };
  const sheets = [];
  sources.forEach(src => src.sheets.forEach(sh => {
    const res = parseRosterSheet(sh.rows, sh.name, src.fileName, keywords);
    if (!res || res.students.length === 0) return;
    skipped += res.skipped; unknownGrade += res.unknownGrade;
    res.grades.forEach(g => res.subjectHeaders.forEach(hd => subjects[g].add(hd)));
    sheets.push({ file: src.fileName, sheet: sh.name, grades: res.grades.sort(), count: res.students.length });
    res.students.forEach(s => { const k = `${s.g}-${s.c}-${s.n}`; if (map.has(k)) dup++; map.set(k, s); });
  }));
  const students = [...map.values()].map(s => ({ ...s, takenNorm: new Set(s.taken.map(norm)) }))
    .sort((a, b) => a.g - b.g || a.c - b.c || a.n - b.n);
  return {
    students, dup, skipped, unknownGrade, sheets,
    subjectsByGrade: Object.fromEntries(GRADES.map(g => [g, [...subjects[g]]])),
  };
}

/* ------------------------ 시간표·과목코드 파싱 ------------------------ */
function parseTTSheet(rows) {
  let hr = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) if ((rows[i] || []).some(c => /\d+\s*일차/.test(String(c)))) { hr = i; break; }
  if (hr < 0) return null;
  const dayCols = new Map();
  rows[hr].forEach((c, i) => { const m = String(c).match(/(\d+)\s*일차/); if (m) dayCols.set(i, +m[1]); });
  const labels = {};
  if (hr > 0) dayCols.forEach((d, i) => {
    const v = String(rows[hr - 1][i] ?? '').trim();
    if (v && !v.includes('날짜') && !v.includes('→')) labels[d] = v;
  });
  const cells = {}; let maxP = 0;
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const first = String(row[0] ?? '').trim();
    if (first.startsWith('※')) break;
    const m = first.match(/(\d+)\s*교시/) || first.match(/^(\d+)$/);
    if (!m) continue;
    const p = +m[1];
    dayCols.forEach((d, i) => {
      const v = String(row[i] ?? '').trim();
      if (!v || v === '-' || v.startsWith('※')) return;
      const subs = v.split(/[\/,\n]/).map(x => x.trim()).filter(Boolean);
      if (subs.length) { cells[`${d}-${p}`] = subs; maxP = Math.max(maxP, p); }
    });
  }
  return { days: Math.max(1, ...dayCols.values()), periods: Math.max(3, maxP), labels, cells };
}
function parseCodeSheet(rows) {
  const list = [];
  rows.forEach(row => {
    const code = String(row?.[0] ?? '').trim(), name = String(row?.[1] ?? '').trim();
    if (/^\d+$/.test(code) && name && !name.startsWith('※')) list.push({ code: pad2(code), name });
  });
  return list.sort((a, b) => +a.code - +b.code);
}
// 시간표에 적힌 과목명을 과목코드표/명단의 정식 이름으로 맞춘다 (띄어쓰기·로마숫자 차이 무시)
function canonicalName(sub, codeList, rosterSubs) {
  if (isSelf(sub)) return SELF;
  const n = norm(sub);
  const c = (codeList || []).find(x => norm(x.name) === n); if (c) return c.name;
  const r = (rosterSubs || []).find(x => norm(x) === n); if (r) return r;
  return sub;
}

/* ---------------------------- 이동반 계산 ---------------------------- */
// 제외(전출·위탁 등) 학생을 빼고 '실제 인원' 기준으로 count명을 이동반으로 보낸다
function splitClass(list, dir, count) {
  const all = [...list].sort(byNum);
  const act = all.filter(s => !s.excluded);
  let moved, fixed;
  if (dir === 'front') { moved = act.slice(0, count); fixed = act.slice(count); }
  else { const k = Math.max(0, act.length - count); fixed = act.slice(0, k); moved = act.slice(k); }
  return { moved, fixed, movedLabel: rangeLabel(moved), fixedLabel: rangeLabel(fixed) };
}
function rangeLabel(arr) {
  if (!arr.length) return '없음';
  const ns = arr.map(s => s.n), lo = Math.min(...ns), hi = Math.max(...ns), set = new Set(ns);
  const gaps = []; for (let i = lo; i <= hi; i++) if (!set.has(i)) gaps.push(i);
  return (lo === hi ? `${lo}번` : `${lo}~${hi}번`) + (gaps.length ? ` (${gaps.join(',')}번 제외)` : '');
}

function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function sampleSources() {
  const rnd = seeded(20261029);
  const names = ['김민수','이서준','박도윤','정하은','이지우','한민서','조서아','강도현','윤지호','장서윤','임주원','오하은','신예준','권나은','황지우','송시우','홍서연','배유준','백소율','전우진','손예린','서지호','남유진','문서준','안채원','유하린'];

      const note = c === 2 && n === 5 ? '위탁' : '';
      rows.push([2, c, n, `2${String(c).padStart(2, '0')}${String(n).padStart(2, '0')}`, names[(n + c * 3) % names.length], n % 2 ? '남' : '여', note, ...subs.map(s => chosen.has(s) ? '1' : '')]);
    }

  }
  // 3학년
  {
    const subs = ['화법과 작문','언어와 매체','미적분','확률과 통계','심화 영어Ⅰ','진로 영어','물리학Ⅱ','세계사','생활과 윤리','세계지리','화학Ⅱ','정치와 법','생명과학Ⅱ','일본어 회화Ⅰ'];
    const rows = [['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]];
    for (let c = 1; c <= 3; c++) for (let n = 1; n <= 26; n++) {
      const chosen = new Set([...pick(subs.slice(0, 2), 1), ...pick(subs.slice(2, 4), 1), ...pick(subs.slice(4, 6), 1), ...pick(subs.slice(6), 3)]);
      const note = (c === 1 && n === 12) ? '전출' : (c === 2 && n === 20) ? '자퇴' : '';
      rows.push([3, c, n, `3${String(c).padStart(2, '0')}${String(n).padStart(2, '0')}`, names[(n + c * 5) % names.length], n % 2 ? '남' : '여', note, ...subs.map(s => chosen.has(s) ? '1' : '')]);

const XL = {
  border: { top: { style: 'thin', color: { argb: 'FF000000' } }, left: { style: 'thin', color: { argb: 'FF000000' } }, bottom: { style: 'thin', color: { argb: 'FF000000' } }, right: { style: 'thin', color: { argb: 'FF000000' } } },

async function downloadWorkbook(wb, filename) {
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slotLabel = (labels, e) => `${labels[e.day] || `${e.day}일차`} ${e.period}교시`;

/* ------------------ 응시 상태 문구 (엑셀·미리보기·인쇄 공용) ------------------ */
// kind: self(자기주도학습) / none(미응시) / all(전원 응시) / some(번호 나열)
function statusOf(g, e, df, takers) {
  if (e.self) return { kind: 'self', text: SELF, count: 0 };
  const t = takers(g, df, e.sub);
  if (!t.length) return { kind: 'none', text: '미응시', count: 0 };
  if (t.length === df.length) return { kind: 'all', text: `전원 응시(${t.length}명)`, count: t.length };
  return { kind: 'some', text: `응시인원( ${t.length}명 ) = ${t.join(', ')}`, count: t.length };
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------- 칠판 부착용 B4 레이아웃 -------------------------
 * B4(JIS) 가로 364×257mm, 여백 좌우 3.8mm·상하 5.1mm
 * → 인쇄 가능 영역 약 1010pt × 700pt. 하루 = 1장.
 * 표 높이를 이 영역에 맞춰 행 높이를 정하고, 각 칸 글자가 들어가는 가장 큰 글씨 크기를 계산한다. */
const CB = { pageWmm: 364, pageHmm: 257, padXmm: 3.8, padYmm: 5.1, w: [141, 303, 566], gapTop: 4, titleH: 62, gapMid: 8, headH: 50, titleF: 44, headF: 28, maxRow: 190, maxF: 44, minF: 12, lineH: 1.45 };
CB.usable = (CB.pageHmm - 2 * CB.padYmm) / 25.4 * 72 * 0.96; // 4% 안전 여유
CB.avail = CB.usable - CB.gapTop - CB.titleH - CB.gapMid - CB.headH;

function charEm(ch) {
  const c = ch.codePointAt(0);
  if ((c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F) || (c >= 0x2160 && c <= 0x217F)) return 1.0;
  if (/[0-9]/.test(ch)) return 0.6;
  if (ch === ' ') return 0.3;
  if (/[,.]/.test(ch)) return 0.32;
  if (/[()]/.test(ch)) return 0.4;
  if (/[A-Z]/.test(ch)) return 0.72;
  return 0.6;
}
const textWidth = (s, f) => { let w = 0; for (const ch of s) w += charEm(ch); return w * f; };
function wrapCount(text, maxW, f) {
  let lines = 0; const sp = textWidth(' ', f);
  String(text).split('\n').forEach(para => {
    lines++; let cur = 0;
    para.split(' ').forEach(word => {
      const ww = textWidth(word, f);
      if (cur > 0 && cur + sp + ww <= maxW) { cur += sp + ww; return; }
      if (cur > 0) lines++;
      cur = ww;
      while (cur > maxW) { lines++; cur -= maxW; }
    });
  });
  return lines;
}
function fitFont(text, wPt, hPt, maxF, minF = CB.minF) {
  for (let f = maxF; f > minF; f--) if (wrapCount(text, wPt - 22, f) * f * CB.lineH <= hPt - 6) return f;
  return minF;
}

const subjectText = (e, one, br) => `${e.sub}${one ? ' ' : br}(${e.code || '코드없음'})`;
// 한 학급·한 구분(고정/이동)의 일차별 페이지 데이터
function chalkPagesFor(g, c, kind, ctx) {
  const { exams, tt, classStudents, move, takers } = ctx;
  const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
  const df = kind === '고정' ? sp.fixed : sp.moved;
  const range = kind === '고정' ? sp.fixedLabel : sp.movedLabel;
  const byDay = {};
  exams[g].forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e); });
  const days = Object.keys(byDay).map(Number).filter(d => byDay[d].some(e => !e.self)).sort((a, b) => a - b);
  const pages = days.map(d => {
    const rows = [...byDay[d]].sort((a, b) => a.period - b.period || (a.code || '99').localeCompare(b.code || '99'))
      .map(e => ({ e, st: statusOf(g, e, df, takers) }));
    rows.forEach((r, i) => {
      r.first = i === 0 || rows[i - 1].e.period !== r.e.period;
      if (r.first) { let k = i; while (k < rows.length && rows[k].e.period === r.e.period) k++; r.span = k - i; }
    });
    const rowH = Math.min(CB.maxRow, CB.avail / rows.length);
    const minOf = arr => (arr.length ? Math.min(...arr) : CB.maxF);
    const f3 = minOf(rows.filter(r => !r.e.self).map(r => fitFont(r.st.text, CB.w[2], rowH, CB.maxF)));
    // 과목명 칸: '과목명↵(코드)' 두 줄과 '과목명 (코드)' 한 줄 중 글씨가 더 커지는 쪽을 고른다
    const subFit = one => minOf(rows.map(r => r.e.self ? fitFont(SELF, CB.w[1] + CB.w[2], rowH, CB.maxF) : fitFont(subjectText(r.e, one, '\n'), CB.w[1], rowH, CB.maxF)));
    const f2two = subFit(false), f2one = subFit(true);
    const subOne = f2one > f2two, f2 = Math.max(f2one, f2two);
    const f1 = minOf(rows.filter(r => r.first).map(r => fitFont(`${r.e.period}교시`, CB.w[0], rowH * r.span, 44)));
    return { g, c, kind, day: d, label: tt[g].labels[d] || `${d}일차 시험 시간표`, head: `${g}학년 ${c}반 (${kind})`, rows, rowH, f1, f2, f3, subOne };
  });
  return { df, range, pages };
}
function chalkPageHTML(pg) {
  const body = pg.rows.map(r => {
    const p = r.first ? `<td class="blue c" rowspan="${r.span}" style="font-size:${pg.f1}pt">${r.e.period}교시</td>` : '';
    if (r.e.self) return `<tr style="height:${pg.rowH}pt">${p}<td colspan="2" class="gray c" style="font-size:${pg.f2}pt">${SELF}</td></tr>`;
    const cls = r.st.kind === 'none' ? 'red c' : r.st.kind === 'all' ? 'c' : 'l';
    return `<tr style="height:${pg.rowH}pt">${p}<td class="blue c" style="font-size:${pg.f2}pt">${esc(subjectText(r.e, pg.subOne, '\n')).replace('\n', '<br>')}</td><td class="${cls}" style="font-size:${pg.f3}pt">${esc(r.st.text)}</td></tr>`;
  }).join('');
  return `<div class="b4"><div style="height:${CB.gapTop}pt"></div><div class="b4title" style="height:${CB.titleH}pt;font-size:${CB.titleF}pt">${esc(pg.label)}</div><div style="height:${CB.gapMid}pt"></div>`
    + `<table class="cb"><colgroup><col style="width:13.96%"><col style="width:30%"><col style="width:56.04%"></colgroup>`
    + `<thead><tr style="height:${CB.headH}pt"><th class="blue" style="font-size:${CB.headF}pt">교시</th><th class="blue" style="font-size:${CB.headF}pt">${esc(pg.head)}</th><th class="blue" style="font-size:${CB.headF}pt">응시학생 번호</th></tr></thead>`
    + `<tbody>${body}</tbody></table></div>`;
}
// 출력 대상 → 페이지 목록 (classes: [[g,c],...], kinds: ['고정','이동'])
function chalkAllPages(ctx, targets, kinds = ['고정', '이동']) {
  const out = [];
  targets.forEach(([g, c]) => kinds.forEach(kind => { const r = chalkPagesFor(g, c, kind, ctx); if (r.df.length) out.push(...r.pages); }));
  return out;
}

/* [파일 2] 칠판 부착용 B4 가로 — 하루 1장 */
function buildChalkboardWorkbook(ctx, targets) {
  const wb = new ExcelJS.Workbook(); wb.creator = '정기고사 부착물 시스템'; wb.created = new Date();
  const blue = XL.fill('FFBDD7EE'), gray = XL.fill('FFF1F5F9');
  const chars = pt => Math.round(((pt * 4 / 3) - 5) / 7 * 100) / 100; // pt → 엑셀 열 너비
  targets.forEach(([g, c]) => ['고정', '이동'].forEach(kind => {
    const { df, pages } = chalkPagesFor(g, c, kind, ctx);
    if (!df.length || !pages.length) return;
    const ws = wb.addWorksheet(`${g}-${c}반_${kind}`.slice(0, 31), { pageSetup: { paperSize: 12, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, margins: { left: .15, right: .15, top: .2, bottom: .2, header: 0, footer: 0 } } });
    CB.w.forEach((w, i) => { ws.getColumn(i + 1).width = chars(w); });
    pages.forEach((pg, pi) => {
      ws.addRow([]).height = CB.gapTop;
      const tr = ws.addRow([pg.label, '', '']); tr.height = CB.titleH;
      ws.mergeCells(tr.number, 1, tr.number, 3);
      const tc = ws.getCell(tr.number, 1); tc.font = XL.font(CB.titleF, true); tc.alignment = { vertical: 'middle', horizontal: 'center' };
      ws.addRow([]).height = CB.gapMid;
      const hr = ws.addRow(['교시', pg.head, '응시학생 번호']); hr.height = CB.headH;
      [1, 2, 3].forEach(i => { const x = hr.getCell(i); x.fill = blue; x.border = XL.border; x.font = XL.font(CB.headF, true); x.alignment = { vertical: 'middle', horizontal: 'center' }; });
      pg.rows.forEach(r => {
        const row = ws.addRow([r.first ? `${r.e.period}교시` : '', r.e.self ? SELF : subjectText(r.e, pg.subOne, '\r\n'), r.e.self ? '' : r.st.text]);
        row.height = pg.rowH; r.rowNum = row.number;
        const a = row.getCell(1); a.fill = blue; a.border = XL.border; a.font = XL.font(pg.f1, true); a.alignment = { vertical: 'middle', horizontal: 'center' };
        const b = row.getCell(2); b.border = XL.border; b.font = XL.font(pg.f2, true, r.e.self ? 'FF64748B' : 'FF000000'); b.fill = r.e.self ? gray : blue; b.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
        const x = row.getCell(3); x.border = XL.border;
        if (r.e.self) { x.fill = gray; ws.mergeCells(row.number, 2, row.number, 3); }
        else {
          x.font = XL.font(pg.f3, true, r.st.kind === 'none' ? 'FFE00000' : 'FF000000');
          x.alignment = r.st.kind === 'some' ? { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true } : { vertical: 'middle', horizontal: 'center', wrapText: true };
        }
      });
      pg.rows.forEach(r => { if (r.first && r.span > 1) ws.mergeCells(r.rowNum, 1, r.rowNum + r.span - 1, 1); });
      if (pi < pages.length - 1) ws.lastRow.addPageBreak();
    });
  }));
  return wb;
}

/* ----------------------- 과목별 응시현황 (공용 데이터) ----------------------- */
function overviewData(g, classes, ctx) {
  const { exams, classStudents, move, takers } = ctx;
  const list = exams[g];
  const sums = list.map(() => 0);
  const rows = [];
  classes.forEach(c => {
    const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
    [['이동반', sp.movedLabel, sp.moved], ['고정반', sp.fixedLabel, sp.fixed]].forEach(([lab, range, df]) => {
      const cells = list.map((e, i) => { const st = statusOf(g, e, df, takers); sums[i] += st.count; return st; });
      rows.push({ c, lab, range, cells });
    });
  });
  return { list, rows, sums };
}
function overviewHTML(g, classes, ctx) {
  const { tt } = ctx;
  const { list, rows, sums } = overviewData(g, classes, ctx);
  if (!list.length || !classes.length) return '';
  const fs = 10;
  const head1 = list.map(e => `<th class="peach">${esc(slotLabel(tt[g].labels, e))}</th>`).join('');
  const head2 = list.map(e => e.self ? `<th class="gray">${SELF}</th>` : `<th class="navy">${esc(e.sub)}<br><span style="font-weight:400">(${esc(e.code || '코드없음')})</span></th>`).join('');
  const body = rows.map(r => `<tr><td class="peach c b">${r.lab}<br><span style="font-weight:400;font-size:.9em">(${esc(r.range)})</span></td><td class="lblue c b">${r.c}반</td>${r.cells.map(st =>
    st.kind === 'self' ? `<td class="gray c">${SELF}</td>` : st.kind === 'none' ? `<td class="peach red c b">미응시</td>` : st.kind === 'all' ? `<td class="c b">${esc(st.text)}</td>` : `<td><b>응시인원( ${st.count}명 ) =</b> ${esc(st.text.split('= ')[1])}</td>`).join('')}</tr>`).join('');
  const sum = `<tr class="sum"><td colspan="2" class="lgray c b">응시 인원 합계</td>${list.map((e, i) => e.self ? '<td class="gray c">-</td>' : `<td class="c b">${sums[i]}명</td>`).join('')}</tr>`;
  return `<div class="ovw" style="font-size:${fs}pt"><div class="ovtitle">${esc(ctx.examTitle)} ${g}학년 과목별 응시현황 <span>(${classes.map(c => c + '반').join(', ')})</span></div>`
    + `<table class="ovt" style="width:${Math.max(348, list.length * 30 + 45)}mm"><colgroup><col style="width:30mm"><col style="width:13mm"></colgroup><thead><tr><th rowspan="2" class="lgray">일시/교시</th><th rowspan="2" class="lgray">반</th>${head1}</tr><tr>${head2}</tr></thead><tbody>${body}${sum}</tbody></table></div>`;
}
function confirmHTML(g, c, ctx) {
  const { exams, classStudents, takers } = ctx;
  const subs = exams[g].filter(e => !e.self);
  const list = classStudents(g, c).filter(s => !s.excluded).sort(byNum);
  const fs = list.length > 30 ? 9 : 10;
  return `<div class="cfw" style="font-size:${fs}pt"><div class="cfsub">${esc(ctx.examTitle)}</div><div class="cftitle">${g}학년 ${c}반 선택과목 응시 확인표</div>`
    + `<table class="cft"><colgroup><col style="width:8%"><col style="width:15%"><col><col style="width:14%"></colgroup><thead><tr><th>번호</th><th>이름</th><th>응시하는 선택과목</th><th>확인(서명)</th></tr></thead><tbody>`
    + list.map(s => { const mine = [...new Set(subs.filter(e => takers(g, [s], e.sub).length).map(e => e.sub))]; return `<tr><td class="c">${s.n}</td><td class="c">${esc(s.name)}</td><td>${esc(mine.length ? mine.join(', ') : '해당 없음(미응시)')}</td><td></td></tr>`; }).join('')
    + `</tbody></table></div>`;
}

/* [파일 1] 학년별 과목별 응시현황(+합계) + 반별 응시확인표 */
function buildOverviewWorkbook(ctx) {
  const { selected, exams, tt, classStudents, takers } = ctx;
  const wb = new ExcelJS.Workbook(); wb.creator = '정기고사 부착물 시스템'; wb.created = new Date();
  const lgray = XL.fill('FFF2F2F2'), peach = XL.fill('FFFCE4D6'), navy = XL.fill('FF41719C'), lblue = XL.fill('FFBDD7EE'), gray = XL.fill('FFF1F5F9'), white = XL.fill('FFFFFFFF');
  GRADES.forEach(g => {

    ws.getColumn(1).width = 22; ws.getColumn(2).width = 8;
    list.forEach((e, i) => { ws.getColumn(i + 3).width = e.self ? 16 : 32; });

    ws.mergeCells(1, 1, 1, list.length + 2); tr0.getCell(1).font = XL.font(16, true); tr0.getCell(1).alignment = { vertical: 'middle', horizontal: 'left' };
    const r1 = ws.addRow(['일시/교시', '반', ...list.map(e => slotLabel(tt[g].labels, e))]); r1.height = 34;
    const r2 = ws.addRow(['일시/교시', '반', ...list.map(e => e.self ? SELF : `${e.sub}\r\n(${e.code || '코드없음'})`)]); r2.height = 48;
    ws.mergeCells('A2:A3'); ws.mergeCells('B2:B3');
    [1, 2].forEach(c => [2, 3].forEach(r => { const x = ws.getCell(r, c); x.fill = lgray; x.border = XL.border; x.font = XL.font(11, true); x.alignment = { vertical: 'middle', horizontal: 'center' }; }));
    list.forEach((e, i) => {

      const b = r2.getCell(i + 3); b.fill = e.self ? gray : navy; b.border = XL.border; b.font = XL.font(10.5, true, e.self ? 'FF64748B' : 'FFFFFFFF'); b.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
    });
    rows.forEach(r => {

      const b = row.getCell(2); b.fill = lblue; b.border = XL.border; b.font = XL.font(11, true); b.alignment = { vertical: 'middle', horizontal: 'center' };
      r.cells.forEach((st, i) => {

        else if (st.kind === 'none') { x.fill = peach; x.font = XL.font(10, true, 'FFFF0000'); x.alignment = { vertical: 'middle', horizontal: 'center' }; }
        else if (st.kind === 'all') { x.fill = white; x.font = XL.font(10.5, true); x.alignment = { vertical: 'middle', horizontal: 'center' }; }

    for (let i = 1; i <= list.length + 2; i++) {

    }
  });
  // 반별 응시확인표 (A4 세로, 서명칸)
  GRADES.forEach(g => {
    const subs = exams[g].filter(e => !e.self);

      ws.getColumn(1).width = 6; ws.getColumn(2).width = 11; ws.getColumn(3).width = 88; ws.getColumn(4).width = 10;
      const t = ws.addRow([`${ctx.examTitle}\n${g}학년 ${c}반 선택과목 응시 확인표`, '', '', '']); t.height = 46;
      ws.mergeCells('A1:D1'); const tc = ws.getCell('A1'); tc.font = XL.font(16, true); tc.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      const hd = ws.addRow(['번호', '이름', '응시하는 선택과목', '확인(서명)']); hd.height = 24;

      list.forEach(s => {

/* ------------------------------- 시험명 -------------------------------- */
function defaultExam() {
  const d = new Date(), m = d.getMonth() + 1;
  return { year: m <= 2 ? d.getFullYear() - 1 : d.getFullYear(), sem: (m >= 8 || m <= 2) ? 2 : 1, round: 1 };
}
const examTitleOf = ex => `${ex.year}학년도 ${ex.sem}학기 ${ex.round}차 정기시험`;
// '9월 28일 월요일' → '9/28(월)'
function shortDate(label, d) {
  const m = String(label || '').match(/(\d+)\s*월\s*(\d+)\s*일\s*\(?\s*([월화수목금토일])/);
  return m ? `${m[1]}/${m[2]}(${m[3]})` : (label || `${d}일차`);
}

/* ---------------------- 반별 결시 학생 현황 (A4 세로 1장) ----------------------

 * 표: 일시·교시·과목명·응시인원(그 아래 결시자 기록 공간)·감독교사 확인 */
const ABS_NOTE = '♣ 결시 학생을 정확하게 파악하셔서 결시자 OMR카드에 기록 및 마킹해 주시고, 답안지 회수용 봉투에도 기록해 주시기 바랍니다.';
const ABS_HEAD = '결시자 번호 – 이름 - 사유(공결,병결,미인정결,기타결)\n*해당자가 없을 시는 "없음"으로 표기*';
function absenceData(g, c, kind, ctx) {
  const { exams, tt, classStudents, move, takers, examTitle } = ctx;
  const sp = splitClass(classStudents(g, c), move[g].dir, move[g].count);
  const df = kind === '이동' ? sp.moved : sp.fixed;
  const range = kind === '이동' ? sp.movedLabel : sp.fixedLabel;
  const ns = df.map(s => s.n), set = new Set(ns);
  const gaps = [];
  if (ns.length) for (let i = Math.min(...ns); i <= Math.max(...ns); i++) if (!set.has(i)) gaps.push(i);
  const list = [...exams[g]].sort((a, b) => a.day - b.day || a.period - b.period || (a.code || '99').localeCompare(b.code || '99'));
  const rows = list.map(e => ({ e, st: statusOf(g, e, df, takers), date: shortDate(tt[g].labels[e.day], e.day) }));
  rows.forEach((r, i) => {
    r.first = i === 0 || rows[i - 1].e.day !== r.e.day;
    if (r.first) { let k = i; while (k < rows.length && rows[k].e.day === r.e.day) k++; r.span = k - i; }

}
function absenceHTML(a) {

    + `<td class="c b">${r.e.period}</td><td class="c b${r.e.self ? ' muted' : ''}" style="font-size:${r.e.sub.length > 8 ? 10 : 12}pt">${esc(r.e.sub)}</td>`
    + `<td colspan="4" class="st" style="font-size:${fsStatus}pt">${r.e.self ? '' : esc(r.st.text)}</td><td></td></tr>`).join('');

    + `<tr class="hd"><td colspan="3" class="c b">${a.kind}반</td><td class="c b">재적번호</td><td class="c">${esc(a.rangeText)}</td></tr>`
    + `<tr class="hd"><td class="c b">일시</td><td class="c b" style="font-size:10pt;padding:0">교시</td><td class="c b">과목명</td><td colspan="4" class="c b" style="font-size:9pt;white-space:pre-line;line-height:1.35">${esc(ABS_HEAD)}</td><td class="c b" style="font-size:9pt">감독교사확인<br>(이름&amp;인장)</td></tr>`

function absenceAllPages(ctx, targets) {
  const out = [];
  targets.forEach(([g, c]) => ['이동', '고정'].forEach(kind => { const a = absenceData(g, c, kind, ctx); if (a.df.length) out.push(a); }));
  return out;
}
// 고사실(본반 교실) = 앞면 그 반 고정반 + 뒷면 고사실 구성에서 그 교실로 오는 이동반
function absenceRoomPairs(ctx, roomMap, hosts) {
  return hosts.map(([g, c]) => {
    const room = clsKey(g, c), gk = roomMap[room] || '';
    const front = absenceData(g, c, '고정', ctx);
    let back = null;
    if (gk) { const [gg, cc] = gk.split('-').map(Number); const b = absenceData(gg, cc, '이동', ctx); if (b.df.length) back = b; }
    return { room, front, back };
  }).filter(r => r.front.df.length || r.back);
}
// flip: 긴 쪽 넘김 프린터에서 상철이 되도록 뒷면을 180° 돌린다
function absenceRoomPrintPages(pairs, flip) {
  const blank = `<div style="width:190mm;height:30mm;color:#94a3b8;font:10pt 'Malgun Gothic',sans-serif;text-align:center;padding-top:20mm">(이 고사실로 오는 이동반 없음 — 빈 면)</div>`;
  return pairs.flatMap(r => {
    const back = r.back ? absenceHTML(r.back) : blank;
    return [absenceHTML(r.front), flip ? `<div style="width:190mm;height:268mm;transform:rotate(180deg);overflow:hidden">${back}</div>` : back];

}
// [파일 3] 반별 결시 학생 현황 — 첨부 양식과 같은 열 구성, A4 세로 1장에 맞춤

/* ============================ 고사실 통계 (관리자) ============================
 * 고사실 = 본반(고정반) 교실. 본반 학생 + 다른 학년 이동반 학생이 함께 시험을 본다.
 * 교시마다 그 교실에서 실제 시험을 보는 인원을 세고, 본반·이동반 과목의 통(공통)/선(선택) 조합별
 * 기준 인원 이상이면 색으로 표시한다 (통+통은 1명 배치라 제외). */
const GUEST_OF = { 1: 3, 2: 1, 3: 2 }; // 1학년 교실 ← 3학년 이동반, 2학년 ← 1학년, 3학년 ← 2학년
const DEFAULT_THR = { ts: 22, st: 25, ss: 19 };
const DEFAULT_TIMES = { 1: '09:25 ~ 10:15', 2: '10:35 ~ 11:25', 3: '11:45 ~ 12:35', 4: '' };
const COMBO = {
  ts: { label: '본(통)+이(선)', short: '통+선', color: '#A0B4E6', argb: 'FFA0B4E6' },
  st: { label: '본(선)+이(통)', short: '선+통', color: '#FFCEB0', argb: 'FFFFCEB0' },
  ss: { label: '본(선)+이(선)', short: '선+선', color: '#9BE5C8', argb: 'FF9BE5C8' },
};
const comboKey = (bt, gt) => (bt === '통' && gt === '선' ? 'ts' : bt === '선' && gt === '통' ? 'st' : bt === '선' && gt === '선' ? 'ss' : null);

// 기본 고사실 구성: 같은 반 번호의 지정 학년 이동반, 짝이 없는 이동반은 손님 없는 교실로
function defaultRoomMap(classesByGrade) {
  const map = {}, used = new Set();
  GRADES.forEach(g => classesByGrade[g].forEach(c => {
    const gg = GUEST_OF[g];
    if (classesByGrade[gg].includes(c)) { map[clsKey(g, c)] = clsKey(gg, c); used.add(clsKey(gg, c)); } else map[clsKey(g, c)] = '';
  }));
  const left = GRADES.flatMap(g => classesByGrade[g].map(c => clsKey(g, c))).filter(k => !used.has(k));
  GRADES.forEach(g => classesByGrade[g].forEach(c => {
    const h = clsKey(g, c);
    if (!map[h] && left.length) { const i = left.findIndex(k => +k.split('-')[1] === c); map[h] = left.splice(i >= 0 ? i : 0, 1)[0]; }
  }));
  return map;
}

function statsData(sx) {
  const { ctx, classesByGrade, typeOf, thr, times, editors, roomMap, examTitle } = sx;
  const { exams, tt, classStudents, move, takers } = ctx;
  // 시험이 있는 (일차, 교시) — 전 학년 합집합
  const slots = [];
  const maxD = Math.max(...GRADES.map(g => tt[g].days)), maxP = Math.max(...GRADES.map(g => tt[g].periods));
  for (let d = 1; d <= maxD; d++) for (let p = 1; p <= maxP; p++)
    if (GRADES.some(g => exams[g].some(e => e.day === d && e.period === p))) slots.push({ d, p });
  const dayLabel = d => { const g = GRADES.find(x => tt[x].labels[d]); return shortDate(g ? tt[g].labels[d] : '', d); };
  const at = (g, s) => exams[g].filter(e => e.day === s.d && e.period === s.p);
  const typeAt = (g, s) => { const l = at(g, s).filter(e => !e.self); return !l.length ? null : l.every(e => typeOf(g, e.sub) === '통') ? '통' : '선'; };
  const count = (g, df, s) => at(g, s).filter(e => !e.self).reduce((a, e) => a + takers(g, df, e.sub).length, 0);
  const parts = {}; // 'g-c' → {fixed, moved}
  GRADES.forEach(g => classesByGrade[g].forEach(c => { parts[clsKey(g, c)] = splitClass(classStudents(g, c), move[g].dir, move[g].count); }));
  const guestUse = {};
  const blocks = GRADES.filter(g => classesByGrade[g].length).map(g => {
    const rooms = classesByGrade[g].map(c => {
      const hk = clsKey(g, c), gk = roomMap[hk] || '';
      if (gk) guestUse[gk] = (guestUse[gk] || 0) + 1;
      const host = parts[hk].fixed, gg = gk ? +gk.split('-')[0] : null, guest = gk && parts[gk] ? parts[gk].moved : [];
      const cells = slots.map(s => {
        const n = count(g, host, s) + (gk ? count(gg, guest, s) : 0);
        const bt = typeAt(g, s), gt = gk ? typeAt(gg, s) : null;
        const ck = bt && gt ? comboKey(bt, gt) : null;
        const limit = ck ? thr[ck] : null;
        return { n, ck, over: limit != null && limit > 0 && n >= limit };
      });
      return { g, c, host: hk, hostN: host.length, guest: gk, guestN: guest.length, total: host.length + guest.length, cells };
    });
    // 블록 대표 조합 (가장 흔한 손님 학년 기준)
    const gc = {}; rooms.forEach(r => { if (r.guest) { const x = r.guest.split('-')[0]; gc[x] = (gc[x] || 0) + 1; } });
    const mg = +(Object.keys(gc).sort((a, b) => gc[b] - gc[a])[0] || GUEST_OF[g]);
    const types = slots.map(s => { const bt = typeAt(g, s), gt = typeAt(mg, s); return { bt, gt, label: bt && gt ? `${bt}+${gt}` : (bt || gt || '자습'), ck: bt && gt ? comboKey(bt, gt) : null }; });
    return { g, guestGrade: mg, rooms, types };
  });
  const all = blocks.flatMap(b => b.rooms);
  const totals = { hostN: all.reduce((a, r) => a + r.hostN, 0), guestN: all.reduce((a, r) => a + r.guestN, 0), total: all.reduce((a, r) => a + r.total, 0), cells: slots.map((s, i) => all.reduce((a, r) => a + r.cells[i].n, 0)) };
  const overs = { ts: 0, st: 0, ss: 0 }; all.forEach(r => r.cells.forEach(x => { if (x.over) overs[x.ck]++; }));
  const ttRows = slots.map(s => ({ ...s, date: dayLabel(s.d), time: times[s.p] || '', subs: GRADES.map(g => at(g, s).map(e => e.sub).join('/') || '') }));
  const edRows = slots.map(s => ({ ...s, date: dayLabel(s.d), time: times[s.p] || '', cells: GRADES.map(g => { const l = at(g, s); return { has: l.some(e => !e.self), self: l.length > 0 && l.every(e => e.self), name: editors[`${g}-${s.d}-${s.p}`] || '' }; }) }));
  const dupGuests = Object.keys(guestUse).filter(k => guestUse[k] > 1);
  const unplaced = Object.keys(parts).filter(k => parts[k].moved.length && !guestUse[k]);
  return { examTitle, slots, dayLabel, blocks, totals, overs, ttRows, edRows, thr, dupGuests, unplaced };
}

/* ---------- 화면·인쇄용 HTML (B4 가로 기준 폭 348mm) ---------- */

  const dl = i => (i > 0 && D.slots[i - 1].d !== D.slots[i].d ? ' dl' : '');
  const body = D.blocks.map(b => {
    const typeRow = `<tr class="ty"><td colspan="5" class="tyl">교시별 과목 유형 (본 ${b.g}학년 + 이 ${b.guestGrade}학년)</td>${b.types.map((t, i) => `<td class="${dl(i)}"${t.ck ? ` style="color:${t.ck === 'ts' ? '#1d4ed8' : t.ck === 'st' ? '#c2410c' : '#047857'};font-weight:700"` : ''}>${esc(t.label)}</td>`).join('')}</tr>`;
    const rows = b.rooms.map((r, ri) => `<tr>${ri === 0 ? `<td rowspan="${b.rooms.length + 1}" class="gl">${b.g}학년</td>` : ''}`
      + `<td class="num">${r.total}</td><td>${r.host}</td><td class="num">${r.hostN}</td><td>${r.guest || '-'}</td><td class="num">${r.guest ? r.guestN : ''}</td>`
      + r.cells.map((x, i) => `<td class="num${dl(i)}"${x.over ? ` style="background:${COMBO[x.ck].color};font-weight:800"` : ''}>${x.n || (x.n === 0 ? '<span class="z">0</span>' : '')}</td>`).join('') + '</tr>').join('');
    return (b.rooms.length ? rows.replace('</tr>', '</tr>' + '') : '') + typeRow.replace('<tr class="ty">', '<tr class="ty">');

/* ------------------------------ 암호화 (Web Crypto) ------------------------------ */
const b64 = buf => { const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const key = await deriveKey(pw, salt, iter);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, alg: 'AES-GCM/PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(ct), createdAt: obj.createdAt };
}
async function decryptJSON(enc, pw) {
  const key = await deriveKey(pw, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, key, unb64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  }
  // 3) 기존 파일이 있으면 sha를 받아 덮어쓴다
  const path = gh.path.trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  let sha;
  if (!empty) {
    const g = await get(`${base}/contents/${path}?ref=${encodeURIComponent(branch)}`);
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error(await githubError(g));
  }
  const body = { message, content: b64(new TextEncoder().encode(content)) };
  if (!empty) body.branch = branch;
  if (sha) body.sha = sha;
  const r = await fetch(`${base}/contents/${path}`, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await githubError(r));
  return { ...(await r.json()), usedBranch: empty ? info.default_branch || 'main' : branch, wasEmpty: empty };
}
function pagesLink(gh, version) {
  let base = (gh.pages || '').trim();
  if (!base && gh.owner && gh.repo) base = gh.repo.toLowerCase() === `${gh.owner.toLowerCase()}.github.io` ? `https://${gh.owner}.github.io/` : `https://${gh.owner}.github.io/${gh.repo}/`;
  if (!base) return '';
  const p = gh.path.replace(/^\/+/, '').replace(/(^|\/)index\.html$/, '$1');
  return base.replace(/\/?$/, '/') + p + (version ? `?v=${version}` : '');
}

const PAGE_CSS = {

// 한 장에 맞출 인쇄 가능 영역(mm). 내용이 넘치면 인쇄 직전에 실제 크기를 재서 자동 축소한다.
const PAGE_FIT = { b4: null, b4ov: { w: 348, h: 241 }, a4: { w: 190, h: 277 } };
function printPages(pages, pageKey) {
  if (!pages.length) { alert('인쇄할 내용이 없습니다.'); return; }
  const fit = PAGE_FIT[pageKey];
  if (fit) pages = pages.map(h => `<div class="fit" style="width:${fit.w}mm">${h}</div>`);
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed;left:-20000px;top:0;width:1600px;height:1200px;border:0';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.open();
  doc.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>정기시험 출력물</title><style>${PRINT_CSS}${PAGE_CSS[pageKey]}
html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}</style></head>
<body>${pages.map(h => `<div class="pg">${h}</div>`).join('')}</body></html>`);
  doc.close();
  window.__lastPrintDoc = doc; // 테스트용
  setTimeout(() => {
    if (fit) { // 글꼴·배치가 끝난 뒤 실제 크기를 재서 축소 (3% 여유)
      const px = 96 / 25.4;
      const W = fit.w * px, H = fit.h * px * 0.97;
      doc.querySelectorAll('.fit').forEach(el => {
        let z = 1;
        for (let i = 0; i < 8; i++) { // 축소하면 줄바꿈이 달라질 수 있어 실제 크기를 다시 재며 반복
          const r = el.getBoundingClientRect(), w = Math.max(r.width, el.scrollWidth * z);
          if (r.height <= H && w <= W + 1) break;
          z = Math.floor(z * Math.min(H / r.height, W / w) * 0.99 * 1000) / 1000;
          el.style.zoom = String(z);
        }
      });
    }
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch (e) { alert('인쇄 창을 열 수 없습니다: ' + e.message); }
    setTimeout(() => iframe.remove(), 60000);
  }, 400);
}

/* 표준 양식: 학년별 시간표 + 과목코드 (현재 입력값 포함) */
function buildTimetableTemplate(tt, codes) {
  const wb = new ExcelJS.Workbook();
  const note = "※ 1행: 날짜를 '6월 29일 월요일' 형식으로 입력하세요 (그대로 출력됩니다).\n※ 과목명은 명단 엑셀의 열 이름과 동일하게 입력 (띄어쓰기 달라도 자동 인식).\n※ 같은 교시에 과목이 2개면 슬래시(/)로 구분  예) 물리학Ⅱ/세계사\n※ 시험 없이 자습하는 교시는 '자기주도학습'으로 입력 (과목코드 없음).\n※ 해당 일차·교시에 과목이 없으면 빈칸으로 두세요.";
  GRADES.forEach(g => {
    const t = tt[g]; const ws = wb.addWorksheet(`${g}학년 시간표`);
    const days = Array.from({ length: t.days }, (_, i) => i + 1);
    ws.addRow(['날짜 입력 →', ...days.map(d => t.labels[d] || '')]);
    ws.addRow(['교시 | 일차', ...days.map(d => `${d}일차`)]);
    for (let p = 1; p <= Math.max(4, t.periods); p++) ws.addRow([`${p}교시`, ...days.map(d => (t.cells[`${d}-${p}`] || []).join('/'))]);
    ws.addRow([]);
    const nr = ws.addRow([note]); ws.mergeCells(nr.number, 1, nr.number, days.length + 1); nr.height = 90;
    nr.getCell(1).alignment = { wrapText: true, vertical: 'top' }; nr.getCell(1).font = { size: 9, color: { argb: 'FF475569' } };
    ws.getColumn(1).width = 14; days.forEach((_, i) => { ws.getColumn(i + 2).width = 22; });
    [1, 2].forEach(r => ws.getRow(r).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill(r === 1 ? 'FFFCE4D6' : 'FFE7E6E6'); x.border = XL.border; x.alignment = { horizontal: 'center' }; }));
    for (let r = 3; r < 3 + Math.max(4, t.periods); r++) for (let c = 1; c <= days.length + 1; c++) { const x = ws.getCell(r, c); x.border = XL.border; x.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; }
  });
  GRADES.forEach(g => {
    const ws = wb.addWorksheet(`${g}학년 과목코드`);
    ws.addRow(['코드', '과목명']);
    ws.addRow(['※ 코드(숫자)와 과목명을 입력하세요. 과목명은 명단 엑셀과 동일하게 (띄어쓰기 달라도 자동 인식)', '']);
    (codes[g] || []).forEach(x => ws.addRow([x.code, x.name]));
    ws.getColumn(1).width = 10; ws.getColumn(2).width = 30; ws.getColumn(1).numFmt = '@';
    ws.getRow(1).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill('FFE7E6E6'); });
  });
  return wb;
}
function buildRosterTemplate(codes) {
  const wb = new ExcelJS.Workbook();
  GRADES.forEach(g => {
    const subs = (codes[g] || []).map(x => x.name);
    const ws = wb.addWorksheet(`${g}학년`);
    ws.addRow(['학년', '반', '번호', '학번', '이름', '성별', '비고', ...subs]);
    ws.addRow([g, 1, 1, `${g}0101`, '홍길동 (예시)', '남', '', ...subs.map((_, i) => i < 3 ? '1' : '')]);
    ws.addRow([g, 1, 2, `${g}0102`, '김철수 (예시)', '남', '전출', ...subs.map(() => '')]);
    ws.addRow([g, 1, 3, `${g}0103`, '이영희 (예시)', '여', '', ...subs.map((_, i) => i >= 3 && i < 6 ? '1' : '')]);
    ws.getRow(1).eachCell(x => { x.font = { bold: true }; x.fill = XL.fill('FFE7E6E6'); x.alignment = { horizontal: 'center', wrapText: true }; });
    [8, 6, 6, 9, 16, 6, 10].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    subs.forEach((_, i) => { ws.getColumn(i + 8).width = 12; });
  });
  return wb;
}

      // 예전 양식(학년 구분 없는 '시간표'·'과목코드' 시트)은 현재 선택된 학년 탭에 적용
      if (legacy.codes) { nextCodes[ttGrade] = legacy.codes; done.push(`${ttGrade}학년 과목코드(구양식)`); }
      if (legacy.tt) { nextTT[ttGrade] = legacy.tt; done.push(`${ttGrade}학년 시간표(구양식)`); }
      if (!done.length) { say("시간표 파일에서 '1학년 시간표', '1학년 과목코드' 같은 시트를 찾지 못했습니다.", 'error'); return; }
      // 과목명 정식화
      GRADES.forEach(g => {
        const cells = {};
        Object.entries(nextTT[g].cells).forEach(([k, subs]) => { cells[k] = [...new Set(subs.map(s => canonicalName(s, nextCodes[g], roster.subjectsByGrade[g])))]; });
        nextTT[g].cells = cells;
      });
      setTT(nextTT); setCodes(nextCodes); setTab('timetable');
      say(`📅 시간표 파일 적용 완료: ${done.join(', ')}`);
    } catch (err) { say(`시간표 파일 읽기 오류: ${err.message}`, 'error'); }
  };

  // 명단 원본 + 시간표·과목코드·이동반·학급 선택·제외 키워드를 이 브라우저에 저장 (새로고침해도 유지)
  const buildConfig = savedAt => {
    const base = { v: 9, savedAt, keywords, move, sel, tt, codes, exam, types, thr, times, editors, roomOv };
    return sourceLabel.startsWith('샘플 데이터') ? base : { ...base, label: sourceLabel, sources: sourcesRef.current };
  };
  const saveConfig = () => {
    const savedAt = new Date().toLocaleString('ko-KR');
    const base = { v: 9, savedAt, keywords, move, sel, tt, codes, exam, types, thr, times, editors, roomOv };
    const isSample = sourceLabel.startsWith('샘플 데이터');
    let ok = safeStorage.set(CONFIG_KEY, JSON.stringify(isSample ? base : { ...base, label: sourceLabel, sources: sourcesRef.current }));
    if (!ok) { // 저장 공간이 부족하면 명단을 빼고 설정만 저장
      ok = safeStorage.set(CONFIG_KEY, JSON.stringify(base));
      if (ok) { setSavedAt(savedAt); say('⚠ 명단이 너무 커서 명단은 저장하지 못했습니다. 시간표·설정만 저장되었습니다.', 'error'); return; }
    }
    if (ok) setSavedAt(savedAt);
    say(ok ? `💾 저장 완료 (${savedAt}) — 명단${isSample ? '(샘플 제외)' : ''}·시간표·과목코드·이동반·학급 선택이 이 브라우저에 보관됩니다. 새로고침해도 유지됩니다.` : '이 브라우저에서는 저장할 수 없습니다. (개인정보 보호 모드 등)', ok ? 'success' : 'error');
  };
  // 저장 내용을 모두 지우고 처음 상태(샘플)로
  const resetConfig = () => {
    if (!confirm('저장된 명단·시간표·설정을 모두 지우고 처음 상태로 되돌릴까요?\n(되돌릴 수 없습니다)')) return;
    safeStorage.remove(CONFIG_KEY);
    setKeywords(DEFAULT_KEYWORDS); setExam(defaultExam());
    setTypes({ 1: {}, 2: {}, 3: {} }); setThrState({ ...DEFAULT_THR }); setTimesState({ ...DEFAULT_TIMES }); setEditors({}); setRoomOv({});
    setMove({ 1: { ...DEFAULT_MOVE }, 2: { ...DEFAULT_MOVE }, 3: { ...DEFAULT_MOVE } });
    setTT(sampleTT()); setCodes(defaultCodes()); setSavedAt('');
    applySources(sampleSources(), '샘플 데이터 (1~3학년, 9개 학급)', DEFAULT_KEYWORDS, {});
    say('🔄 설정을 초기화했습니다. 샘플 데이터 상태입니다.', 'info');
  };

  /* ---------- 파생 데이터 ---------- */
  const students = roster.students;
  const classesByGrade = useMemo(() => {
    const o = { 1: [], 2: [], 3: [] };
    students.forEach(s => { if (!o[s.g].includes(s.c)) o[s.g].push(s.c); });
    GRADES.forEach(g => o[g].sort((a, b) => a - b)); return o;
  }, [students]);
  const presentGrades = GRADES.filter(g => classesByGrade[g].length);
  const classStudents = (g, c) => students.filter(s => s.g === g && s.c === c);
  const selected = useMemo(() => Object.fromEntries(GRADES.map(g => [g, classesByGrade[g].filter(c => sel[clsKey(g, c)])])), [classesByGrade, sel]);
  const rosterNorm = useMemo(() => Object.fromEntries(GRADES.map(g => [g, new Set(roster.subjectsByGrade[g].map(norm))])), [roster]);
  const codeOf = (g, sub) => (codes[g] || []).find(x => norm(x.name) === norm(sub))?.code || '';
  const isCommon = (g, sub) => !isSelf(sub) && !rosterNorm[g].has(norm(sub));
  const exams = useMemo(() => {
    const o = {};
    GRADES.forEach(g => {
      const t = tt[g], list = [];
      Object.entries(t.cells).forEach(([k, subs]) => {
        const [d, p] = k.split('-').map(Number);
        if (d > t.days || p > t.periods) return;
        subs.forEach(sub => list.push({ sub, day: d, period: p, code: isSelf(sub) ? '' : codeOf(g, sub), self: isSelf(sub), common: isCommon(g, sub) }));
      });
      list.sort((a, b) => a.day - b.day || a.period - b.period || (a.code || '99').localeCompare(b.code || '99'));
      o[g] = list;
    });
    return o;
  }, [tt, codes, rosterNorm]);
  const takers = (g, df, sub) => {
    const common = isCommon(g, sub), n = norm(sub);
    return df.filter(s => common || s.takenNorm.has(n)).map(s => s.n).sort((a, b) => a - b);
  };
  const ctx = { selected, exams, tt, classStudents, move, takers, examTitle };
  const typeOf = (g, sub) => (types[g] && types[g][norm(sub)]) || (isCommon(g, sub) ? '통' : '선');
  const setType = (g, sub, v) => setTypes(t => ({ ...t, [g]: { ...(t[g] || {}), [norm(sub)]: v } }));
  const roomMap = useMemo(() => {
    const m = defaultRoomMap(classesByGrade);
    Object.keys(roomOv).forEach(k => { if (k in m) m[k] = roomOv[k]; });
    return m;
  }, [classesByGrade, roomOv]);
  const sx = { ctx, classesByGrade, typeOf, thr, times, editors, roomMap, examTitle };
  const statsD = tab === 'stats' || busy ? statsData(sx) : null;

  /* ---------- 출력 ---------- */
  const guard = () => {
    if (!students.length) { alert('학생 데이터가 없습니다.'); return false; }
    if (!GRADES.some(g => selected[g].length)) { alert('대상 학급을 최소 1개 이상 선택해주세요.'); return false; }
    if (!GRADES.some(g => selected[g].length && exams[g].some(e => !e.self))) { alert('선택한 학년의 시험 시간표에 시험 과목이 없습니다. 시간표를 업로드하거나 [시간표 확인·수정] 탭에서 입력하세요.'); return false; }
    return true;
  };
  const exportFile = async (kind, targets, pairs) => {
    if (targets ? !students.length : !guard()) return;
    setBusy(true); say(kind === 1 ? '과목별 응시현황 엑셀 생성 중...' : kind === 3 ? '반별 결시 학생 현황 엑셀 생성 중...' : kind === 4 ? '고사실 통계 엑셀 생성 중...' : kind === 5 ? '고사실별 결시 현황 엑셀 생성 중...' : '칠판 부착용 B4 출력물 생성 중...', 'info');
    try {
      if (kind === 5) { await downloadWorkbook(buildAbsenceRoomWorkbook(pairs), `정기고사_결시현황_고사실별_양면_A4.xlsx`); say(`✅ 고사실별 결시 학생 현황(양면용, ${pairs.length}개 고사실) 다운로드 완료! 엑셀에서 '양면 인쇄 · 짧은 쪽 넘김'으로 전체 인쇄하세요.`); return; }
      if (kind === 4) { await downloadWorkbook(buildStatsWorkbook(statsData(sx)), `정기고사_고사실별_응시인원_통계_B4.xlsx`); say('✅ [파일 4] 고사실 통계(B4) 다운로드 완료!'); return; }
      if (kind === 3) { const tg = targets || GRADES.flatMap(g => selected[g].map(c => [g, c])); await downloadWorkbook(buildAbsenceWorkbook(ctx, tg), tg.length === 1 ? `정기고사_결시현황_${tg[0][0]}학년${tg[0][1]}반_A4.xlsx` : `정기고사_반별_결시학생현황_A4.xlsx`); say('✅ [파일 3] 반별 결시 학생 현황(A4) 다운로드 완료!'); return; }
      if (kind === 1) { await downloadWorkbook(buildOverviewWorkbook(ctx), `정기고사_선택과목_응시현황_및_확인표.xlsx`); say('✅ [파일 1] 과목별 응시현황 및 응시확인표 다운로드 완료!'); }
      else { await downloadWorkbook(buildChalkboardWorkbook(ctx, targets || GRADES.flatMap(g => selected[g].map(c => [g, c]))), targets && targets.length === 1 ? `정기고사_칠판부착용_${targets[0][0]}학년${targets[0][1]}반_B4.xlsx` : `정기고사_칠판부착용_상세출력물_B4.xlsx`); say('✅ [파일 2] 칠판 부착용 상세 출력물(B4) 다운로드 완료!'); }
    } catch (err) { console.error(err); say(`엑셀 생성 오류: ${err.message}`, 'error'); }
    finally { setBusy(false); }
  };

  /* ---------- 시간표 편집 ---------- */
  const editTT = (g, fn) => setTT(prev => { const next = deepClone(prev); fn(next[g]); return next; });
  const addSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; const cur = t.cells[k] || []; if (!cur.some(x => norm(x) === norm(sub))) t.cells[k] = isSelf(sub) ? [SELF] : [...cur.filter(x => !isSelf(x)), sub]; });
  const removeSub = (g, d, p, sub) => editTT(g, t => { const k = `${d}-${p}`; t.cells[k] = (t.cells[k] || []).filter(x => x !== sub); if (!t.cells[k].length) delete t.cells[k]; });

  /* =============================== 렌더 =============================== */
  const ex = students.filter(s => s.excluded);
  return html`
  <div className="min-h-screen flex flex-col">
    <header className="bg-slate-900 text-white shadow-md">
      <div className="max-w-[1500px] mx-auto px-4 py-5 flex flex-col lg:flex-row justify-between items-center gap-4">
        <h1 className="text-xl sm:text-2xl xl:text-[28px] font-black tracking-tight leading-snug text-center lg:text-left" style=${{ wordBreak: 'keep-all' }}>
          고등학교 정기시험 선택과목 분반 및 <span className="inline-block">시험 시간표 자동 편성 시스템</span></h1>
        <div className="flex items-center gap-2 shrink-0">
          ${VIEWER ? html`<span className="text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/40">일반 사용자용 · 자료 기준 ${VIEWER.createdAt}</span>` : html`
          <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/40">관리자</span>
          <button onClick=${loadSample} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3.5 py-2.5 rounded-lg border border-slate-700">✨ 샘플 데이터 로드</button>
          <button id="saveBtn" onClick=${saveConfig} title=${savedAt ? `마지막 저장: ${savedAt}` : '아직 저장하지 않음'} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3.5 py-2.5 rounded-lg border border-slate-700">💾 설정 저장</button>
          <button id="cfgFileBtn" onClick=${() => setCfgOpen(true)} title="작업 상태를 파일로 백업하거나 다른 PC에서 불러오기" className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3.5 py-2.5 rounded-lg border border-slate-700">📁 설정 파일</button>
          <button id="resetBtn" onClick=${resetConfig} className="bg-slate-800 hover:bg-rose-900 text-rose-200 text-sm px-3.5 py-2.5 rounded-lg border border-slate-700">🔄 설정 초기화</button>
          <button id="lockBtn" onClick=${lockAdmin} title="관리자 화면 잠그기 (다시 들어올 때 비밀번호 필요)" className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-2.5 rounded-lg border border-slate-700">🔒</button>
          <button id="makeViewer" onClick=${makeViewerFile} className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold text-sm px-3.5 py-2.5 rounded-lg">📤 일반 사용자용 파일 만들기</button>`}
        </div>
      </div>
    </header>

    <div className=${`px-6 py-2.5 text-sm font-medium border-b ${msg.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : msg.type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-indigo-50 text-indigo-900 border-indigo-200'}`}>
      <div className="max-w-[1500px] mx-auto flex flex-wrap items-center gap-2" id="status">
        <span>${msg.text}</span>
        <span className="ml-auto text-xs opacity-75">현재 명단: ${sourceLabel || '-'} | 응시 대상 ${students.length - ex.length}명${ex.length ? ` (제외 ${ex.length}명)` : ''}</span>
      </div>
    </div>

    <main className="max-w-[1500px] mx-auto w-full p-4 md:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6 flex-grow">
      ${!VIEWER && html`
      <div className="xl:col-span-4 space-y-4">
        ${/* STEP 1 */''}
        <${Card} step="1" title="시험 선택">
          <div className="grid grid-cols-3 gap-2" id="examPick">
            <label className="text-[11px] font-semibold text-slate-600">학년도
              <select data-exam="year" value=${exam.year} onChange=${e => setExam(x => ({ ...x, year: +e.target.value }))} className="mt-1 w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm font-normal">
                ${[0, 1, 2, 3].map(i => defaultExam().year - 1 + i).map(y => html`<option key=${y} value=${y}>${y}학년도</option>`)}</select></label>
            <label className="text-[11px] font-semibold text-slate-600">학기
              <select data-exam="sem" value=${exam.sem} onChange=${e => setExam(x => ({ ...x, sem: +e.target.value }))} className="mt-1 w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm font-normal">
                ${[1, 2].map(v => html`<option key=${v} value=${v}>${v}학기</option>`)}</select></label>
            <label className="text-[11px] font-semibold text-slate-600">차수
              <select data-exam="round" value=${exam.round} onChange=${e => setExam(x => ({ ...x, round: +e.target.value }))} className="mt-1 w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm font-normal">
                ${[1, 2, 3, 4].map(v => html`<option key=${v} value=${v}>${v}차</option>`)}</select></label>
          </div>
          <div className="mt-2 text-center text-sm font-black text-indigo-800 bg-indigo-50 border border-indigo-200 rounded-lg py-2" id="examTitle">${examTitle}</div>
          <p className="text-[11px] text-slate-500 mt-1.5">시간표 확인, 과목별 응시현황, 반별 응시확인표, 결시 학생 현황의 맨 위 제목에 들어갑니다.</p>
        <//>

        <${Card} step="2" title="학생 선택과목 명단 (1·2·3학년 동시)">
          <p className="text-[11px] text-slate-500 mb-3">학년별 파일 여러 개를 한꺼번에 고르거나, 학년별 시트가 있는 파일 하나를 올리세요. 학년은 학년 열 → 학번 → 시트명/파일명 순서로 자동 감지합니다.</p>
          <div className="grid grid-cols-2 gap-2">
            <label className=${`${btn} bg-indigo-600 hover:bg-indigo-500 text-white`}>⬆ 명단 업로드 (여러 개)
              <input id="rosterInput" type="file" multiple accept=".xlsx,.xls,.xlsm,.csv" onChange=${onRosterUpload} className="hidden" /></label>
            <button onClick=${async () => { await downloadWorkbook(buildRosterTemplate(codes), `선택과목_학생명단_표준양식(1~3학년).xlsx`); say('📥 학생 명단 표준 양식(학년별 시트)이 다운로드되었습니다.'); }} className=${`${btn} bg-slate-800 hover:bg-slate-700 text-white`}>⬇ 명단 양식 다운로드</button>
          </div>
          ${students.length > 0 && html`
            <table className="w-full mt-3 text-xs border border-slate-200 rounded-lg overflow-hidden" id="rosterSummary">
              <thead className="bg-slate-50 text-slate-600"><tr><th className="py-1.5">학년</th><th>학급</th><th>응시 대상</th><th>제외</th><th>명단 과목 열</th></tr></thead>
              <tbody>${presentGrades.map(g => { const gs = students.filter(s => s.g === g); return html`<tr key=${g} className="text-center border-t border-slate-100">
                <td className="py-1.5 font-bold text-indigo-700">${g}학년</td><td>${classesByGrade[g].length}개 반</td>
                <td>${gs.filter(s => !s.excluded).length}명</td><td className=${gs.some(s => s.excluded) ? 'text-rose-600 font-semibold' : 'text-slate-400'}>${gs.filter(s => s.excluded).length}명</td>
                <td>${roster.subjectsByGrade[g].length}개</td></tr>`; })}</tbody>
            </table>
            ${(roster.dup > 0 || roster.unknownGrade > 0) && html`<p className="text-[11px] text-amber-700 mt-2">⚠ ${roster.dup ? `중복 행 ${roster.dup}개(나중 행으로 덮어씀) ` : ''}${roster.unknownGrade ? `학년을 알 수 없어 빠진 학생 ${roster.unknownGrade}명` : ''}</p>`}
            <details className="mt-2 text-xs" open=${ex.length > 0 && ex.length <= 8}>
              <summary className="text-slate-600 font-semibold">자동 제외된 학생 ${ex.length}명</summary>
              ${ex.length === 0 ? html`<p className="text-slate-400 mt-1">없음</p>` : html`<ul className="mt-1 space-y-0.5" id="excludedList">${ex.map(s => html`<li key=${`${s.g}-${s.c}-${s.n}`} className="flex gap-2"><span className="font-semibold">${s.g}학년 ${s.c}반 ${s.n}번</span><span>${s.name}</span><span className="ml-auto text-rose-600">${s.reason}</span></li>`)}</ul>`}
            </details>`}
          <div className="mt-3 pt-3 border-t border-slate-100">
            <div className="text-[11px] font-semibold text-slate-600 mb-1">자동 제외 키워드 (쉼표로 구분 · 명단의 이름/비고 등 어느 칸에 있어도 제외)</div>
            <div className="flex gap-2"><input value=${keywords} onChange=${e => setKeywords(e.target.value)} className="flex-1 border border-slate-300 rounded-md px-2 py-1 text-xs" />
              <button onClick=${reapplyKeywords} className="text-xs px-2.5 rounded-md bg-slate-100 hover:bg-slate-200 border border-slate-300">다시 적용</button></div>
          </div>
        <//>

        <${Card} step="3" title="시험 시간표 및 과목코드 (학년별)">
          <p className="text-[11px] text-slate-500 mb-3">'1학년 시간표'~'3학년 시간표', '1학년 과목코드'~'3학년 과목코드' 시트가 있는 파일 하나를 올리세요. 업로드 후 [시간표 확인·수정] 탭에서 직접 고칠 수 있습니다.</p>
          <div className="grid grid-cols-2 gap-2">
            <label className=${`${btn} bg-emerald-600 hover:bg-emerald-500 text-white`}>⬆ 시간표 업로드

              <input type="number" min="0" max="50" value=${move[g].count} data-move-grade=${g}

        <${Card} step="5" title="대상 학급 선택" right=${html`<div className="flex gap-1 text-[11px]">
            <button className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200" onClick=${() => setSel(s => Object.fromEntries(Object.keys(s).map(k => [k, true])))}>전체 선택</button>

          <div className="flex border-b border-slate-200 mb-3" role="tablist">
            ${GRADES.map(g => { const total = classesByGrade[g].length, on = selected[g].length; return html`<button key=${g} disabled=${!total} onClick=${() => setSelGrade(g)}
              className=${`flex-1 py-2 text-xs font-semibold border-b-2 -mb-px ${selGrade === g ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500'} ${!total ? 'opacity-40' : ''}`}>

            <div className="flex justify-between items-center mb-2">

                checked=${selected[selGrade].length === classesByGrade[selGrade].length}
                onChange=${e => setSel(s => ({ ...s, ...Object.fromEntries(classesByGrade[selGrade].map(c => [clsKey(selGrade, c), e.target.checked])) }))} /> ${selGrade}학년 전체</label>
              <span className="text-[11px] text-slate-400">선택 학급 합계: ${GRADES.reduce((a, g) => a + selected[g].length, 0)}개</span>
            </div>
            <div className="grid grid-cols-4 gap-1.5">
              ${classesByGrade[selGrade].map(c => { const k = clsKey(selGrade, c), n = classStudents(selGrade, c).filter(s => !s.excluded).length; return html`<label key=${k}
                className=${`flex flex-col items-center p-1.5 rounded-lg border cursor-pointer text-xs ${sel[k] ? 'border-indigo-500 bg-indigo-50 text-indigo-900' : 'border-slate-200 text-slate-500'}`}>

/* -------------------------- 시간표 확인·수정 탭 -------------------------- */
function TimetableEditor({ typeOf, setType, examTitle, g, setG, tt, codes, exams, roster, hasStudents, codeOf, isCommon, addSub, removeSub, editTT }) {
  const t = tt[g];
  const days = Array.from({ length: t.days }, (_, i) => i + 1);
  const periods = Array.from({ length: t.periods }, (_, i) => i + 1);
  const placed = new Map();
  Object.entries(t.cells).forEach(([k, subs]) => subs.forEach(s => { if (!isSelf(s)) placed.set(norm(s), [...(placed.get(norm(s)) || []), k]); }));
  const codeList = codes[g] || [];
  const extra = roster.subjectsByGrade[g].filter(s => !codeList.some(c => norm(c.name) === norm(s)));
  const list = exams[g].filter(e => !e.self && e.day <= t.days && e.period <= t.periods);
  const noCode = [...new Set(list.filter(e => !e.code).map(e => e.sub))];
  const common = hasStudents ? [...new Set(list.filter(e => e.common).map(e => e.sub))] : [];
  const dups = [...placed.entries()].filter(([, ks]) => ks.length > 1).map(([n]) => list.find(e => norm(e.sub) === n)?.sub).filter(Boolean);
  const notScheduled = roster.subjectsByGrade[g].filter(s => !placed.has(norm(s)));
  const [showCodes, setShowCodes] = useState(false);
  const opt = (name, label, k) => html`<option key=${k} value=${name}>${label}${placed.has(norm(name)) ? ' ✓' : ''}</option>`;

  return html`<div>
    <div className="text-center mb-3" id="ttTitle"><div className="text-xs font-bold text-slate-500">${examTitle}</div><div className="text-lg font-black">${g}학년 시험 시간표</div></div>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
      <${Seg} value=${g} onChange=${setG} options=${GRADES.map(x => [x, `${x}학년`])} />
      <div className="flex flex-wrap gap-1.5 text-[11px]">
        <span className="self-center text-slate-500 mr-1">교시</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.max(1, x.periods - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.periods}교시</span>
        <button id="addPeriod" className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.periods = Math.min(6, x.periods + 1); })}>+</button>
        <span className="self-center text-slate-500 ml-3 mr-1">일차</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.max(1, x.days - 1); })}>−</button>
        <span className="self-center font-bold w-8 text-center">${t.days}일</span>
        <button className="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50" onClick=${() => editTT(g, x => { x.days = Math.min(10, x.days + 1); })}>+</button>
        <button className="ml-3 px-2 py-1 rounded border border-rose-200 text-rose-600 hover:bg-rose-50" onClick=${() => { if (confirm(`${g}학년 시간표의 과목을 모두 비울까요?`)) editTT(g, x => { x.cells = {}; }); }}>비우기</button>
      </div>
    </div>
    <div className="overflow-x-auto">
      <table className="w-full border-collapse text-xs" id="ttTable">
        <thead><tr className="bg-slate-100">
          <th className="border border-slate-300 p-2 w-16">교시</th>
          ${days.map(d => html`<th key=${d} className="border border-slate-300 p-1.5 min-w-[140px]">
            <div className="font-bold">${d}일차</div>
            <input value=${t.labels[d] || ''} placeholder="날짜 입력" onChange=${e => { const v = e.target.value; editTT(g, x => { x.labels[d] = v; }); }}
              className="mt-1 w-full text-center text-[11px] font-normal border border-slate-200 rounded px-1 py-0.5 bg-white" /></th>`)}
        </tr></thead>
        <tbody>${periods.map(p => html`<tr key=${p}>
          <td className=${`border border-slate-300 text-center font-bold ${p >= 4 ? 'bg-amber-50' : 'bg-slate-50'}`}>${p}교시</td>
          ${days.map(d => { const subs = t.cells[`${d}-${p}`] || []; return html`<td key=${d} className="border border-slate-300 p-1.5 align-top" data-cell=${`${d}-${p}`}>
            <div className="flex flex-col gap-1">
              ${subs.map(s => { const self = isSelf(s), code = self ? '' : codeOf(g, s), cm = hasStudents && isCommon(g, s);
                return html`<div key=${s} className=${`relative rounded-md px-2 py-1 pr-5 border ${self ? 'bg-slate-100 border-slate-300 text-slate-500' : !code ? 'bg-amber-50 border-amber-300' : 'bg-indigo-50 border-indigo-200 text-indigo-900'}`}>
                  <div className="font-semibold leading-tight">${s}</div>
                  <div className="text-[10px] opacity-75">${self ? '자습 · 시험 없음' : code ? `코드 ${code}` : '코드 없음'}${cm ? ' · 전원 응시' : ''}</div>
                  ${!self && html`<div className="mt-1 inline-flex rounded-md overflow-hidden border border-slate-300 bg-white" role="group" data-type=${s}>
                    ${['통', '선'].map(v => html`<button key=${v} type="button" title=${v === '통' ? '공통과목' : '선택과목'} onClick=${() => setType(g, s, v)}
                      className=${`px-2 py-0.5 text-[10px] font-bold ${typeOf(g, s) === v ? (v === '통' ? 'bg-sky-600 text-white' : 'bg-violet-600 text-white') : 'text-slate-500 hover:bg-slate-50'}`}>${v === '통' ? '통(공통)' : '선(선택)'}</button>`)}</div>`}
                  <button title="삭제" onClick=${() => removeSub(g, d, p, s)} className="absolute top-0.5 right-1 text-slate-400 hover:text-rose-600 font-bold">×</button></div>`; })}
              <select value="" onChange=${e => { if (e.target.value) addSub(g, d, p, e.target.value); }} className="tt-select w-full border border-dashed border-slate-300 rounded px-1 py-1 text-slate-500 bg-white">
                <option value="">+ 과목 추가</option>
                <option value=${SELF}>자기주도학습 (시험 없음)</option>
                <optgroup label=${`${g}학년 과목코드`}>${codeList.map(c => opt(c.name, `${c.code} ${c.name}`, c.code + c.name))}</optgroup>
                ${extra.length > 0 && html`<optgroup label="명단에만 있는 과목 (코드 없음)">${extra.map(s => opt(s, s, 'x' + s))}</optgroup>`}
              </select>
            </div></td>`; })}
        </tr>`)}</tbody>
      </table>
    </div>
    <div className="mt-3 space-y-1.5 text-[11px]" id="ttWarnings">
      ${noCode.length > 0 && html`<p className="text-amber-700">⚠ 과목코드가 없는 과목: ${noCode.join(', ')} → '${g}학년 과목코드' 시트에 추가하세요.</p>`}
      ${dups.length > 0 && html`<p className="text-amber-700">⚠ 두 번 이상 배치된 과목: ${dups.join(', ')}</p>`}
      <p className="text-slate-500">ℹ 각 과목의 <b>통(공통)/선(선택)</b> 버튼은 고사실 통계의 감독 배치 기준(본반+이동반 조합)에 쓰입니다. 처음에는 명단에 열이 없는 과목을 통, 있는 과목을 선으로 둡니다.</p>
      ${common.length > 0 && html`<p className="text-sky-700">ℹ 명단에 해당 과목 열이 없어 <b>학년 전원 응시(공통과목)</b>로 처리: ${common.join(', ')}</p>`}
      ${hasStudents && notScheduled.length > 0 && html`<p className="text-slate-500">ℹ 명단에는 있지만 시간표에 없는 과목: ${notScheduled.join(', ')}</p>`}
    </div>
    <div className="mt-3">
      <button className="text-[11px] text-indigo-600 underline" onClick=${() => setShowCodes(v => !v)}>${showCodes ? '과목코드 목록 접기' : `${g}학년 과목코드 목록 보기 (${codeList.length}개)`}</button>
      ${showCodes && html`<div className="mt-2 grid grid-cols-2 md:grid-cols-4 gap-1 text-[11px]">${codeList.map(c => html`<div key=${c.code + c.name} className="border border-slate-200 rounded px-2 py-1"><b className="text-indigo-700">${c.code}</b> ${c.name}</div>`)}</div>`}
    </div>
  </div>`;
}

/* ----------------------- 미리보기 공통: 학년·학급 선택 ----------------------- */
function GradeClassPicker({ g, c, onChange, presentGrades, classesByGrade, selected, allowAll }) {

  return html`<div className="flex items-center gap-2 text-xs">
    <label className="flex items-center gap-1">학년
      <select data-pick="grade" value=${g} onChange=${e => { const ng = +e.target.value; onChange(ng, allowAll ? 'all' : (classesByGrade[ng] || [])[0]); }} className="border border-slate-300 rounded px-1.5 py-1">
        ${presentGrades.map(x => html`<option key=${x} value=${x}>${x}학년</option>`)}</select></label>
    <label className="flex items-center gap-1">학급
      <select data-pick="class" value=${c} onChange=${e => onChange(g, e.target.value === 'all' ? 'all' : +e.target.value)} className="border border-slate-300 rounded px-1.5 py-1">
        ${allowAll && html`<option value="all">선택 학급 전체</option>`}
        ${classes.map(x => html`<option key=${x} value=${x}>${x}반${selected[g].includes(x) ? '' : ' (미선택)'}</option>`)}</select></label>
  </div>`;
}
const pbtn = 'px-3 py-1.5 rounded-lg text-xs font-semibold disabled:opacity-50';
// 실제 크기 HTML 페이지를 화면 폭에 맞게 축소해서 보여준다
function ScaledPage({ htmlStr, widthPx, heightPx, zoom }) {
  const ref = useRef(null);
  const [boxW, setBoxW] = useState(900);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(() => setBoxW(el.clientWidth)); ro.observe(el); return () => ro.disconnect();
  }, []);
  const z = zoom === 'fit' ? Math.min(1, (boxW - 16) / widthPx, Math.max(360, window.innerHeight - 140) / heightPx) : parseInt(zoom) / 100;
  return html`<div ref=${ref} className="bg-slate-200 rounded-lg p-2 overflow-auto">
    <div style=${{ width: widthPx * z, height: heightPx * z }} className="mx-auto shadow-lg">
      <div style=${{ width: widthPx, transform: `scale(${z})`, transformOrigin: 'top left' }} dangerouslySetInnerHTML=${{ __html: htmlStr }} />
    </div></div>`;
}
const MM = 96 / 25.4;

/* ------------------------- 칠판 부착용 B4 미리보기 ------------------------- */
function ChalkboardPreview({ pv, setPv, ctx, classesByGrade, presentGrades, onExport, onExportClass, busy }) {
  const { selected, tt } = ctx;
  const g = presentGrades.includes(pv.g) ? pv.g : presentGrades[0];
  if (!g) return html`<p className="text-sm text-slate-400">명단을 먼저 업로드하세요.</p>`;
  const classes = classesByGrade[g];
  const c = classes.includes(pv.c) ? pv.c : classes[0];
  const { df, range, pages } = chalkPagesFor(g, c, pv.kind, ctx);
  const pg = pages.find(p => p.day === pv.day) || pages[0];
  const set = o => setPv(p => ({ ...p, ...o }));
  const selTargets = GRADES.flatMap(x => selected[x].map(y => [x, y]));
  return html`<div>
    <div className="flex flex-wrap items-center gap-3 mb-2">

/* ------------------------------ 고사실 통계 탭 (관리자) ------------------------------ */
// 내용 폭에 맞춰 축소해 보여 주는 상자
function FitWidth({ htmlStr, designPx }) {
  const ref = useRef(null);
  const [w, setW] = useState(900);
  useEffect(() => { const el = ref.current; if (!el) return; const ro = new ResizeObserver(() => setW(el.clientWidth)); ro.observe(el); return () => ro.disconnect(); }, []);
  const z = Math.min(1, (w - 24) / designPx);
  return html`<div ref=${ref} className="bg-slate-200 rounded-lg p-3 overflow-auto">
    <div className="bg-white shadow-lg p-3 mx-auto" style=${{ width: designPx * z + 24 }}><div style=${{ zoom: z }} dangerouslySetInnerHTML=${{ __html: htmlStr }} /></div></div>`;
}
// 접었다 펼 수 있는 구역 (입력칸이 다시 그려지며 포커스를 잃지 않도록 바깥에 정의)

      <span className="text-sm font-bold text-slate-800">${title} <span className="font-normal text-xs text-slate-500">${sub}</span></span><span className="text-slate-400 text-xs">${open ? '접기 ▲' : '열기 ▼'}</span></button>
    ${open && html`<div className="px-4 pb-4">${children}</div>`}</div>`;
}
